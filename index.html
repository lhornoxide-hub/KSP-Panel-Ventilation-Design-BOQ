<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP Panel Report & IEC 60617 Schematic Studio</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111827;
    --panel2: #1e293b;
    --border: #2d3b4e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Sarabun", "Tahoma", "Leelawadee UI", "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    height: 100%; overflow: hidden;
  }
  .app-shell { display: flex; height: 100vh; width: 100vw; }
  /* Sidebar */
  .sidebar {
    width: 390px; min-width: 360px; max-width: 420px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sb-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; background: #0f172a;
  }
  .sb-head img { width: 46px; height: auto; }
  .sb-title { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.25; }
  .sb-sub { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .sb-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .sb-foot { padding: 10px 14px; border-top: 1px solid var(--border); background: #0f172a; display: flex; flex-direction: column; gap: 6px; }

  .card {
    background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .card-title {
    font-size: 11.5px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  input[type="text"], input[type="number"], select {
    width: 100%; background: var(--panel2); border: 1px solid #334155; color: #f8fafc;
    border-radius: 5px; padding: 6px 8px; font-size: 12px; outline: none;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .seg-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
  .seg-btn {
    padding: 6px 4px; border: 1px solid #334155; background: var(--panel2); color: var(--muted);
    border-radius: 5px; cursor: pointer; font-size: 11.5px; font-weight: 600; text-align: center;
  }
  .seg-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .brand-btn {
    padding: 7px 8px; border: 1px solid #334155; background: var(--panel2); color: #cbd5e1;
    border-radius: 6px; cursor: pointer; font-size: 11px; text-align: left; line-height: 1.3;
  }
  .brand-btn b { display: block; font-size: 11.5px; color: #fff; }
  .brand-btn.active { border-color: var(--green); background: rgba(34, 197, 94, 0.14); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip {
    padding: 3px 7px; border-radius: 4px; border: 1px solid #334155; background: var(--panel2);
    color: #cbd5e1; font-size: 11px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: #fff; }
  .chip.active { background: #0369a1; border-color: #38bdf8; color: #fff; }
  .btn {
    border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .btn-primary { background: #0284c7; color: #fff; width: 100%; }
  .btn-primary:hover { background: #0369a1; }
  .btn-sec { background: var(--panel2); color: #e2e8f0; border: 1px solid #334155; font-size: 11px; padding: 6px 8px; }
  .btn-sec:hover { border-color: var(--accent); }
  .warn-box {
    background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.5);
    color: #fbbf24; font-size: 11px; padding: 6px 8px; border-radius: 5px; margin-top: 6px; display: none;
  }

  /* Main Preview Area */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #1e293b; }
  .toolbar {
    background: #0f172a; border-bottom: 1px solid var(--border); padding: 8px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .metrics { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .metric-pill {
    background: var(--panel2); border: 1px solid #334155; border-radius: 5px;
    padding: 4px 8px; font-size: 11px; color: #cbd5e1;
  }
  .metric-pill b { color: #38bdf8; }
  .nav-bar {
    background: #111827; border-bottom: 1px solid var(--border); padding: 6px 14px;
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
  }
  .sheet-tab {
    padding: 4px 9px; border-radius: 4px; border: 1px solid #334155; background: #1e293b;
    color: #94a3b8; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .sheet-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 700; }

  .canvas-scroll {
    flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: #334155;
  }
  .pdf-sheet {
    background: #ffffff; color: #000000;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    flex-shrink: 0;
    transform-origin: top center;
  }
  .pdf-sheet.hidden-preview { display: none; }
  .pdf-sheet svg { display: block; width: 100%; height: 100%; }

  /* Offline A4 Landscape Print Engine */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body {
      width: 297mm; height: auto !important; overflow: visible !important;
      background: #ffffff !important; margin: 0 !important; padding: 0 !important;
    }
    .sidebar, .toolbar, .nav-bar, .no-print { display: none !important; }
    .app-shell, .main, .canvas-scroll {
      display: block !important; width: 100% !important; height: auto !important;
      overflow: visible !important; background: #ffffff !important; padding: 0 !important; margin: 0 !important;
    }
    .pdf-sheet {
      display: block !important;
      width: 297mm !important; height: 210mm !important;
      box-shadow: none !important; margin: 0 !important; padding: 0 !important;
      page-break-after: always !important; break-after: page !important;
      overflow: hidden !important;
    }
    .pdf-sheet.hidden-preview { display: block !important; }
    .pdf-sheet:last-child { page-break-after: auto !important; break-after: auto !important; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar no-print">
    <div class="sb-head">
      <img id="uiLogo" alt="KSP Logo">
      <div>
        <div class="sb-title">KSP Panel Report Studio</div>
        <div class="sb-sub" data-i18n="ui_sub">IEC 60617 Multi-Sheet Schematic &amp; PDF Generator</div>
      </div>
    </div>
    <div style="padding:6px 14px;background:#0b1222;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
      <button class="seg-btn" id="lang_th" onclick="setLang('th')" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#A51931"/><rect y="2" width="18" height="8" fill="#F4F5F8"/><rect y="4" width="18" height="4" fill="#2D2A4A"/></svg><span>ไทย</span></button>
      <button class="seg-btn active" id="lang_en" onclick="setLang('en')" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#012169"/><path d="M0,0 L18,12 M18,0 L0,12" stroke="#FFF" stroke-width="2.2"/><path d="M0,0 L18,12 M18,0 L0,12" stroke="#C8102E" stroke-width="1.1"/><path d="M9,0 V12 M0,6 H18" stroke="#FFF" stroke-width="3.6"/><path d="M9,0 V12 M0,6 H18" stroke="#C8102E" stroke-width="2"/></svg><span>EN</span></button>
      <button class="seg-btn" id="lang_vi" onclick="setLang('vi')" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#DA251D"/><polygon points="9,2.2 10.1,5.4 13.4,5.4 10.7,7.3 11.7,10.5 9,8.6 6.3,10.5 7.3,7.3 4.6,5.4 7.9,5.4" fill="#FFCD00"/></svg><span>Tiếng Việt</span></button>
      <button class="seg-btn" id="lang_zh" onclick="setLang('zh')" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#DE2910"/><polygon points="3.6,1.8 4.2,3.6 6.0,3.6 4.5,4.7 5.1,6.4 3.6,5.3 2.1,6.4 2.7,4.7 1.2,3.6 3.0,3.6" fill="#FFDE00"/><circle cx="7.4" cy="1.8" r="0.55" fill="#FFDE00"/><circle cx="8.4" cy="3.1" r="0.55" fill="#FFDE00"/><circle cx="8.4" cy="4.8" r="0.55" fill="#FFDE00"/><circle cx="7.4" cy="6.1" r="0.55" fill="#FFDE00"/></svg><span>简体中文</span></button>
    </div>

    <div class="sb-body">
      <!-- Project Metadata -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c1">1. ข้อมูลโครงการ &amp; เอกสาร</div>
        <div style="margin-bottom:6px">
          <label data-i18n="ui_cust">ชื่อลูกค้า / ฟาร์ม (Customer)</label>
          <input type="text" id="inCustomer" value="............................................................">
        </div>
        <div class="grid-2" style="margin-bottom:6px">
          <div>
            <label data-i18n="ui_code">รหัสแบบ (Code No.)</label>
            <input type="text" id="inCode" placeholder="Auto">
          </div>
          <div>
            <label data-i18n="ui_date">Revise / Date</label>
            <input type="text" id="inDate" value="2026-11">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label data-i18n="ui_draft">Draftman / ผู้เขียนแบบ</label>
            <input type="text" id="inDraftman" value="KSP ENG">
          </div>
          <div>
            <label data-i18n="ui_appr">Approved / ผู้อนุมัติ</label>
            <input type="text" id="inApproved" value="">
          </div>
        </div>
      </div>

      <!-- Mode & Fans -->
      <div class="card">
        <div class="card-title">
          <span data-i18n="ui_c2">2. โหมดระบบ &amp; จำนวนพัดลม</span>
          <button class="chip" onclick="applyHybrid30()" data-i18n="ui_auto30">Auto 30% EC</button>
        </div>
        <div class="seg-group">
          <button class="seg-btn active" id="mode_all_ec" onclick="setMode('All-EC')">All-EC</button>
          <button class="seg-btn" id="mode_all_ac" onclick="setMode('All-AC')">All-AC</button>
          <button class="seg-btn" id="mode_hybrid" onclick="setMode('Hybrid_30EC')">Hybrid 30%</button>
          <button class="seg-btn" id="mode_manual" onclick="setMode('Manual')" data-i18n="ui_manual">Manual</button>
        </div>
        <label data-i18n="ui_quick_fans">เลือกจำนวนพัดลมรวมด่วน (1 โรงเรือน)</label>
        <div class="chip-row" id="fanPresets"></div>

        <div class="grid-2" style="margin-top:8px">
          <div>
            <label data-i18n="ui_ec_cnt">จำนวนพัดลม EC (0–32)</label>
            <input type="number" id="inEcCount" min="0" max="32" value="8" oninput="onManualFanChange()" onchange="onManualFanChange()">
          </div>
          <div>
            <label data-i18n="ui_ac_cnt">จำนวนพัดลม AC (0–32)</label>
            <input type="number" id="inAcCount" min="0" max="32" value="0" oninput="onManualFanChange()" onchange="onManualFanChange()">
          </div>
        </div>

        <div id="ecModelBox" style="margin-top:8px">
          <label data-i18n="ui_ec_mod">รุ่นพัดลม EC (BESS Lab / Custom)</label>
          <select id="selEcModel" onchange="onModelSelect('EC')">
            <option value="24611">#24611 Agrifan ZP-50 EC (1.5kW | 3.07A | 30,500 CFM)</option>
            <option value="26238">#26238 Agrifan ZMD50 EC (1.5kW | 3.23A | 27,400 CFM)</option>
            <option value="20285">#20285 Agrifan 56" Var (1.5kW | 2.46A | 26,800 CFM)</option>
            <option value="custom_ec" data-i18n="ui_cust_ec">Custom EC Motor (กำหนด kW / A / CFM)</option>
          </select>
          <div id="customEcFields" class="grid-3" style="margin-top:6px;display:none">
            <div><label>kW</label><input type="number" step="0.1" id="custEcKw" value="1.5" onchange="renderAll()"></div>
            <div><label>Amps</label><input type="number" step="0.01" id="custEcAmp" value="3.07" onchange="renderAll()"></div>
            <div><label>CFM</label><input type="number" step="100" id="custEcCfm" value="30500" onchange="renderAll()"></div>
          </div>
        </div>

        <div id="acModelBox" style="margin-top:8px">
          <label data-i18n="ui_ac_mod">รุ่นพัดลม AC (BESS Lab / Custom)</label>
          <select id="selAcModel" onchange="onModelSelect('AC')">
            <option value="24579">#24579 Agrifan ZP50 AC (1.8kW | 4.90A | 30,100 CFM)</option>
            <option value="26237">#26237 Agrifan ZMD50 AC (1.5kW | 4.60A | 26,700 CFM)</option>
            <option value="custom_ac" data-i18n="ui_cust_ac">Custom AC Motor (กำหนด kW / A / CFM)</option>
          </select>
          <div id="customAcFields" class="grid-3" style="margin-top:6px;display:none">
            <div><label>kW</label><input type="number" step="0.1" id="custAcKw" value="1.8" onchange="renderAll()"></div>
            <div><label>Amps</label><input type="number" step="0.01" id="custAcAmp" value="4.90" onchange="renderAll()"></div>
            <div><label>CFM</label><input type="number" step="100" id="custAcCfm" value="30100" onchange="renderAll()"></div>
          </div>
        </div>
      </div>

      <!-- 4 Sources -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c3">3. แหล่งผลิตและยี่ห้ออุปกรณ์ (4 รูปแบบ)</div>
        <div class="brand-grid">
          <button class="brand-btn active" id="src_master" onclick="setSource('master')"><b data-i18n="ui_src_master">🇹🇭 ไทย: Schneider</b>iK60N / CVS / LC1D / LRD</button>
          <button class="brand-btn" id="src_th" onclick="setSource('th')"><b data-i18n="ui_src_th">🇹🇭 ไทย: Mitsubishi</b>BH-D6 / NF-CV / S-T10 / TH-T18</button>
          <button class="brand-btn" id="src_vn" onclick="setSource('vn')"><b data-i18n="ui_src_vn">🇻🇳 เวียดนาม: LS</b>LA63N / ABE / GMC-9M / MT-12</button>
          <button class="brand-btn" id="src_cn" onclick="setSource('cn')"><b data-i18n="ui_src_cn">🇨🇳 จีน: Chint</b>NXB-63 / NM1 / NC1 / NR2-25</button>
        </div>
      </div>

      <!-- Cabinet & Controls -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c4">4. ตู้ควบคุม &amp; ระบบป้องกัน</div>
        <div class="grid-2" style="margin-bottom:6px">
          <div>
            <label data-i18n="ui_cab">ขนาดตู้ (mm IP55)</label>
            <select id="selCab" onchange="renderAll()">
              <option value="auto" data-i18n="ui_cab_auto">อัตโนมัติ (แนะนำตามจำนวน)</option>
              <option value="570x690x250">570×690×250 (≤4)</option>
              <option value="800x1200x250">800×1200×250 (≤10)</option>
              <option value="800x1500x400">800×1500×400 (≤16)</option>
              <option value="1000x1800x450">1000×1800×450 (≤20)</option>
              <option value="1200x1800x450">1200×1800×450 (21–28 / 2-Door)</option>
              <option value="1200x2000x500">1200×2000×500 (29–32 / 2-Door)</option>
            </select>
          </div>
          <div>
            <label data-i18n="ui_ctrlv">แรงดันคอยล์ควบคุม</label>
            <select id="selCtrlV" onchange="renderAll()">
              <option value="auto" data-i18n="ui_ctrl_auto">อัตโนมัติ (EC=24VDC / AC=220V)</option>
              <option value="24VDC">24VDC Wide-Range</option>
              <option value="220VAC">220VAC Standard</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:6px">
          <label>Phase Protection Relay (PPR1)</label>
          <select id="selPpr" onchange="renderAll()">
            <option value="Selec 900VPR-BL-U">Selec 900VPR-BL-U (Wide 160-520V)</option>
            <option value="WIP W-OP4">WIP W-OP4 Phase Protection</option>
          </select>
        </div>
        <div style="margin-bottom:6px">
          <label data-i18n="ui_opt1">Option 1: Digital Power Meter (PM1 + CT 3x)</label>
          <div class="seg-group" style="margin-bottom:4px">
            <button class="seg-btn active" id="pm_off" onclick="setPmOpt(false)" data-i18n="ui_pm_off">ไม่ติด Power Meter</button>
            <button class="seg-btn" id="pm_on" onclick="setPmOpt(true)" data-i18n="ui_pm_on">ติด Power Meter (PM1)</button>
          </div>
        </div>
        <div id="rs485Box" style="margin-bottom:6px;display:none">
          <label data-i18n="ui_opt2">Option 2: วงจรเชื่อมต่อ RS485 (A+ / B- / SHLD)</label>
          <div class="seg-group" style="margin-bottom:4px">
            <button class="seg-btn active" id="rs_off" onclick="setRs485Opt(false)" data-i18n="ui_rs_off">ไม่ใช้ RS485 (เฉพาะที่ตู้)</button>
            <button class="seg-btn" id="rs_on" onclick="setRs485Opt(true)" data-i18n="ui_rs_on">ใช้ RS485 (เชื่อม Smart Pig)</button>
          </div>
          <div id="rs485Note" style="font-size:10.5px;color:#93c5fd;line-height:1.35;margin-top:2px;"></div>
        </div>
        <div id="bomImpactNote" style="font-size:10.5px;color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:5px 7px;margin-bottom:6px;"></div>
        <div style="margin-bottom:4px">
          <label data-i18n="ui_opt3">Option 3: คู่มือฟังก์ชัน &amp; การแก้ไขปัญหา (+3 หน้า)</label>
          <div class="seg-group">
            <button class="seg-btn active" id="man_on" onclick="setManualOpt(true)" data-i18n="ui_man_on">เปิด: แนบคู่มือ (+3 หน้า)</button>
            <button class="seg-btn" id="man_off" onclick="setManualOpt(false)" data-i18n="ui_man_off">ปิด: เฉพาะแบบวงจร</button>
          </div>
        </div>
        <div id="cabWarn" class="warn-box"></div>
      </div>
    </div>

    <div class="sb-foot">
      <button class="btn btn-primary" onclick="printFullReport()" data-i18n="ui_print">🖨️ พิมพ์ / Save Report PDF (A4 แนวนอน ครบทุกหน้า)</button>
      <div class="grid-3">
        <button class="btn btn-sec" onclick="savePreset()" data-i18n="ui_save">💾 Save</button>
        <button class="btn btn-sec" onclick="exportJsonConfig()">📄 JSON</button>
        <button class="btn btn-sec" onclick="exportCsvBom()">📊 BOM CSV</button>
      </div>
      <div style="text-align:center;margin-top:2px;">
        <button class="chip" onclick="resetPreset()" style="font-size:10px;border:none;background:transparent;color:var(--muted);" data-i18n="ui_reset">↺ รีเซ็ตค่าเริ่มต้น (8 EC All-EC)</button>
      </div>
    </div>
  </aside>

  <!-- RIGHT MAIN PREVIEW -->
  <main class="main">
    <div class="toolbar no-print">
      <div class="metrics" id="topMetrics"></div>
      <div style="display:flex; gap:6px; align-items:center;">
        <button class="btn btn-sec" onclick="stepSheet(-1)" data-i18n="ui_prev">◀ ก่อนหน้า</button>
        <span id="lblSheetPos" style="font-size:12px; font-weight:700; min-width:75px; text-align:center;">R01 / R16</span>
        <button class="btn btn-sec" onclick="stepSheet(1)" data-i18n="ui_next">ถัดไป ▶</button>
        <select id="selZoom" style="width:95px" onchange="applyZoom()">
          <option value="fit">Fit Page</option>
          <option value="1">100%</option>
          <option value="1.25" selected>125%</option>
          <option value="1.5">150%</option>
        </select>
        <button class="btn btn-sec" id="btnAllView" onclick="toggleAllView()" data-i18n="ui_viewall">ดูทุกหน้า</button>

function t(k, vars={}) {
  const dict = I18N[state.lang] || I18N.th;
  let str = dict[k] !== undefined ? dict[k] : (I18N.th[k] || k);
  for (const [vk, vv] of Object.entries(vars)) str = str.replace(new RegExp(`\\{${vk}\\}`, 'g'), vv);
  return str;
}

function applyUiLanguage() {
  document.documentElement.lang = state.lang;
  ['th','en','vi','zh'].forEach(l => {
    const el = document.getElementById(`lang_${l}`);
    if (el) el.classList.toggle('active', l === state.lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  const btnAll = document.getElementById('btnAllView');
  if (btnAll) btnAll.textContent = state.showAll ? t('ui_viewone') : t('ui_viewall');
  // Update fan preset chip units
  document.querySelectorAll('#fanPresets .chip').forEach(c => {
    c.textContent = `${c.dataset.n} ${t('fan_unit')}`;
  });
}

function setLang(l) {
  if (!I18N[l]) return;
  state.lang = l;
  applyUiLanguage();
  renderAll();
}

// SVG Builder helpers
const C = { BLK:'#000000', GRY:'#595959', LGRY:'#c7c7c7', BLU:'#0d40a6', RED:'#bf1919', GRN:'#0d732e', YEL:'#f2d940', OYL:'#e6ad0d', TGRN:'#33a64d', BG:'#f5f7fa' };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const L = (x1,y1,x2,y2,col=C.BLK,w=0.9,dash='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const R = (x,y,w,h,col=C.BLK,fill='none',width=0.9,dash='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" stroke="${col}" fill="${fill}" stroke-width="${width}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const Cir = (cx,cy,r,col=C.BLK,fill='none',w=0.8,dash='') => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${col}" fill="${fill}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const Dot = (cx,cy,col=C.BLK,r=1.8) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" />`;
const Txt = (x,y,t,sz=7,col=C.BLK,bold=false,anchor='start',rot=0) => {
  const tf = rot ? ` transform="rotate(${rot} ${x} ${y})"` : '';
  return `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${bold?'700':'400'}" fill="${col}" text-anchor="${anchor}"${tf}>${esc(t)}</text>`;
};
const Poly = (pts,col=C.BLK,fill='none',w=0.8) => `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" stroke="${col}" fill="${fill}" stroke-width="${w}" />`;

function drawQuarterLamp(cx, cy, col, lblTop='', tagBot='', r=5.0) {
  let s = '';
  if (lblTop) {
    const bw = Math.max(9.5, r * 2.0);
    s += R(cx - bw, cy - r - 8.5, bw * 2, 6.5, C.BLK, '#fff', 0.45);
    s += Txt(cx - bw + 1.5, cy - r - 3.5, lblTop.slice(0, 6), 3.4, C.BLK, true);
  }
  s += Cir(cx, cy, r, C.BLK, '#fff', 0.65);
  s += `<path d="M${cx},${cy} L${cx+r},${cy} A${r},${r} 0 0,0 ${cx},${cy-r} Z" fill="${col}" stroke="${C.BLK}" stroke-width="0.4"/>`;
  s += `<path d="M${cx},${cy} L${cx-r},${cy} A${r},${r} 0 0,0 ${cx},${cy+r} Z" fill="${col}" stroke="${C.BLK}" stroke-width="0.4"/>`;
  if (tagBot) s += Txt(cx + r + 1.2, cy + 3, tagBot, 3.8, col, true);
  return s;
}

function drawRealisticSelector(cx, cy, lblBot='', sz=6.0) {
  let s = R(cx - sz - 1, cy - sz - 7.5, (sz+1)*2, 6.0, C.BLK, '#fff', 0.45);
  s += Txt(cx - sz, cy - sz - 2.8, 'M-O-A', 3.3, C.BLK, true);
  s += R(cx - sz, cy - sz, sz*2, sz*2, C.BLK, '#fff', 0.65);
  s += Cir(cx, cy, sz*0.75, C.BLK, 'none', 0.55);
  s += L(cx, cy - sz*0.65, cx, cy + sz*0.65, C.BLK, 1.2);
  if (lblBot) {
    const bw = Math.max(10.0, sz * 1.6);
    s += R(cx - bw, cy + sz + 1.5, bw*2, 6.0, C.BLK, '#fff', 0.45);
    s += Txt(cx - bw + 1.5, cy + sz + 6.0, lblBot.slice(0, 6), 3.4, C.BLK, true);
  }
  return s;
}

  const colW = (W - 56) / 20.0;
  for (let c = 0; c < 20; c++) {
    const x = 28 + c * colW;
    if (c > 0) s += L(x, 14, x, 26, C.BLK, 0.5);
    s += Txt(x + colW/2, 22, String(c).padStart(2,'0'), 6.5, C.BLK, false, 'middle');
  }
  const rowH = (H - 110) / 12.0;
  'ABCDEFGHIJKL'.split('').forEach((ch, r) => {

  s += Txt(230, ty+9, 'INSTALLATION', 5.5, C.GRY);

function draw3pBreaker(x, y, tag, spec, isMpcb=false) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y, px, y+8, C.BLK, 0.9);
    s += L(px-4, y+10, px, y+24, C.BLK, 1.0);
    s += L(px, y+24, px, y+34, C.BLK, 0.9);
    s += L(px-2, y+6, px+2, y+10, C.BLK, 0.7) + L(px+2, y+6, px-2, y+10, C.BLK, 0.7);
    s += Txt(px+2.5, y+6, String(1+i*2), 5.2, C.BLK);
    s += Txt(px+3.5, y+35.5, String(2+i*2), 5.2, C.BLK);
  });
  s += L(x-14, y+16, x+22, y+16, C.BLK, 0.6, '2 2');
  s += R(x-20, y+12, 6, 8, C.BLK, 'none', 0.8);
  if (isMpcb) [0,12,24].forEach(dx => s += R(x+dx-3, y+23, 6, 6, C.BLK, 'none', 0.7));
  s += Txt(x+32, y+11, tag, 7.5, C.BLK, true);
  s += Txt(x+32, y+20, spec, 6, C.GRY);
  return s;
}

function draw3pContactor(x, y, tag, spec) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y, px, y+8, C.BLK, 0.9);
    s += L(px-4, y+9, px, y+22, C.BLK, 1.0);
    s += L(px, y+22, px, y+30, C.BLK, 0.9);
    s += Txt(px+2.5, y+6.5, String(1+i*2), 5.2, C.BLK);
    s += Txt(px+2.5, y+29.5, String(2+i*2), 5.2, C.BLK);
  });
  s += L(x-14, y+15, x+22, y+15, C.BLK, 0.6, '2 2');
  s += R(x-24, y+10, 10, 10, C.BLK, 'none', 0.8);
  s += Txt(x-34, y+12, 'A1', 5.5) + Txt(x-34, y+22, 'A2', 5.5);
  s += Txt(x+32, y+11, tag, 7.5, C.BLK, true) + Txt(x+32, y+20, spec, 6, C.GRY);

function draw3pOverload(x, y, tag, spec) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y, px, y+8, C.BLK, 0.9);
    // IEC Thermal Overload Heater Element (stepped square wave)
    s += L(px, y+8, px-4, y+8, C.BLK, 0.9) + L(px-4, y+8, px-4, y+14, C.BLK, 0.9) + L(px-4, y+14, px, y+14, C.BLK, 0.9) + L(px, y+14, px, y+20, C.BLK, 0.9) + L(px, y+20, px-4, y+20, C.BLK, 0.9) + L(px-4, y+20, px-4, y+24, C.BLK, 0.9) + L(px-4, y+24, px, y+24, C.BLK, 0.9);
    s += L(px, y+24, px, y+32, C.BLK, 0.9);
    s += Txt(px+2.5, y+6, String(1+i*2), 5.0, C.GRY);
    s += Txt(px+2.5, y+31.5, String(2+i*2), 5.0, C.BLK);
  });
  s += L(x-12, y+16, x+22, y+16, C.BLK, 0.6, '2 2');
  s += Txt(x+32, y+12, tag, 7.5, C.BLK, true) + Txt(x+32, y+21, spec, 5.8, C.GRY);
  return s;
}

function drawMotor(x, y, idx, isEc, ecFan, acFan) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y-22, px, y-4, C.BLK, 0.9);
    s += Cir(px, y-22, 2.2, C.BLK, '#fff', 0.8);
    s += Txt(px+2.5, y-26.5, String((idx-1)*4+i+1), 5.2);
  });
  const peX = x + 36;
  s += L(peX, y-38, peX, y-4, C.GRN, 0.9);
  s += Cir(peX, y-22, 2.2, C.GRN, '#fff', 0.8);
  s += Txt(peX+2.5, y-26.5, String((idx-1)*4+4), 5.2, C.GRN, true);
  s += Txt(peX+4, y-36, 'PE', 5.2, C.GRN, true);
  s += L(peX, y-4, x+28, y+8, C.GRN, 0.8);
  s += L(peX-5, y-38, peX+5, y-38, C.GRN, 0.8);
  s += Txt(x+45, y-20, 'XR2', 6, C.BLU, true) + Txt(x+45, y-10, 'VCT 4x2.5', 5.5, C.GRY);

  const cx = x + 12, cy = y + 14;
  s += Cir(cx, cy, 17, C.BLK, 'none', 1.1);
  s += Txt(cx, cy+1, 'M', 9, C.BLK, true, 'middle') + Txt(cx, cy+11, '3~', 7, C.BLK, false, 'middle');
  s += L(cx-17, cy+10, cx-28, cy+10, C.BLK, 0.7) + L(cx-28, cy+10, cx-28, cy+18, C.BLK, 0.7);
  s += L(cx-34, cy+18, cx-22, cy+18, C.BLK, 0.8) + L(cx-32, cy+21, cx-24, cy+21, C.BLK, 0.7) + L(cx-30, cy+24, cx-26, cy+24, C.BLK, 0.6);
  const fObj = isEc ? ecFan : acFan;
  const col = isEc ? C.BLU : C.RED;
  s += Txt(cx+22, cy+2, `MR${idx}`, 7.5, col, true);
  s += Txt(cx+22, cy+11, `${isEc?'EC':'AC'} MOTOR ${fObj.kw}kW`, 6, col);
  s += Txt(cx+22, cy+19, '3PH 380V 50Hz', 5.5, C.GRY);
  s += Txt(cx-20, cy+38, `FAN MOTOR ${idx}`, 7, C.BLK, true);
  return s;
}

function drawTerminalStrip(x0, y0, tag, labelsTop, labelsBot, pinW=13) {
  const n = labelsTop.length;
  let s = R(x0-10, y0, 10, 26, C.BLK, C.TGRN, 0.7);
  s += Txt(x0-3, y0+20, 'STOP', 4.2, '#fff', true, 'start', -90);
  s += Txt(x0-36, y0+16, tag, 7.5, C.BLU, true);
  for (let i = 0; i < n; i++) {
    const px = x0 + i * pinW;
    s += R(px, y0, pinW, 8, C.BLK, C.YEL, 0.6);
    s += R(px, y0+8, pinW, 10, C.BLK, '#f2f2f2', 0.6);
    s += R(px, y0+18, pinW, 8, C.BLK, C.YEL, 0.6);
    s += Cir(px+pinW/2, y0+4, 2.2, C.BLK, 'none', 0.6);
    s += Cir(px+pinW/2, y0+22, 2.2, C.BLK, 'none', 0.6);
    s += Txt(px+pinW/2, y0+15, String(i+1), 5.0, C.BLK, true, 'middle');
    s += Txt(px+pinW/2+2, y0-3, labelsTop[i], 4.8, C.BLU, false, 'start', -90);
    s += Txt(px+pinW/2+2, y0+30, labelsBot[i], 4.8, C.BLK, false, 'start', 90);
  }
  const rx = x0 + n * pinW;
  s += R(rx, y0, 10, 26, C.BLK, C.TGRN, 0.7);
  s += Txt(rx+7, y0+20, 'STOP', 4.2, '#fff', true, 'start', -90);
  return s;
}

function getFanModels() {
  const ecSel = document.getElementById('selEcModel').value;
  const acSel = document.getElementById('selAcModel').value;
  const ecFan = ecSel === 'custom_ec'
    ? { id:'CUSTOM', type:'EC', name:'Custom EC', kw:parseFloat(document.getElementById('custEcKw').value)||1.5, amp:parseFloat(document.getElementById('custEcAmp').value)||3.07, cfm:parseInt(document.getElementById('custEcCfm').value)||30500 }
    : FANS_DB[ecSel];
  const acFan = acSel === 'custom_ac'
    ? { id:'CUSTOM', type:'AC', name:'Custom AC', kw:parseFloat(document.getElementById('custAcKw').value)||1.8, amp:parseFloat(document.getElementById('custAcAmp').value)||4.90, cfm:parseInt(document.getElementById('custAcCfm').value)||30100 }
    : FANS_DB[acSel];
  return { ecFan, acFan };
}

function computeSpec() {
  let nEc = Math.max(0, Math.min(32, parseInt(document.getElementById('inEcCount').value)||0));
  let nAc = Math.max(0, Math.min(32, parseInt(document.getElementById('inAcCount').value)||0));
  if (nEc + nAc === 0) { nEc = 4; document.getElementById('inEcCount').value = 4; }
  if (nEc + nAc > 32) {
    if (nEc > 32) nEc = 32;
    nAc = Math.max(0, 32 - nEc);
    document.getElementById('inEcCount').value = nEc;
    document.getElementById('inAcCount').value = nAc;
  }
  const n = nEc + nAc;
  const mode = (nEc > 0 && nAc > 0) ? 'Hybrid_30EC' : (nEc > 0 ? 'All-EC' : 'All-AC');
  state.mode = mode; state.nEc = nEc; state.nAc = nAc;

  const { ecFan, acFan } = getFanModels();
  const bm = BRAND_MODELS[state.bkey];
  const totalKw = +(nEc * ecFan.kw + nAc * acFan.kw).toFixed(2);
  const totalAmp = +(nEc * ecFan.amp + nAc * acFan.amp).toFixed(1);
  const totalCfm = nEc * ecFan.cfm + nAc * acFan.cfm;
  const iDesign = +(totalAmp * 1.25).toFixed(1);
  const mainBrk = [20,25,32,40,50,63,80,100,125,160,200,250].find(a => a >= totalAmp / 0.80) || 250;
  const grpCnt = Math.ceil(n / 4);
  const isoCnt = nEc > 0 ? Math.ceil(nEc / 4) : 0;
  const hasIso = nEc > 0;

  let ctrlV = document.getElementById('selCtrlV').value;
  if (ctrlV === 'auto') ctrlV = nEc > 0 ? '24VDC' : '220VAC';
  const contMod = ctrlV === '24VDC' ? bm.cont_24 : bm.cont_220;
  const isMccb = mainBrk >= 50;
  const mainType = isMccb ? 'MCCB' : 'MCB';
  const mainIcu = isMccb ? (bm.icu.includes('/') ? bm.icu.split('/')[1] : bm.icu) : bm.icu.split('/')[0];
  const mainMod = isMccb ? `${bm.mccb} 3P ${mainBrk}AT` : `${bm.mcb} 3P ${mainBrk}AT`;
  const spsSpec = (nEc > 0 && n > 20) ? bm.sps.replace('120', '240').replace('5A', '10A') : bm.sps;
  const isoPages = nEc > 0 ? Math.ceil(isoCnt / 4) : 0;

  let mWire='VSF 1x10 sq.mm', mWireS='VSF 1x10', mIz='63 A', peWire='VSF 1x10 sq.mm (G/Y)', peS='1x10', subW='VSF 1x4 sq.mm', subWS='VSF 1x4', subIz='34 A', busSize='15x3 mm Cu', busAmp='210 A';
  if (mainBrk > 160) { mWire='VSF 1x120 sq.mm'; mWireS='VSF 1x120'; mIz='290 A'; peWire='VSF 1x70 sq.mm (G/Y)'; peS='1x70'; subW='VSF 1x6 sq.mm'; subWS='VSF 1x6'; subIz='44 A'; busSize='20x5 mm Cu'; busAmp='355 A'; }
  else if (mainBrk > 100) { mWire='VSF 1x70 sq.mm'; mWireS='VSF 1x70'; mIz='215 A'; peWire='VSF 1x35 sq.mm (G/Y)'; peS='1x35'; subW='VSF 1x6 sq.mm'; subWS='VSF 1x6'; subIz='44 A'; }
  else if (mainBrk > 63) { mWire='VSF 1x35 sq.mm'; mWireS='VSF 1x35'; mIz='138 A'; peWire='VSF 1x16 sq.mm (G/Y)'; peS='1x16'; subW='VSF 1x6 sq.mm'; subWS='VSF 1x6'; subIz='44 A'; }
  else if (mainBrk > 32) { mWire='VSF 1x16 sq.mm'; mWireS='VSF 1x16'; mIz='85 A'; peWire='VSF 1x16 sq.mm (G/Y)'; peS='1x16'; subW='VSF 1x4 / 1x6'; subWS='VSF 1x4'; subIz='34-44 A'; }

  const pprMod = document.getElementById('selPpr').value;
  const hasPm = !!state.hasPm;
  const hasRs485 = hasPm && !!state.useRs485 && nEc > 0;
  const pmMod = { master:'Schneider PM2120', th:'Mitsubishi ME96SS', vn:'Selec MFM384-C', cn:'Chint DTSU666' }[state.bkey];
  const ctRatio = mainBrk <= 50 ? '50/5A' : (mainBrk <= 100 ? '100/5A' : (mainBrk <= 160 ? '150/5A' : '250/5A'));

  // Sync Power Meter & RS485 UI buttons & BOM impact note
  document.getElementById('pm_off').classList.toggle('active', !hasPm);
  document.getElementById('pm_on').classList.toggle('active', hasPm);
  const rsBox = document.getElementById('rs485Box');
  rsBox.style.display = hasPm ? 'block' : 'none';
  const rsOnBtn = document.getElementById('rs_on');
  const rsOffBtn = document.getElementById('rs_off');
  const rsNote = document.getElementById('rs485Note');
  if (nEc === 0) {
    rsOnBtn.disabled = true;
    rsOnBtn.style.opacity = '0.4';
    rsOnBtn.style.cursor = 'not-allowed';
    rsOffBtn.classList.add('active');
    rsOnBtn.classList.remove('active');
    rsNote.textContent = t('rs_allac');
  } else {
    rsOnBtn.disabled = false;
    rsOnBtn.style.opacity = '1';
    rsOnBtn.style.cursor = 'pointer';
    rsOffBtn.classList.toggle('active', !hasRs485);
    rsOnBtn.classList.toggle('active', hasRs485);
    rsNote.textContent = hasRs485 ? t('rs_on_note') : t('rs_off_note');
  }
  const bomNote = document.getElementById('bomImpactNote');
  if (!hasPm) bomNote.innerHTML = t('bom_none');
  else if (!hasRs485) bomNote.innerHTML = t('bom_local', {pm: pmMod, ct: ctRatio});
  else bomNote.innerHTML = t('bom_rs485', {pm: pmMod, ct: ctRatio});

  const autoCab = n <= 4 ? '570x690x250' : (n <= 10 ? '800x1200x250' : (n <= 16 ? '800x1500x400' : (n <= 20 ? '1000x1800x450' : (n <= 28 ? '1200x1800x450' : '1200x2000x500'))));
  const selCab = document.getElementById('selCab').value;
  const cabSz = selCab === 'auto' ? autoCab : selCab;
  const warnEl = document.getElementById('cabWarn');
  const warns = [];
  if (selCab !== 'auto' && n > (CAB_MAX[cabSz] || 12)) {
    warns.push(t('warn_cab', {cab: cabSz, max: CAB_MAX[cabSz], n, auto: autoCab}));
  }
  if (nEc > 0 && ecFan.amp > 4.0) warns.push(t('warn_ec', {amp: ecFan.amp}));
  if (nAc > 0 && acFan.amp > 6.3) warns.push(t('warn_ac', {amp: acFan.amp}));
  if (warns.length) { warnEl.style.display = 'block'; warnEl.innerHTML = warns.join('<br>'); }
  else { warnEl.style.display = 'none'; }

  const includeManual = state.includeManual !== false;
  document.getElementById('man_on').classList.toggle('active', includeManual);
  document.getElementById('man_off').classList.toggle('active', !includeManual);
  const manualPages = includeManual ? 3 : 0;
  const totalSheets = 8 + 1 + grpCnt + 1 + isoPages + grpCnt + 1 + manualPages;
  const customCode = document.getElementById('inCode').value.trim();
  const codeNo = customCode || `KSP-${bm.codeTag}-${mode.slice(0,3).toUpperCase()}-${String(n).padStart(2,'0')}`;

  const sheetList = [
    ['R01', t('sh_cover')],
    ['R02', t('sh_contents')],
    ['R03', t('sh_symbols')],
    ['R04', t('sh_acronyms')],
    ['R05', t('sh_cubicle')],
    ['R06', t('sh_bom')],
    ['R07', t('sh_layout')],
    ['R08', t('sh_load')],
    ['R09', t('sh_sld')],
  ];
  let sCur = 10;
  for (let g = 0; g < grpCnt; g++) sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_power', {a: g*4+1, b: Math.min((g+1)*4,n)})]);
  sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_prot')]);
  for (let ip = 0; ip < isoPages; ip++) sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_iso', {a: ip*4+1, b: Math.min((ip+1)*4,isoCnt)})]);
  for (let g = 0; g < grpCnt; g++) sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_ladder', {a: g*4+1, b: Math.min((g+1)*4,n)})]);
  sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_term')]);
  if (includeManual) {
    sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_func')]);
    sheetList.push([`R${String(sCur++).padStart(2,'0')}`, t('sh_safe')]);
    sheetList.push([`R${String(sCur).padStart(2,'0')}`, t('sh_tshoot')]);
  }

  return {
    n, nEc, nAc, mode, ecFan, acFan, bm, totalKw, totalAmp, totalCfm, iDesign,
    mainBrk, mainType, mainIcu, grpCnt, isoCnt, isoPages, hasIso, ctrlV, contMod, mainMod, spsSpec, pprMod,
    mWire, mWireS, mIz, peWire, peS, subW, subWS, subIz, busSize, busAmp,
    hasPm, hasRs485, pmMod, ctRatio, cabSz, includeManual,
    totalSheets, codeNo, sheetList,
    customer: document.getElementById('inCustomer').value.trim(),
    dateStr: document.getElementById('inDate').value.trim() || '2026-11',
    draftman: document.getElementById('inDraftman').value.trim(),
    approved: document.getElementById('inApproved').value.trim()
  };
}

    // Red OVL Pilot Lamp fed via QFR NO (97-98) from +24V/L1 bus (closes on Overload)

  return s;
}

function buildTerminals(sp, sheetNo) {
  let s = drawFrame(sp, t('sh_term'), sheetNo, sp.includeManual ? `R${String(sheetNo+1).padStart(2,'0')}` : 'END');
  s += drawTerminalStrip(65, 85, 'XR1', ['MCB1-1','MCB1-3','MCB1-5','N-BAR','PE-BAR'], ['PWR L1','PWR L2','PWR L3','NEUTRAL','GROUND (PE)'], 13);

  const xr2Top=[], xr2Bot=[];
  for(let f=1;f<=sp.n;f++){ xr2Top.push(`QFR${f}-2`,`QFR${f}-4`,`QFR${f}-6`,'PE'); xr2Bot.push(`F${f}-U`,`F${f}-V`,`F${f}-W`,`F${f}-PE`); }
  const dense = sp.n > 20;
  let xr3Y0 = 265;
  if (xr2Top.length <= 32) {
    s += drawTerminalStrip(195, 75, 'XR2', xr2Top, xr2Bot, Math.min(12.0, 380.0 / xr2Top.length));
  } else {
    const mid2 = 4 * Math.ceil(sp.n / 2);
    s += drawTerminalStrip(195, dense?58:68, 'XR2A', xr2Top.slice(0,mid2), xr2Bot.slice(0,mid2), Math.min(12.0, 380.0 / mid2));
    s += drawTerminalStrip(195, dense?140:166, 'XR2B', xr2Top.slice(mid2), xr2Bot.slice(mid2), Math.min(12.0, 380.0 / (xr2Top.length - mid2)));
    xr3Y0 = dense ? 226 : 264;
  }

  if (sp.nEc > 0 || sp.hasRs485) {
    const xr3Top=[], xr3Bot=[];
    for(let i=1;i<=sp.nEc;i++){ xr3Top.push(`ISO${i}+`,`ISO${i}-`); xr3Bot.push(`EC${i}+`,`EC${i}-`); }
    if (sp.nEc > 0) { xr3Top.push('CTL1+','CTL1-'); xr3Bot.push('EXT+','EXT-'); }
    if (sp.hasRs485) { xr3Top.push('PM1+','PM1-','PM1-S'); xr3Bot.push('485A+','485B-','485-S'); }
    if (xr3Top.length <= 30) {
      s += drawTerminalStrip(195, xr3Y0, 'XR3', xr3Top, xr3Bot, Math.min(12.0, 380.0 / xr3Top.length));
    } else {
      const mid3 = Math.floor(xr3Top.length / 2);
      s += drawTerminalStrip(195, dense?224:260, 'XR3A', xr3Top.slice(0,mid3), xr3Bot.slice(0,mid3), Math.min(11.5, 380.0 / mid3));
      s += drawTerminalStrip(195, dense?310:352, 'XR3B', xr3Top.slice(mid3), xr3Bot.slice(mid3), Math.min(11.5, 380.0 / (xr3Top.length - mid3)));
    }
  }

  const xr4Top=[], xr4Bot=[];
  for(let i=1;i<=sp.n;i++){ xr4Top.push(`SAR${i}-A`); xr4Bot.push(`KC${i}`); }
  xr4Top.push('XR1-N','MCB4-2','QFR-97','QFR-98'); xr4Bot.push('N-EXT','L1-6A','OVL-01','OVL-02');
  if (xr4Top.length <= 26) {
    s += drawTerminalStrip(195, 444, 'XR4', xr4Top, xr4Bot, Math.min(12.0, 380.0 / xr4Top.length));
  } else {
    const mid4 = Math.ceil(xr4Top.length / 2);
    s += drawTerminalStrip(195, 396, 'XR4A', xr4Top.slice(0,mid4), xr4Bot.slice(0,mid4), Math.min(12.0, 380.0 / mid4));
    s += drawTerminalStrip(195, 466, 'XR4B', xr4Top.slice(mid4), xr4Bot.slice(mid4), Math.min(12.0, 380.0 / (xr4Top.length - mid4)));
  }

  s += R(52,230,93,115,C.GRN,'#f2fcf5',0.8)+Txt(58,246,t('tm_bus'),6.6,C.GRN,true)+Txt(58,264,`PE-BAR: ${sp.busSize}`,5.8,C.GRN,true)+Txt(58,276,`Earth (${sp.busAmp})`,5.6);
  s += Txt(58,294,`N-BAR: ${sp.busSize}`,5.8,C.BLU,true)+Txt(58,306,'Neutral Busbar',5.6)+Txt(58,326,'All F1..Fn VCT 4C',5.5,C.GRY)+Txt(58,336,t('tm_pe_note'),5.5,C.GRN,true);

  s += R(610,48,192,432,C.BLK,C.BG,0.8)+Txt(620,66,t('tm_leg'),7.5,C.BLU,true);
  const legItems = [
    `${sp.mainType} = ${sp.mainMod}`,`QFR_EC = ${sp.bm.mpcb_ec} (95-96NC/97-98NO)`,`QFR_AC = ${sp.bm.mpcb_ac} (95-96NC/97-98NO)`,`KMR = ${sp.contMod}`,
    `PPR = ${sp.pprMod}`,`SPS = ${sp.spsSpec}`,'ISO = 4-Ch 0-10V Isolator','RY  = Control Relay 24V/220V','SAR = Selector MAN-0-AUT',
    'SS1 = Master Selector','SIG = 0-10V Speed Volume','HLR = Pilot Light Dia 22mm','VF  = Ventilation Fan','TS  = Thermostat (35C)',
    'XR1 = Main VSF + PE (5P)','XR2 = Motor VCT 4x2.5 (4P/Fan)',
    sp.hasRs485 ? 'XR3 = LIY-CY + Belden 9841' : 'XR3 = LIY-CY 2x0.75 (0-10V)',
    'XR4 = Ext Ctrl VSF 1x1.0 (MCB4)',
    ...(sp.hasPm ? [`PM1 = ${sp.pmMod} (${sp.hasRs485 ? 'RS485' : 'Local'})`] : []),
    `CAB = ${sp.cabSz} mm (IP55)`,'CALC = See Sheet R08'
  ];
  legItems.forEach((li,idx)=> s += Txt(620, 84+idx*17.5, li, 6.0));
  return s;
}

const mt = (k, vars={}) => {
  const d = MANUAL_I18N[state.lang] || MANUAL_I18N.en;
  let str = d[k] !== undefined ? d[k] : (MANUAL_I18N.en[k] || k);
  for (const [vk, vv] of Object.entries(vars)) str = str.replaceAll(`{${vk}}`, vv);
  return str;
};

const wrapLines = (str, maxLen) => {
  if (!str || str.length <= maxLen) return [str || ''];
  const cutChars = new Set([' ', '|', '/', ',', '、', '，', '。', ' ']);
  let split = -1;
  for (let i = Math.min(maxLen, str.length - 1); i >= Math.floor(maxLen * 0.45); i--) {
    if (cutChars.has(str[i])) { split = i + (str[i] === ' ' ? 0 : 1); break; }
  }
  if (split <= 0) {
    split = maxLen;
    while (split < str.length && /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E\u0300-\u036F]/.test(str[split])) split++;
  }
  const l1 = str.slice(0, split).trimEnd();
  const l2 = str.slice(split).trimStart();
  return l2 ? [l1, l2] : [l1];
};

function renderAll() {
  const sp = computeSpec();
  const sheets = [
    buildCover(sp), buildContents(sp), buildSymbols(sp), buildAcronyms(sp),
    buildCubicleSpec(sp), buildBom(sp), buildLayout(sp), buildLoadCalc(sp), buildSld(sp)
  ];
  let idx = 10;
  for (let g=0; g<sp.grpCnt; g++) sheets.push(buildPowerSheet(sp, g, idx++));
  sheets.push(buildProtection(sp, idx++));
  for (let ip=0; ip<sp.isoPages; ip++) sheets.push(build24vIso(sp, idx++, ip));
  for (let g=0; g<sp.grpCnt; g++) sheets.push(buildLadderSheet(sp, g, idx++));
  sheets.push(buildTerminals(sp, idx++));
  if (sp.includeManual) {
    sheets.push(buildSystemFunctions(sp, idx++));
    sheets.push(buildSafetyGuide(sp, idx++));
    sheets.push(buildTroubleshooting(sp, idx++));
  }

  if (state.activeSheet >= sheets.length) state.activeSheet = sheets.length - 1;

  // Render Top Metrics
  document.getElementById('topMetrics').innerHTML = `
    <div class="metric-pill">${t('m_total')}: <b>${sp.n} ${t('fan_unit')}</b> (${sp.nEc} EC + ${sp.nAc} AC)</div>
    <div class="metric-pill">${t('m_load')}: <b>${sp.totalKw} kW</b> / <b>${sp.totalAmp} A</b> (125%: ${sp.iDesign}A)</div>
    <div class="metric-pill">${t('m_main')}: <b>${sp.mainBrk}AT</b> | ${t('m_cab')}: <b>${sp.cabSz}</b></div>
    <div class="metric-pill">${t('m_air')}: <b>${sp.totalCfm.toLocaleString()} CFM</b></div>
    ${sp.hasPm ? `<div class="metric-pill">${t('m_meter')}: <b>PM1 (${sp.hasRs485 ? 'RS485' : 'Local'})</b></div>` : ''}
  `;

  // Render Sheet Tabs
  document.getElementById('sheetTabs').innerHTML = sp.sheetList.map(([sno, des], i) =>
    `<button class="sheet-tab ${i===state.activeSheet?'active':''}" onclick="goSheet(${i})" title="${des}">${sno}</button>`
  ).join('');

  // Render SVG Sheets into DOM
  const scroll = document.getElementById('canvasScroll');
  scroll.innerHTML = sheets.map((svgInner, i) => `
    <div class="pdf-sheet ${(!state.showAll && i!==state.activeSheet)?'hidden-preview':''}" data-idx="${i}">
      <svg viewBox="0 0 842 595" font-family="Sarabun, Tahoma, 'Leelawadee UI', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" data-cad-font="KSP-Font.shx" xmlns="http://www.w3.org/2000/svg">${svgInner}</svg>
    </div>
  `).join('');

  document.getElementById('lblSheetPos').textContent = `R${String(state.activeSheet+1).padStart(2,'0')} / R${String(sheets.length).padStart(2,'0')}`;
  applyZoom();
}

function applyZoom() {
  const val = document.getElementById('selZoom').value;
  const scroll = document.getElementById('canvasScroll');
  let wPx = 842 * 1.25;
  if (val === 'fit') wPx = Math.max(400, scroll.clientWidth - 48);
  else wPx = 842 * parseFloat(val);
  document.querySelectorAll('.pdf-sheet').forEach(el => {
    el.style.width = wPx + 'px';
    el.style.height = (wPx * 595 / 842) + 'px';
  });
}

function goSheet(i) { state.activeSheet = i; state.showAll = false; renderAll(); }
function stepSheet(d) { state.activeSheet = Math.max(0, Math.min(computeSpec().totalSheets - 1, state.activeSheet + d)); state.showAll = false; renderAll(); }
function toggleAllView() { state.showAll = !state.showAll; document.getElementById('btnAllView').textContent = state.showAll ? t('ui_viewone') : t('ui_viewall'); renderAll(); }

function setMode(m) {
  state.mode = m;
  ['mode_all_ec','mode_all_ac','mode_hybrid','mode_manual'].forEach(id => document.getElementById(id).classList.remove('active'));
  const total = (parseInt(document.getElementById('inEcCount').value)||0) + (parseInt(document.getElementById('inAcCount').value)||0) || 8;
  if (m === 'All-EC') { document.getElementById('mode_all_ec').classList.add('active'); document.getElementById('inEcCount').value = total; document.getElementById('inAcCount').value = 0; }
  else if (m === 'All-AC') { document.getElementById('mode_all_ac').classList.add('active'); document.getElementById('inEcCount').value = 0; document.getElementById('inAcCount').value = total; }
  else if (m === 'Hybrid_30EC') { document.getElementById('mode_hybrid').classList.add('active'); const ec = Math.max(1, Math.round(total*0.3)); document.getElementById('inEcCount').value = ec; document.getElementById('inAcCount').value = Math.max(1, total - ec); }
  else { document.getElementById('mode_manual').classList.add('active'); document.getElementById('inEcCount').focus(); }
  renderAll();
}

function applyHybrid30() { setMode('Hybrid_30EC'); }

function setPresetTotal(tot) {
  if (state.mode === 'All-EC') { document.getElementById('inEcCount').value = tot; document.getElementById('inAcCount').value = 0; }
  else if (state.mode === 'All-AC') { document.getElementById('inEcCount').value = 0; document.getElementById('inAcCount').value = tot; }
  else { const ec = Math.max(1, Math.round(tot*0.3)); document.getElementById('inEcCount').value = ec; document.getElementById('inAcCount').value = tot - ec; }
  document.querySelectorAll('#fanPresets .chip').forEach(c => c.classList.toggle('active', parseInt(c.dataset.n)===tot));
  renderAll();
}

function onManualFanChange() {
  const ec = parseInt(document.getElementById('inEcCount').value)||0;
  const ac = parseInt(document.getElementById('inAcCount').value)||0;
  const tot = ec + ac;
  ['mode_all_ec','mode_all_ac','mode_hybrid','mode_manual'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('mode_manual').classList.add('active');
  document.querySelectorAll('#fanPresets .chip').forEach(c => c.classList.toggle('active', parseInt(c.dataset.n)===tot));
  renderAll();
}

function setSource(bk) {
  state.bkey = bk;
  ['master','th','vn','cn'].forEach(k => document.getElementById(`src_${k}`).classList.toggle('active', k===bk));
  renderAll();
}

function setPmOpt(on) {
  state.hasPm = !!on;
  if (!state.hasPm) state.useRs485 = false;
  renderAll();
}

function setRs485Opt(on) {
  state.useRs485 = !!on;
  if (state.useRs485) state.hasPm = true;
  renderAll();
}

function setManualOpt(on) {
  state.includeManual = !!on;
  renderAll();
}

function onModelSelect(which) {
  if (which === 'EC') document.getElementById('customEcFields').style.display = document.getElementById('selEcModel').value==='custom_ec'?'grid':'none';
  else document.getElementById('customAcFields').style.display = document.getElementById('selAcModel').value==='custom_ac'?'grid':'none';
  renderAll();
}

function printFullReport() {
  const sp = computeSpec();
  const prevTitle = document.title;
  document.title = `${sp.codeNo}_${sp.mode}_${sp.n}Fans`;
  window.print();
  setTimeout(() => document.title = prevTitle, 500);
}

function savePreset() {
  localStorage.setItem('ksp_offline_studio_v1', JSON.stringify({
    lang: state.lang,
    ec: document.getElementById('inEcCount').value, ac: document.getElementById('inAcCount').value,
    bkey: state.bkey, cab: document.getElementById('selCab').value,
    ctrlV: document.getElementById('selCtrlV').value, ppr: document.getElementById('selPpr').value,
    hasPm: state.hasPm, useRs485: state.useRs485, includeManual: state.includeManual,
    ecMod: document.getElementById('selEcModel').value, acMod: document.getElementById('selAcModel').value,
    customer: document.getElementById('inCustomer').value, code: document.getElementById('inCode').value,
    draftman: document.getElementById('inDraftman').value, approved: document.getElementById('inApproved').value
  }));
  alert(t('saved_msg'));
}

function resetPreset() {
  localStorage.removeItem('ksp_offline_studio_v1');
  location.reload();
}

function loadSavedPreset() {
  try {
    if (location.hash && location.hash.length > 2) {
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.get('lang') && I18N[p.get('lang')]) state.lang = p.get('lang');
      if (p.has('ec')) document.getElementById('inEcCount').value = p.get('ec');
      if (p.has('ac')) document.getElementById('inAcCount').value = p.get('ac');
      if (p.get('ecMod')) document.getElementById('selEcModel').value = p.get('ecMod');
      if (p.get('acMod')) document.getElementById('selAcModel').value = p.get('acMod');
      if (p.get('bkey') && BRAND_MODELS[p.get('bkey')]) setSource(p.get('bkey'));
      if (p.get('pm') === '1' || p.get('pm') === 'true') state.hasPm = true;
      if (p.get('rs485') === 'pm_rs485' || p.get('rs485') === '1' || p.get('rs485') === 'true') { state.hasPm = true; state.useRs485 = true; }
      else if (p.get('rs485') === 'pm_only') { state.hasPm = true; state.useRs485 = false; }
      else if (p.get('rs485') === 'none' || p.get('rs485') === '0') { state.useRs485 = false; }
      if (p.has('manual')) state.includeManual = p.get('manual') !== '0' && p.get('manual') !== 'false';
      onManualFanChange();
      return;
    }
    const raw = localStorage.getItem('ksp_offline_studio_v1');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.lang && I18N[d.lang]) state.lang = d.lang;
    if (d.includeManual !== undefined) state.includeManual = !!d.includeManual;
    if (d.ec !== undefined) document.getElementById('inEcCount').value = d.ec;
    if (d.ac !== undefined) document.getElementById('inAcCount').value = d.ac;
    if (d.cab) document.getElementById('selCab').value = d.cab;
    if (d.ctrlV) document.getElementById('selCtrlV').value = d.ctrlV;
    if (d.ppr) document.getElementById('selPpr').value = d.ppr;
    if (d.hasPm !== undefined) state.hasPm = !!d.hasPm;
    if (d.useRs485 !== undefined) state.useRs485 = !!d.useRs485;
    if (d.rs485 === 'pm_rs485') { state.hasPm = true; state.useRs485 = true; }
    if (d.ecMod) document.getElementById('selEcModel').value = d.ecMod;
    if (d.acMod) document.getElementById('selAcModel').value = d.acMod;
    if (d.customer !== undefined) document.getElementById('inCustomer').value = d.customer;
    if (d.code !== undefined) document.getElementById('inCode').value = d.code;
    if (d.draftman !== undefined) document.getElementById('inDraftman').value = d.draftman;
    if (d.approved !== undefined) document.getElementById('inApproved').value = d.approved;
    if (d.bkey && BRAND_MODELS[d.bkey]) setSource(d.bkey);
    onManualFanChange();
  } catch (e) {}
}

function exportJsonConfig() {
  const sp = computeSpec();
  const blob = new Blob([JSON.stringify(sp, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${sp.codeNo}.json`; a.click();
}

function exportCsvBom() {
  const sp = computeSpec();
  const lines = [
    ['Project', sp.codeNo, sp.mode, `${sp.n} Fans (${sp.nEc}EC+${sp.nAc}AC)`],
    ['Source', sp.bm.label],
    ['Tag','Description','Qty','Model/Spec'],
    ['MCB1', 'Main Circuit Breaker', 1, sp.mainMod],
    ['MCB2..', 'Branch 3P Breaker', sp.grpCnt, `${sp.bm.mcb} 3P ${sp.nAc>0?'25AT':'20AT'}`],
    ['MCB4', 'Control 2P Breaker', 1, `${sp.bm.mcb} 2P 6AT`],
    ['QFR_EC', 'EC Thermal Overload Relay (Below KMR)', sp.nEc, `${sp.bm.mpcb_ec} (95-96NC/97-98NO)`],
    ['QFR_AC', 'AC Thermal Overload Relay (Below KMR)', sp.nAc, `${sp.bm.mpcb_ac} (95-96NC/97-98NO)`],
    ['KMR', 'Magnetic Contactor', sp.n, sp.contMod],
    ['PPR1', 'Phase Relay', 1, sp.pprMod],
    ...(sp.hasPm ? [['PM1', `Digital Power Meter (${sp.hasRs485 ? 'Modbus RS485' : 'Local Panel Only'})`, 1, sp.pmMod], ['CT', `Current Transformer ${sp.ctRatio}`, 3, 'CT 5A']] : []),
    ...(sp.hasRs485 ? [['RS485', 'RS485 Surge + 3P Terminal (A+/B-/SHLD)', 1, 'XR3']] : []),
    ['SPS1', '24VDC Supply', sp.nEc>0?1:0, sp.spsSpec],
    ['ISO', '0-10V 4-Ch Isolator', sp.isoCnt, '4-Ch Isolated'],
    ['PE/N-BAR', 'Copper Ground & Neutral Busbars', 2, sp.busSize],
    ['WIRE-MAIN', `Main Wire (${sp.mWire}) + PE (${sp.peWire}) [m]`, 15, sp.mWire],
    ['WIRE-SUB', `Branch Wire (${sp.subW}) [m]`, sp.grpCnt*4, sp.subW],
    ['WIRE-MOT', 'Internal Motor Wire VSF 1x2.5+PE [m]', Math.round(sp.n*7.5), 'VSF 1x2.5 sq.mm'],
    ['WIRE-CTRL', 'Control Wire VSF 1x1.0 sq.mm [m]', Math.round(sp.n*18), 'VSF 1x1.0 sq.mm'],
    ['WIRE-SIG', '0-10V Shielded Cable [m]', sp.nEc>0?Math.round(sp.nEc*3.5):0, 'LIY-CY 2x0.75'],
    ['XR1-4', 'Terminals (L1,L2,L3,N,PE / U,V,W,PE)', 1, `XR1(5P)+XR2(${sp.n*4}P)`],
    ['CABINET', 'IP55 Steel Enclosure', 1, `${sp.cabSz} mm`]
  ].map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+lines], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${sp.codeNo}_BOM.csv`; a.click();
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('uiLogo').src = KSP_LOGO_B64;
  document.getElementById('fanPresets').innerHTML = [4,6,8,10,12,14,16,18,20,24,28,32].map(n =>
    `<button class="chip ${n===8?'active':''}" data-n="${n}" onclick="setPresetTotal(${n})">${n} ${t('fan_unit')}</button>`
  ).join('');
  ['inCustomer','inCode','inDate','inDraftman','inApproved'].forEach(id => document.getElementById(id).addEventListener('input', renderAll));
  loadSavedPreset();
  applyUiLanguage();
  renderAll();
});
window.addEventListener('resize', () => { if(document.getElementById('selZoom').value==='fit') applyZoom(); });
</script>
