<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KSP Panel Report & IEC 60617 Schematic Studio</title>
<style>
  :root {
    --bg: #0b1120;
    --panel: #111827;
    --panel2: #1e293b;
    --border: #2d3b4e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: "Sarabun", "Tahoma", "Leelawadee UI", "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    height: 100%; overflow: hidden;
  }
  .app-shell { display: flex; height: 100vh; width: 100vw; }
  /* Sidebar */
  .sidebar {
    width: 390px; min-width: 360px; max-width: 420px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; height: 100vh;
  }
  .sb-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; background: #0f172a;
  }
  .sb-head img { width: 46px; height: auto; }
  .sb-title { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.25; }
  .sb-sub { font-size: 11px; color: var(--accent); margin-top: 2px; }
  .sb-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .sb-foot { padding: 10px 14px; border-top: 1px solid var(--border); background: #0f172a; display: flex; flex-direction: column; gap: 6px; }

  .card {
    background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .card-title {
    font-size: 11.5px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
  }
  label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  input[type="text"], input[type="number"], select {
    width: 100%; background: var(--panel2); border: 1px solid #334155; color: #f8fafc;
    border-radius: 5px; padding: 6px 8px; font-size: 12px; outline: none;
    font-family: inherit;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .seg-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 8px; }
  .seg-btn {
    padding: 6px 4px; border: 1px solid #334155; background: var(--panel2); color: var(--muted);
    border-radius: 5px; cursor: pointer; font-size: 11.5px; font-weight: 600; text-align: center;
  }
  .seg-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .brand-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .brand-btn {
    padding: 7px 8px; border: 1px solid #334155; background: var(--panel2); color: #cbd5e1;
    border-radius: 6px; cursor: pointer; font-size: 11px; text-align: left; line-height: 1.3;
  }
  .brand-btn b { display: block; font-size: 11.5px; color: #fff; }
  .brand-btn.active { border-color: var(--green); background: rgba(34, 197, 94, 0.14); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip {
    padding: 3px 7px; border-radius: 4px; border: 1px solid #334155; background: var(--panel2);
    color: #cbd5e1; font-size: 11px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); color: #fff; }
  .chip.active { background: #0369a1; border-color: #38bdf8; color: #fff; }
  .btn {
    border: none; border-radius: 6px; padding: 8px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .btn-primary { background: #0284c7; color: #fff; width: 100%; }
  .btn-primary:hover { background: #0369a1; }
  .btn-sec { background: var(--panel2); color: #e2e8f0; border: 1px solid #334155; font-size: 11px; padding: 6px 8px; }
  .btn-sec:hover { border-color: var(--accent); }
  .warn-box {
    background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.5);
    color: #fbbf24; font-size: 11px; padding: 6px 8px; border-radius: 5px; margin-top: 6px; display: none;
  }
  .err-box {
    background: rgba(239, 68, 68, 0.14); border: 1px solid rgba(239, 68, 68, 0.75);
    color: #fca5a5; font-size: 11px; padding: 7px 8px; border-radius: 5px; margin-top: 6px; display: none;
    font-weight: 600; line-height: 1.35;
  }
  .btn-primary:disabled {
    background: #475569; color: #cbd5e1; cursor: not-allowed; opacity: 0.75; border: 1px solid #ef4444;
  }
  .seg-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
  .seg-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 6px; }

  /* Main Preview Area */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #1e293b; }
  .toolbar {
    background: #0f172a; border-bottom: 1px solid var(--border); padding: 8px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .metrics { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .metric-pill {
    background: var(--panel2); border: 1px solid #334155; border-radius: 5px;
    padding: 4px 8px; font-size: 11px; color: #cbd5e1;
  }
  .metric-pill b { color: #38bdf8; }
  .nav-bar {
    background: #111827; border-bottom: 1px solid var(--border); padding: 6px 14px;
    display: flex; align-items: center; gap: 6px; overflow-x: auto;
  }
  .sheet-tab {
    padding: 4px 9px; border-radius: 4px; border: 1px solid #334155; background: #1e293b;
    color: #94a3b8; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .sheet-tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 700; }

  .canvas-scroll {
    flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 18px;
    background: #334155;
  }
  .pdf-sheet {
    background: #ffffff; color: #000000;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    flex-shrink: 0;
    transform-origin: top center;
  }
  .pdf-sheet.hidden-preview { display: none; }
  .pdf-sheet svg { display: block; width: 100%; height: 100%; }

  /* Self-Test Modal */
  .st-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.72); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
  .st-backdrop.open { display: flex; }
  .st-modal { background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; width: 680px; max-width: 100%; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
  .st-head { padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; }
  .st-body { padding: 14px 16px; overflow: auto; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .st-row { border: 1px solid #334155; border-radius: 6px; padding: 8px 10px; background: #0f172a; }
  .st-row.pass { border-left: 4px solid #22c55e; }
  .st-row.fail { border-left: 4px solid #ef4444; }
  .st-badge { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
  .st-badge.pass { background: #14532d; color: #86efac; }
  .st-badge.fail { background: #7f1d1d; color: #fca5a5; }
  /* Offline A4 Landscape Print Engine */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    html, body {
      width: 297mm; height: auto !important; overflow: visible !important;
      background: #ffffff !important; margin: 0 !important; padding: 0 !important;
    }
    .sidebar, .toolbar, .nav-bar, .no-print { display: none !important; }
    .app-shell, .main, .canvas-scroll {
      display: block !important; width: 100% !important; height: auto !important;
      overflow: visible !important; background: #ffffff !important; padding: 0 !important; margin: 0 !important;
    }
    .pdf-sheet {
      display: block !important;
      width: 297mm !important; height: 210mm !important;
      box-shadow: none !important; margin: 0 !important; padding: 0 !important;
      page-break-after: always !important; break-after: page !important;
      overflow: hidden !important;
    }
    .pdf-sheet.hidden-preview { display: block !important; }
    .pdf-sheet:last-child { page-break-after: auto !important; break-after: auto !important; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <!-- LEFT SIDEBAR -->
  <aside class="sidebar no-print">
    <div class="sb-head">
      <img id="uiLogo" alt="KSP Logo">
      <div>
        <div class="sb-title">KSP Panel Report Studio</div>
        <div class="sb-sub" data-i18n="ui_sub">IEC 60617 Multi-Sheet Schematic &amp; PDF Generator</div>
      </div>
    </div>
    <div style="padding:6px 14px;background:#0b1222;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
      <button class="seg-btn" id="lang_th" onclick="setLang('th')" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#A51931"/><rect y="2" width="18" height="8" fill="#F4F5F8"/><rect y="4" width="18" height="4" fill="#2D2A4A"/></svg><span>ไทย</span></button>
      <button class="seg-btn active" id="lang_en" onclick="setLang('en')" style="display:inline-flex;align-items:center;justify-content:center;gap:5px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#012169"/><path d="M0,0 L18,12 M18,0 L0,12" stroke="#FFF" stroke-width="2.2"/><path d="M0,0 L18,12 M18,0 L0,12" stroke="#C8102E" stroke-width="1.1"/><path d="M9,0 V12 M0,6 H18" stroke="#FFF" stroke-width="3.6"/><path d="M9,0 V12 M0,6 H18" stroke="#C8102E" stroke-width="2"/></svg><span>EN</span></button>
      <button class="seg-btn" id="lang_vi" onclick="setLang('vi')" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#DA251D"/><polygon points="9,2.2 10.1,5.4 13.4,5.4 10.7,7.3 11.7,10.5 9,8.6 6.3,10.5 7.3,7.3 4.6,5.4 7.9,5.4" fill="#FFCD00"/></svg><span>Tiếng Việt</span></button>
      <button class="seg-btn" id="lang_zh" onclick="setLang('zh')" style="display:inline-flex;align-items:center;justify-content:center;gap:4px;"><svg width="18" height="12" viewBox="0 0 18 12" style="border-radius:2px;flex-shrink:0"><rect width="18" height="12" fill="#DE2910"/><polygon points="3.6,1.8 4.2,3.6 6.0,3.6 4.5,4.7 5.1,6.4 3.6,5.3 2.1,6.4 2.7,4.7 1.2,3.6 3.0,3.6" fill="#FFDE00"/><circle cx="7.4" cy="1.8" r="0.55" fill="#FFDE00"/><circle cx="8.4" cy="3.1" r="0.55" fill="#FFDE00"/><circle cx="8.4" cy="4.8" r="0.55" fill="#FFDE00"/><circle cx="7.4" cy="6.1" r="0.55" fill="#FFDE00"/></svg><span>简体中文</span></button>
    </div>

    <div class="sb-body">
      <!-- Project Metadata -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c1">1. ข้อมูลโครงการ &amp; เอกสาร</div>
        <div style="margin-bottom:6px">
          <label data-i18n="ui_cust">ชื่อลูกค้า / ฟาร์ม (Customer)</label>
          <input type="text" id="inCustomer" value="............................................................">
        </div>
        <div class="grid-2" style="margin-bottom:6px">
          <div>
            <label data-i18n="ui_code">รหัสแบบ (Code No.)</label>
            <input type="text" id="inCode" placeholder="Auto">
          </div>
          <div>
            <label data-i18n="ui_date">Revise / Date</label>
            <input type="text" id="inDate" value="2026-11">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label data-i18n="ui_draft">Draftman / ผู้เขียนแบบ</label>
            <input type="text" id="inDraftman" value="KSP ENG">
          </div>
          <div>
            <label data-i18n="ui_appr">Approved / ผู้อนุมัติ</label>
            <input type="text" id="inApproved" value="">
          </div>
        </div>
      </div>

      <!-- Mode & Fans -->
      <div class="card">
        <div class="card-title">
          <span data-i18n="ui_c2">2. โหมดระบบ &amp; จำนวนพัดลม</span>
          <button class="chip" onclick="applyHybrid30()" data-i18n="ui_auto30">Auto 30% EC</button>
        </div>
        <div class="seg-group">
          <button class="seg-btn active" id="mode_all_ec" onclick="setMode('All-EC')">All-EC</button>
          <button class="seg-btn" id="mode_all_ac" onclick="setMode('All-AC')">All-AC</button>
          <button class="seg-btn" id="mode_hybrid" onclick="setMode('Hybrid_30EC')">Hybrid 30%</button>
          <button class="seg-btn" id="mode_manual" onclick="setMode('Manual')" data-i18n="ui_manual">Manual</button>
        </div>
        <label data-i18n="ui_quick_fans">เลือกจำนวนพัดลมรวมด่วน (1 โรงเรือน)</label>
        <div class="chip-row" id="fanPresets"></div>

        <div class="grid-2" style="margin-top:8px">
          <div>
            <label data-i18n="ui_ec_cnt">จำนวนพัดลม EC (0–32)</label>
            <input type="number" id="inEcCount" min="0" max="32" value="8" oninput="onManualFanChange()" onchange="onManualFanChange()">
          </div>
          <div>
            <label data-i18n="ui_ac_cnt">จำนวนพัดลม AC (0–32)</label>
            <input type="number" id="inAcCount" min="0" max="32" value="0" oninput="onManualFanChange()" onchange="onManualFanChange()">
          </div>
        </div>

        <div id="ecModelBox" style="margin-top:8px">
          <label data-i18n="ui_ec_mod">รุ่นพัดลม EC (BESS Lab / Custom)</label>
          <select id="selEcModel" onchange="onModelSelect('EC')">
            <option value="24611">#24611 Agrifan ZP-50 EC (1.5kW | 3.07A | 30,500 CFM)</option>
            <option value="26238">#26238 Agrifan ZMD50 EC (1.5kW | 3.23A | 27,400 CFM)</option>
            <option value="20285">#20285 Agrifan 56" Var (1.5kW | 2.46A | 26,800 CFM)</option>
            <option value="custom_ec" data-i18n="ui_cust_ec">Custom EC Motor (กำหนด kW / A / CFM)</option>
          </select>
          <div id="customEcFields" class="grid-3" style="margin-top:6px;display:none">
            <div><label>kW</label><input type="number" step="0.1" id="custEcKw" value="1.5" onchange="renderAll()"></div>
            <div><label>Amps</label><input type="number" step="0.01" id="custEcAmp" value="3.07" onchange="renderAll()"></div>
            <div><label>CFM</label><input type="number" step="100" id="custEcCfm" value="30500" onchange="renderAll()"></div>
          </div>
          <div id="ecLogicBox" style="margin-top:8px">
            <label data-i18n="ui_ec_logic">โหมดสัญญาณพัดลม EC (EC Signal Logic)</label>
            <div class="seg-group" style="margin-bottom:3px">
              <button class="seg-btn active" id="ec_10_0v" onclick="setEcLogic('10-0v')" data-i18n="ui_ec_10_0">10-0V Fail-Safe (0V=100%)</button>
              <button class="seg-btn" id="ec_0_10v" onclick="setEcLogic('0-10v')" data-i18n="ui_ec_0_10">0-10V STD (10V=100%)</button>
            </div>
            <div id="ecLogicNote" style="font-size:10px;color:#86efac;line-height:1.3;"></div>
          </div>
        </div>

        <div id="acModelBox" style="margin-top:8px">
          <label data-i18n="ui_ac_mod">รุ่นพัดลม AC (BESS Lab / Custom)</label>
          <select id="selAcModel" onchange="onModelSelect('AC')">
            <option value="24579">#24579 Agrifan ZP50 AC (1.8kW | 4.90A | 30,100 CFM)</option>
            <option value="26237">#26237 Agrifan ZMD50 AC (1.5kW | 4.60A | 26,700 CFM)</option>
            <option value="custom_ac" data-i18n="ui_cust_ac">Custom AC Motor (กำหนด kW / A / CFM)</option>
          </select>
          <div id="customAcFields" class="grid-3" style="margin-top:6px;display:none">
            <div><label>kW</label><input type="number" step="0.1" id="custAcKw" value="1.8" onchange="renderAll()"></div>
            <div><label>Amps</label><input type="number" step="0.01" id="custAcAmp" value="4.90" onchange="renderAll()"></div>
            <div><label>CFM</label><input type="number" step="100" id="custAcCfm" value="30100" onchange="renderAll()"></div>
          </div>
        </div>
      </div>

      <!-- 4 Sources -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c3">3. แหล่งผลิตและยี่ห้ออุปกรณ์ (4 รูปแบบ)</div>
        <div class="brand-grid">
          <button class="brand-btn active" id="src_master" onclick="setSource('master')"><b data-i18n="ui_src_master">🇹🇭 ไทย: Schneider</b>iK60N / CVS / LC1D / LRD</button>
          <button class="brand-btn" id="src_th" onclick="setSource('th')"><b data-i18n="ui_src_th">🇹🇭 ไทย: Mitsubishi</b>BH-D6 / NF-CV / S-T10 / TH-T18</button>
          <button class="brand-btn" id="src_vn" onclick="setSource('vn')"><b data-i18n="ui_src_vn">🇻🇳 เวียดนาม: LS</b>LA63N / ABE / GMC-9M / MT-12</button>
          <button class="brand-btn" id="src_cn" onclick="setSource('cn')"><b data-i18n="ui_src_cn">🇨🇳 จีน: Chint</b>NXB-63 / NM1 / NC1 / NR2-25</button>
        </div>
      </div>

      <!-- Cabinet & Controls -->
      <div class="card">
        <div class="card-title" data-i18n="ui_c4">4. ตู้ควบคุม &amp; ระบบป้องกัน</div>
        <div class="grid-2" style="margin-bottom:6px">
          <div>
            <label data-i18n="ui_cab">ขนาดตู้ (mm IP55)</label>
            <select id="selCab" onchange="renderAll()">
              <option value="auto" data-i18n="ui_cab_auto">อัตโนมัติ (แนะนำตามจำนวน)</option>
              <option value="570x690x250">570×690×250 (≤4)</option>
              <option value="600x1000x250">600×1000×250 (≤8, 4/Row)</option>
              <option value="700x1200x250">700×1200×250 (≤12 Compact)</option>
              <option value="800x1200x250">800×1200×250 (≤12 Standard)</option>
              <option value="800x1500x400">800×1500×400 (≤16)</option>
              <option value="1000x1800x450">1000×1800×450 (≤20)</option>
              <option value="1200x1800x450">1200×1800×450 (21–28 / 2-Door)</option>
              <option value="1200x2000x500">1200×2000×500 (29–32 / 2-Door)</option>
            </select>
          </div>
          <div>
            <label data-i18n="ui_ctrlv">แรงดันคอยล์ควบคุม</label>
            <select id="selCtrlV" onchange="renderAll()">
              <option value="auto" data-i18n="ui_ctrl_auto">อัตโนมัติ (EC=24VDC / AC=220V)</option>
              <option value="24VDC">24VDC Wide-Range</option>
              <option value="220VAC">220VAC Standard</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:6px">
          <label>Phase Protection Relay (PPR1)</label>
          <select id="selPpr" onchange="renderAll()">
            <option value="Selec 900VPR-BL-U">Selec 900VPR-BL-U (Wide 160-520V)</option>
            <option value="WIP W-OP4">WIP W-OP4 Phase Protection</option>
          </select>
        </div>
        <div class="grid-3" style="margin-bottom:6px">
          <div>
            <label data-i18n="ui_amb_temp">อุณหภูมิห้อง (°C)</label>
            <input type="number" id="inAmbTemp" min="15" max="60" step="1" value="35" oninput="renderAll()" onchange="renderAll()">
          </div>
          <div>
            <label data-i18n="ui_isc_ka">Isc (kA) [VERIFY]</label>
            <input type="number" id="inIscKa" min="1" max="50" step="0.5" value="10" oninput="renderAll()" onchange="renderAll()">
          </div>
          <div>
            <label data-i18n="ui_field_len">สายสนาม (m) [VERIFY]</label>
            <input type="number" id="inFieldLenM" min="5" max="250" step="5" value="35" oninput="renderAll()" onchange="renderAll()">
          </div>
        </div>
        <div style="margin-bottom:6px">
          <label data-i18n="ui_opt1">Option 1: Digital Power Meter (PM1 + CT 3x)</label>
          <div class="seg-2" style="margin-bottom:4px">
            <button class="seg-btn active" id="pm_off" onclick="setPmOpt(false)" data-i18n="ui_pm_off">ไม่ติด Power Meter</button>

function t(k, vars={}, langOpt=null) {
  const l = langOpt || state.lang;
  const dict = I18N[l] || I18N.th;
  let str = dict[k] !== undefined ? dict[k] : (I18N.th[k] !== undefined ? I18N.th[k] : k);
  for (const [vk, vv] of Object.entries(vars)) str = str.replace(new RegExp(`\\{${vk}\\}`, 'g'), vv);
  return str;
}

function applyUiLanguage() {
  document.documentElement.lang = state.lang;
  ['th','en','vi','zh'].forEach(l => {
    const el = document.getElementById(`lang_${l}`);
    if (el) el.classList.toggle('active', l === state.lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    el.textContent = t(key);
  });
  const btnAll = document.getElementById('btnAllView');
  if (btnAll) btnAll.textContent = state.showAll ? t('ui_viewone') : t('ui_viewall');
  // Update fan preset chip units
  document.querySelectorAll('#fanPresets .chip').forEach(c => {
    c.textContent = `${c.dataset.n} ${t('fan_unit')}`;
  });
}

function setLang(l) {
  if (!I18N[l]) return;
  state.lang = l;
  applyUiLanguage();
  renderAll();
}

// SVG Builder helpers (IEC 60204-1 color palette incl. Orange ext interlock & BU/WH 0V)
const C = { BLK:'#000000', GRY:'#595959', LGRY:'#c7c7c7', BLU:'#0d40a6', RED:'#bf1919', GRN:'#0d732e', YEL:'#f2d940', OYL:'#e6ad0d', TGRN:'#33a64d', ORG:'#ea580c', DC0:'#0284c7', BG:'#f5f7fa' };
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const L = (x1,y1,x2,y2,col=C.BLK,w=0.9,dash='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const Wire0V = (x1,y1,x2,y2,w=0.9) => L(x1,y1,x2,y2,C.BLU,w) + L(x1,y1,x2,y2,'#e0f2fe',Math.max(0.45,w*0.5),'3 3');
const R = (x,y,w,h,col=C.BLK,fill='none',width=0.9,dash='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" stroke="${col}" fill="${fill}" stroke-width="${width}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const Cir = (cx,cy,r,col=C.BLK,fill='none',w=0.8,dash='') => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${col}" fill="${fill}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} />`;
const Dot = (cx,cy,col=C.BLK,r=1.8) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${col}" />`;
const Txt = (x,y,t,sz=7,col=C.BLK,bold=false,anchor='start',rot=0) => {
  const tf = rot ? ` transform="rotate(${rot} ${x} ${y})"` : '';
  return `<text x="${x}" y="${y}" font-size="${sz}" font-weight="${bold?'700':'400'}" fill="${col}" text-anchor="${anchor}"${tf}>${esc(t)}</text>`;
};
const Poly = (pts,col=C.BLK,fill='none',w=0.8) => `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" stroke="${col}" fill="${fill}" stroke-width="${w}" />`;

function drawQuarterLamp(cx, cy, col, lblTop='', tagBot='', r=5.0) {
  let s = '';
  if (lblTop) {
    const bw = Math.max(9.5, r * 2.0);
    s += R(cx - bw, cy - r - 8.5, bw * 2, 6.5, C.BLK, '#fff', 0.45);
    s += Txt(cx - bw + 1.5, cy - r - 3.5, lblTop.slice(0, 6), 3.4, C.BLK, true);
  }
  s += Cir(cx, cy, r, C.BLK, '#fff', 0.65);
  s += `<path d="M${cx},${cy} L${cx+r},${cy} A${r},${r} 0 0,0 ${cx},${cy-r} Z" fill="${col}" stroke="${C.BLK}" stroke-width="0.4"/>`;
  s += `<path d="M${cx},${cy} L${cx-r},${cy} A${r},${r} 0 0,0 ${cx},${cy+r} Z" fill="${col}" stroke="${C.BLK}" stroke-width="0.4"/>`;
  if (tagBot) s += Txt(cx + r + 1.2, cy + 3, tagBot, 3.8, col, true);
  return s;
}

function drawRealisticSelector(cx, cy, lblBot='', sz=6.0) {
  let s = R(cx - sz - 1, cy - sz - 7.5, (sz+1)*2, 6.0, C.BLK, '#fff', 0.45);
  s += Txt(cx - sz, cy - sz - 2.8, 'M-O-A', 3.3, C.BLK, true);
  s += R(cx - sz, cy - sz, sz*2, sz*2, C.BLK, '#fff', 0.65);
  s += Cir(cx, cy, sz*0.75, C.BLK, 'none', 0.55);
  s += L(cx, cy - sz*0.65, cx, cy + sz*0.65, C.BLK, 1.2);
  if (lblBot) {
    const bw = Math.max(10.0, sz * 1.6);
    s += R(cx - bw, cy + sz + 1.5, bw*2, 6.0, C.BLK, '#fff', 0.45);
    s += Txt(cx - bw + 1.5, cy + sz + 6.0, lblBot.slice(0, 6), 3.4, C.BLK, true);
  }
  return s;
}

    const x = 28 + c * colW;
    if (c > 0) s += L(x, 14, x, 26, C.BLK, 0.5);
    s += Txt(x + colW/2, 22, String(c).padStart(2,'0'), 6.5, C.BLK, false, 'middle');

function draw3pBreaker(x, y, tag, spec, isMpcb=false) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y, px, y+8, C.BLK, 0.9);
    s += L(px-4, y+10, px, y+24, C.BLK, 1.0);
    s += L(px, y+24, px, y+34, C.BLK, 0.9);
    s += L(px-2, y+6, px+2, y+10, C.BLK, 0.7) + L(px+2, y+6, px-2, y+10, C.BLK, 0.7);
    s += Txt(px+2.5, y+6, String(1+i*2), 5.2, C.BLK);
    s += Txt(px+3.5, y+35.5, String(2+i*2), 5.2, C.BLK);
  });
  s += L(x-14, y+16, x+22, y+16, C.BLK, 0.6, '2 2');
  s += R(x-20, y+12, 6, 8, C.BLK, 'none', 0.8);
  if (isMpcb) [0,12,24].forEach(dx => s += R(x+dx-3, y+23, 6, 6, C.BLK, 'none', 0.7));
  s += Txt(x+32, y+11, tag, 7.5, C.BLK, true);
  s += Txt(x+32, y+20, spec, 6, C.GRY);
  return s;
}

function draw3pOverload(x, y, tag, spec) {
  let s = '';
  [0, 12, 24].forEach((dx, i) => {
    const px = x + dx;
    s += L(px, y, px, y+8, C.BLK, 0.9);
    // IEC Thermal Overload Heater Element (stepped square wave)
    s += L(px, y+8, px-4, y+8, C.BLK, 0.9) + L(px-4, y+8, px-4, y+14, C.BLK, 0.9) + L(px-4, y+14, px, y+14, C.BLK, 0.9) + L(px, y+14, px, y+20, C.BLK, 0.9) + L(px, y+20, px-4, y+20, C.BLK, 0.9) + L(px-4, y+20, px-4, y+24, C.BLK, 0.9) + L(px-4, y+24, px, y+24, C.BLK, 0.9);
    s += L(px, y+24, px, y+32, C.BLK, 0.9);
    s += Txt(px+2.5, y+6, String(1+i*2), 5.0, C.GRY);
    s += Txt(px+2.5, y+31.5, String(2+i*2), 5.0, C.BLK);
  });
  s += L(x-12, y+16, x+22, y+16, C.BLK, 0.6, '2 2');
  s += Txt(x+32, y+12, tag, 7.5, C.BLK, true) + Txt(x+32, y+21, spec, 5.8, C.GRY);
  return s;
}

function drawMotor(x, y, idx, isEc, ecFan, acFan) {
  let s = '';

  const peX = x + 36;
  s += L(peX, y-38, peX, y-4, C.GRN, 0.9);
  s += Cir(peX, y-22, 2.2, C.GRN, '#fff', 0.8);

  s += Txt(cx+22, cy+19, '3PH 380V 50Hz', 5.5, C.GRY);
  s += Txt(cx-20, cy+38, `FAN MOTOR ${idx}`, 7, C.BLK, true);
  return s;
}

function drawTerminalStrip(x0, y0, tag, labelsTop, labelsBot, pinW=13) {
  const n = labelsTop.length;
  let s = R(x0-10, y0, 10, 26, C.BLK, C.TGRN, 0.7);
  s += Txt(x0-3, y0+20, 'STOP', 4.2, '#fff', true, 'start', -90);
  s += Txt(x0-36, y0+16, tag, 7.5, C.BLU, true);
  for (let i = 0; i < n; i++) {
    const px = x0 + i * pinW;
    s += R(px, y0, pinW, 8, C.BLK, C.YEL, 0.6);
    s += R(px, y0+8, pinW, 10, C.BLK, '#f2f2f2', 0.6);
    s += R(px, y0+18, pinW, 8, C.BLK, C.YEL, 0.6);
    s += Cir(px+pinW/2, y0+4, 2.2, C.BLK, 'none', 0.6);
    s += Cir(px+pinW/2, y0+22, 2.2, C.BLK, 'none', 0.6);
    s += Txt(px+pinW/2, y0+15, String(i+1), 5.0, C.BLK, true, 'middle');
    s += Txt(px+pinW/2+2, y0-3, labelsTop[i], 4.8, C.BLU, false, 'start', -90);
    s += Txt(px+pinW/2+2, y0+30, labelsBot[i], 4.8, C.BLK, false, 'start', 90);
  }
  const rx = x0 + n * pinW;
  s += R(rx, y0, 10, 26, C.BLK, C.TGRN, 0.7);
  s += Txt(rx+7, y0+20, 'STOP', 4.2, '#fff', true, 'start', -90);
  return s;
}

function lookupKt(tempC) {
  const tc = Number(tempC) || DEFAULT_AMB_TEMP_C;
  for (let i = 0; i < KT_AMBIENT.length; i++) {
    if (tc <= KT_AMBIENT[i].temp) return KT_AMBIENT[i].kt;
  }
  return KT_AMBIENT[KT_AMBIENT.length - 1].kt;
}

function lookupKg(ckts) {
  const c = Math.max(1, Number(ckts) || 1);
  let kg = 1.0;
  for (const row of KG_GROUP) {
    if (c >= row.ckts) kg = row.kg;
  }
  return kg;
}

function selectWireByIz(reqAmp, kt, kg, minMm2=1.5) {
  const factor = Math.max(0.1, kt * kg);
  for (const w of WIRE_TABLE) {
    if (w.mm2 >= minMm2 && +(w.iz30 * factor).toFixed(1) >= reqAmp) {
      return { ...w, izDerated: +(w.iz30 * factor).toFixed(1), exceeded: false };
    }
  }
  const top = WIRE_TABLE[WIRE_TABLE.length - 1];
  return { ...top, izDerated: +(top.iz30 * factor).toFixed(1), exceeded: true };
}

function selectPeMm2(phaseMm2) {
  // IEC 60364-5-54 Table 54.2 (min 10mm2 incomer mechanical bar bond)
  if (phaseMm2 <= 16) return Math.max(10, phaseMm2);
  if (phaseMm2 <= 35) return 16;
  const target = phaseMm2 / 2;
  const found = WIRE_TABLE.find(w => w.mm2 >= target);
  return found ? found.mm2 : Math.ceil(target);
}

function computeWireEstimate(sp) {
  const [wV, hV] = sp.cabSz.split('x').map(Number);
  const g = {
    wV, hV, cabW: wV / 1000, cabH: hV / 1000,
    hasCenterDuct: wV >= 1200,
    hingeDoors: wV >= 1200 ? 2 : 1
  };
  const mainNeutralWire = sp.peWire.replace(' (G/Y)', '');

  const items = [];
  for (const row of WIRE_FORMULA_TABLE) {
    if (row.cond && !row.cond(sp, g)) continue;
    const runs = row.runs(sp, g);
    const fixedNet = row.fixedNet ? row.fixedNet(sp, g) : null;
    const avgLen = fixedNet !== null ? (fixedNet / Math.max(1, runs)) : row.avgLen(sp, g);
    const net = fixedNet !== null ? +fixedNet.toFixed(1) : +(runs * avgLen).toFixed(1);
    const est = Math.ceil(net * (row.allow || 1.15));
    items.push({
      id: row.id, cat: row.cat, path: row.path(sp, g), wire: row.wire(sp, g),
      color: row.color(sp, g), runs, avgLen: +avgLen.toFixed(2), net, est, isOption: !!row.isOption
    });
  }

  const auxRuns = 22 + (sp.vfQty >= 2 ? 2 : 0) + (sp.hasPm ? 8 : 0);
  const intCtrlRuns = sp.n * 3 + (sp.nEc > 0 ? 8 + sp.isoCnt * 4 : 0);
  const doorLamps = sp.n * 2 + 4 + (sp.nEc > 0 ? 1 : 0);
  const topLampRuns = 4 + (sp.nEc > 0 ? 6 : 0) + (sp.hasPm ? 6 : 0);

  // Purchase Roll Summary
  const sumBy = (pred) => items.filter(pred).reduce((a, b) => a + b.est, 0);
  const mainPwrM = sumBy(i => i.id === 'MAIN_PWR');
  const mainNpeM = sumBy(i => i.id === 'MAIN_NEU' || i.id === 'MAIN_PE');
  const subM = sumBy(i => i.id === 'SUB_FDR');
  const motPwrM = sumBy(i => i.id === 'GRP_BR' || i.id === 'MTR_OUT' || i.id === 'PM_CT');
  const motPeM = sumBy(i => i.id === 'MTR_PE');
  const ctrlDoorM = sumBy(i => i.wire === 'VSF 1x1.0');
  const doorPeM = sumBy(i => i.id === 'DOOR_PE');
  const sigM = sumBy(i => i.wire === 'LIY-CY 2x0.75');
  const rsM = sumBy(i => i.wire === 'Belden 9841');
  const spdM = sumBy(i => i.id === 'OPT_SPD');

  const rollFmt = (m, unitLen=100) => m <= 30 ? `${m} m (Cut)` : `${Math.ceil(m / unitLen)}x ${unitLen}m Roll`;
  const summary = [
    [sp.mWireS, 'Main L1-L3', `${mainPwrM} m`, rollFmt(mainPwrM, 100)],
    [mainNeutralWire.replace(' sq.mm', ''), 'Main N + PE', `${mainNpeM} m`, `${mainNpeM} m (Cut)`],
    [sp.subWS, 'Sub-Feeders', `${subM} m`, rollFmt(subM, 100)],
    [sp.motWireS || 'VSF 1x2.5', 'Branch + Motor', `${motPwrM} m`, `${Math.ceil(motPwrM/100)}x 100m Roll`],
    ['VSF 1x2.5 G/Y', 'Motor Earth PE', `${motPeM} m`, rollFmt(motPeM, 100)],
    ['VSF 1x1.0', 'Ctrl + All Door', `${ctrlDoorM} m`, `${Math.ceil(ctrlDoorM/100)}x 100m Roll`],
    ['Braid 16 / 6.0', 'Door PE Strap', `${doorPeM} m`, `${g.hingeDoors}x 0.6m Strap`]
  ];
  if (spdM > 0) summary.push(['VSF 1x10', 'SPD Surge Leads', `${spdM} m`, `${spdM} m (Cut)`]);
  if (sigM > 0) summary.push(['LIY-CY 2x0.75', '0-10V Analog', `${sigM} m`, rollFmt(sigM, 100)]);
  if (rsM > 0) summary.push(['Belden 9841', 'RS485 Shield', `${rsM} m`, `${rsM} m (Cut)`]);

  const hingeWiresTotal = sp.n * 4 + g.hingeDoors * 2 + (4 + (sp.nEc > 0 ? 8 : 0) + (sp.hasPm ? 6 : 0)) + g.hingeDoors + (sp.hasEstop ? 4 : 0);
  const wiresPerDoor = Math.ceil(hingeWiresTotal / g.hingeDoors);
  const conduitSize = wiresPerDoor <= 28 ? 'Ø16 mm' : (wiresPerDoor <= 45 ? 'Ø20 mm' : (wiresPerDoor <= 68 ? 'Ø25 mm' : 'Ø32 mm'));

  const maxPerR = (wV <= 650 || sp.n <= 8) ? 4 : (sp.n <= 20 ? 8 : 10);
  const rowsIn = Math.ceil(sp.n / maxPerR);
  const innerW = Math.max(0.45, g.cabW - 0.12);
  const duct60x80M = sp.n >= 16 ? +((2 * g.cabH + innerW * 2) * 1.15).toFixed(1) : 0;
  const duct40x60M = +(((sp.n >= 16 ? (g.cabH + rowsIn * innerW + innerW) : (2 * g.cabH + (rowsIn + 2) * innerW)) + 0.5) * 1.15).toFixed(1);
  const duct60x80Bars = duct60x80M > 0 ? Math.ceil(duct60x80M / 2) : 0;
  const duct40x60Bars = Math.ceil(duct40x60M / 2);
  const dinRailM = +((rowsIn + 2.6) * innerW * 1.15).toFixed(1);
  const dinRailBars = Math.ceil(dinRailM / 2);

  const lugMainMm2 = sp.mWireS.replace('VSF 1x', '');
  const lugPeMm2 = sp.peWire.replace('VSF 1x', '').replace(' sq.mm (G/Y)', '');
  const xr1Spec = sp.mainBrk <= 32 ? `TB-60A / UK-10N (5P, ${lugMainMm2}mm2, DT-${lugMainMm2} M5)`
    : (sp.mainBrk <= 63 ? `TB-100A / UK-16N (5P, ${lugMainMm2}mm2, DT-${lugMainMm2} M6)`
    : (sp.mainBrk <= 100 ? `TB-150A / UK-35N (5P, ${lugMainMm2}mm2, DT-${lugMainMm2} M8)`
    : (sp.mainBrk <= 160 ? `TB-200A / Stud M8 (5P, ${lugMainMm2}mm2, DT-${lugMainMm2} M8)`
    : `TB-300A / Stud M10 (5P, ${lugMainMm2}mm2, DT-${lugMainMm2} M10)`)));
  const lugMainQty = 6;
  const lugNpeQty = 6 + (sp.hasSpd ? 2 : 0);
  const ferrCtrl = Math.ceil(((auxRuns + intCtrlRuns + sp.n * 4 + topLampRuns + (sp.hasEstop ? 4 : 0)) * 2 + 12) * 1.15);
  const ferrTwin = Math.ceil((doorLamps + sp.n * 3) * 1.15);
  const ferrPwr = Math.ceil((sp.n * 7 * 2 + (sp.hasPm ? 12 : 0)) * 1.15);
  const ferrSubSpec = sp.subWS.includes('10') ? 'E10-12 (10mm2)' : (sp.subWS.includes('6') ? 'E6012 (6.0mm2)' : 'E4009 (4.0mm2)');
  const ferrSub = Math.ceil(sp.grpCnt * 3 * 2 * 1.15);
  const ferrSig = (sp.nEc > 0 || sp.hasRs485) ? Math.ceil((sp.nEc * 4 + sp.isoCnt * 4 + (sp.hasRs485 ? 8 : 0)) * 1.15) : 0;
  const forkRingQty = Math.ceil((sp.n * 7 + (sp.nEc > 0 ? 18 : 10) + (sp.hasEstop ? 4 : 0)) * 1.15);

  const totalRuns = items.reduce((a, b) => a + b.runs, 0) + (sp.n * 2);
  const wireMarkers = Math.ceil(totalRuns * 2 * 1.15);
  const tagFanSets = sp.n;
  const tagTopPlates = 4 + (sp.nEc > 0 ? 3 : 0) + (sp.hasPm ? 1 : 0) + 2 + 1 + (sp.hasEstop ? 1 : 0);
  const tagDoorPcs = sp.n * 3 + tagTopPlates;
  const intPlateTags = sp.n * 3 + 1 + sp.grpCnt + 1 + 2 + sp.grpCnt + 1 + (sp.nEc > 0 ? 1 + sp.isoCnt + 1 : 0) + 4 + 2 + sp.grpCnt + 1 + (sp.hasSpd ? 2 : 0) + (sp.ctrlV === '24VDC' || sp.nEc > 0 ? 1 : 0);
  const tagTotalPcs = tagDoorPcs + intPlateTags;
  const endClampQty = sp.n > 20 ? 14 : 10;
  const jumperStripQty = Math.ceil((sp.n * 2 + 10) / 10);
  const mainGlandSpec = sp.mainBrk > 100 ? 'PG42 / M50' : (sp.mainBrk > 50 ? 'PG29 / M32' : 'PG21 / M25');
  const totalGlands = 1 + sp.n + (sp.nEc > 0 ? 3 : 2);
  const cableTiesQty = Math.ceil((sp.n * 12 + 60) / 100) * 100;
  const tieMountQty = Math.ceil(sp.n * 1.5 + 16);
  const grandTotalM = items.reduce((a, b) => a + b.est, 0);

  return {
    items, summary, hingeDoors: g.hingeDoors, hingeWiresTotal, wiresPerDoor, conduitSize,
    ferrCtrl, ferrTwin, ferrPwr, ferrSubSpec, ferrSub, ferrSig, forkRingQty,
    lugMainMm2, lugPeMm2, lugMainQty, lugNpeQty, xr1Spec,
    duct60x80M, duct60x80Bars, duct40x60M, duct40x60Bars, dinRailM, dinRailBars,
    wireMarkers, tagFanSets, tagTopPlates, tagDoorPcs, intPlateTags, tagTotalPcs,
    endClampQty, jumperStripQty, mainGlandSpec, totalGlands, cableTiesQty, tieMountQty,
    grandTotalM, subM, motPwrM, motPeM, ctrlDoorM, sigM, rsM, mainPwrM, mainNpeM, spdM,
    pwrDuctSpec: sp.n >= 16 ? (sp.mainBrk > 160 ? '60x80 (Rec 80x80)' : '60x80 mm') : '40x60 mm',
    pwrFillNote: sp.mainBrk > 160 ? 'Bend R>100mm Alert' : 'Fill <=45% OK'
  };
}

    customCode: document.getElementById('inCode').value.trim(),
    customer: document.getElementById('inCustomer').value.trim(),
    dateStr: document.getElementById('inDate').value.trim() || '2026-11',
    draftman: document.getElementById('inDraftman').value.trim(),
    approved: document.getElementById('inApproved').value.trim()
  };
}

// Pure calculation function: accepts explicit input object (headless/test safe, zero DOM access)
function computeSpec(inputOpt=null) {
  const inp = inputOpt || readUiInput();
  const lang = I18N[inp.lang] ? inp.lang : state.lang;
  const tr = (k, vars={}) => t(k, vars, lang);
  const bkey = BRAND_MODELS[inp.bkey] ? inp.bkey : 'master';
  const bm = BRAND_MODELS[bkey];
  const coordRef = COORDINATION_TABLE[bkey];

  let nEc = Math.max(0, Math.min(32, parseInt(inp.nEc) || 0));
  let nAc = Math.max(0, Math.min(32, parseInt(inp.nAc) || 0));
  if (nEc + nAc === 0) nEc = 4;
  if (nEc + nAc > 32) {
    if (nEc > 32) nEc = 32;
    nAc = Math.max(0, 32 - nEc);
  }
  const n = nEc + nAc;
  const mode = (nEc > 0 && nAc > 0) ? 'Hybrid_30EC' : (nEc > 0 ? 'ALL-EC' : 'ALL-AC');
  const ecFan = inp.ecFan || FANS_DB['24611'];
  const acFan = inp.acFan || FANS_DB['24579'];

  const totalKw = +(nEc * ecFan.kw + nAc * acFan.kw).toFixed(2);
  const totalAmp = +(nEc * ecFan.amp + nAc * acFan.amp).toFixed(1);
  const totalCfm = nEc * ecFan.cfm + nAc * acFan.cfm;
  const iDesign = +(totalAmp * 1.25).toFixed(1);
  const reqBrkAmp = +(totalAmp / 0.80).toFixed(1);

  // Breaker Ceiling Check (>250AT NEVER silently clamps — sets fatal block!)
  const matchedBrk = STANDARD_AT_STEPS.find(a => a >= reqBrkAmp);
  const mainBrkExceeded = !matchedBrk || reqBrkAmp > MAX_PANEL_BREAKER_AT;
  const mainBrk = matchedBrk || (Math.ceil(reqBrkAmp / 50) * 50);

  const grpCnt = Math.ceil(n / 4);
  const isoCnt = nEc > 0 ? Math.ceil(nEc / 4) : 0;
  const hasIso = nEc > 0;
  const ctrlV = (inp.ctrlV === '24VDC' || inp.ctrlV === '220VAC') ? inp.ctrlV : (nEc > 0 ? '24VDC' : '220VAC');
  const contMod = ctrlV === '24VDC' ? bm.cont_24 : bm.cont_220;
  const isMccb = mainBrk >= 50;
  const mainType = isMccb ? 'MCCB' : 'MCB';
  const mainIcuNum = isMccb ? bm.mccbIcu : bm.grpIcu;
  const mainIcu = `${mainIcuNum}kA`;
  const mainMod = isMccb
    ? `${bm.mccb} 3P ${mainBrk}AT${inp.hasDoorInterlock ? ' + Door Interlock' : ''}`
    : `${bm.mcb} 3P ${mainBrk}AT`;
  const isoPages = nEc > 0 ? Math.ceil(isoCnt / 4) : 0;
  const isInv10V = inp.ecLogic !== '0-10v';

  // Ambient temperature, Isc & field run inputs
  const ambTempC = Math.max(15, Math.min(60, parseFloat(inp.ambTempC) || DEFAULT_AMB_TEMP_C));
  const iscKa = Math.max(1, Math.min(100, parseFloat(inp.iscKa) || DEFAULT_SITE_ISC_KA));
  const fieldLenM = Math.max(1, Math.min(500, parseFloat(inp.fieldLenM) || DEFAULT_FIELD_LEN_M));
  const kt = lookupKt(ambTempC);
  const kgMain = 0.80; // Main feeder shared vertical entry route
  const kgSub = lookupKg(Math.min(4, grpCnt));
  const kgMot = lookupKg(4); // Up to 4 motor branch circuits per horizontal branch trunking

  // Group-by-group fan allocation & Group MCB sizing
  const grpList = [];
  let maxGrpAmp = 0;
  for (let g = 0; g < grpCnt; g++) {
    const a = g * 4 + 1, b = Math.min((g + 1) * 4, n);
    let fEc = 0, fAc = 0;
    for (let k = a; k <= b; k++) { if (k <= nEc) fEc++; else fAc++; }
    const grpAmp = +(fEc * ecFan.amp + fAc * acFan.amp).toFixed(2);
    if (grpAmp > maxGrpAmp) maxGrpAmp = grpAmp;
    const reqGrpAt = grpAmp / 0.80;
    const grpAt = GROUP_MCB_STEPS.find(r => r >= Math.max(reqGrpAt, fAc > 0 ? 25 : 20)) || 63;
    grpList.push({ gIdx: g, a, b, fEc, fAc, grpAmp, grpMcbAt: grpAt, grpMcbSpec: `${bm.mcb} 3P ${grpAt}AT`, staggerSec: g * STAGGER_STEP_SEC });
  }
  const grpMcbAt = grpList.reduce((mx, x) => Math.max(mx, x.grpMcbAt), 20);
  const grpMcbSpec = `${bm.mcb} 3P ${grpMcbAt}AT`;

  // Conductor selection with Kt*Kg derating and In <= Iz_derated enforcement
  const minMainMm2 = mainBrk > 160 ? 95 : (mainBrk > 100 ? 50 : (mainBrk > 63 ? 25 : (mainBrk > 32 ? 16 : 10)));
  const mainWireObj = selectWireByIz(mainBrk, kt, kgMain, minMainMm2);
  const subWireObj = selectWireByIz(grpMcbAt, kt, kgSub, 4);
  const maxFanAmp = Math.max(nEc > 0 ? ecFan.amp : 0, nAc > 0 ? acFan.amp : 0);
  const maxOvlTripA = nAc > 0 ? Math.max(6.3, acFan.amp * 1.15) : Math.max(4.0, ecFan.amp * 1.15);
  const motWireObj = selectWireByIz(maxOvlTripA, kt, kgMot, 2.5);
  const peMm2 = selectPeMm2(mainWireObj.mm2);

  const mWire = `VSF 1x${mainWireObj.mm2} sq.mm`;
  const mWireS = `VSF 1x${mainWireObj.mm2}`;
  const mIz = `${mainWireObj.izDerated} A (Iz30:${mainWireObj.iz30}A x ${(kt*kgMain).toFixed(2)})`;
  const peWire = `VSF 1x${peMm2} sq.mm (G/Y)`;
  const peS = `1x${peMm2}`;
  const subW = `VSF 1x${subWireObj.mm2} sq.mm`;
  const subWS = `VSF 1x${subWireObj.mm2}`;
  const subIz = `${subWireObj.izDerated} A (Iz30:${subWireObj.iz30}A x ${(kt*kgSub).toFixed(2)})`;
  const motWireS = `VSF 1x${motWireObj.mm2}`;

  const hasMainBus = (n > 12 || mainBrk > 160);
  const busSize = mainBrk > 160 ? '20x5 mm Cu' : '15x3 mm Cu';
  const busAmp = mainBrk > 160 ? '355 A' : '210 A';
  const mainBusSpec = mainBrk > 160 ? '20x5 mm Cu (355A)' : (hasMainBus ? '15x3 mm Cu (210A)' : 'Comb / Cable');

  // Voltage drop check (Panel incomer ~3m + Furthest motor field cable run)
  const cosPhi = 0.88, sinPhi = 0.475;
  const dvPanelPct = +((SQRT3 * totalAmp * 3 * (mainWireObj.r * cosPhi + mainWireObj.x * sinPhi) / 1000) / DESIGN_VOLTAGE_V * 100).toFixed(2);
  const dvBranchPct = +((SQRT3 * maxFanAmp * fieldLenM * (motWireObj.r * cosPhi + motWireObj.x * sinPhi) / 1000) / DESIGN_VOLTAGE_V * 100).toFixed(2);
  const dvTotalPct = +(dvPanelPct + dvBranchPct).toFixed(2);
  const recFieldWireObj = WIRE_TABLE.find(w => w.mm2 >= motWireObj.mm2 && ((SQRT3 * maxFanAmp * fieldLenM * (w.r * cosPhi + w.x * sinPhi) / 1000) / DESIGN_VOLTAGE_V * 100 + dvPanelPct) <= MAX_VDROP_TOTAL_PCT) || WIRE_TABLE[WIRE_TABLE.length - 1];
  const recFieldWire = `VCT 4x${recFieldWireObj.mm2} sq.mm`;

  // 24VDC Load Budget & PSU Selection from PSU_CATALOG
  const kmrDcCount = ctrlV === '24VDC' ? n : 0;
  const dcRelayCount = 5 + grpCnt + 1; // RY1..5 + KTR_G + KRL Latch
  const dcLampCount = Math.max(4, n + 2);
  const dcLoadW = +((kmrDcCount * DC_LOAD_BUDGET.contactorCoilW) + (dcRelayCount * DC_LOAD_BUDGET.timerRelayW) + (dcLampCount * DC_LOAD_BUDGET.pilotLedW) + (isoCnt * 4 * (DC_LOAD_BUDGET.isoModuleMa / 1000) * CTRL_DC_V) + (nEc * (DC_LOAD_BUDGET.ecCtrlBoardMa / 1000) * CTRL_DC_V) + (nEc > 0 && !isInv10V ? 2.4 : 0)).toFixed(1);
  const dcLoadA = +(dcLoadW / CTRL_DC_V).toFixed(2);
  const dcDesignA = +(dcLoadA * 1.25).toFixed(2);
  const dcPeakSurgeA = +(dcLoadA + (ctrlV === '24VDC' ? Math.min(4, n) * (DC_LOAD_BUDGET.contactorCoilW / CTRL_DC_V) * (DC_LOAD_BUDGET.contactorInrushMult - 1) : 0)).toFixed(2);
  const matchedPsu = PSU_CATALOG.find(p => p.amps >= dcDesignA);
  const psuSel = matchedPsu || PSU_CATALOG[PSU_CATALOG.length - 1];
  const psuExceeded = !matchedPsu;
  const psuUtilPct = Math.round((dcLoadA / psuSel.amps) * 100);
  const spsSpec = psuSel.model;
  const dcMcbCandidates = [2, 4, 6, 10, 16, 20].filter(r => r <= psuSel.amps);
  const dcMcbAt = dcMcbCandidates.length ? dcMcbCandidates[dcMcbCandidates.length - 1] : 2;
  const dcMcbSpec = bm.dcMcb.replace(/\b\d+A\b/, `${dcMcbAt}A`);

  const hasPm = !!inp.hasPm;
  const hasRs485 = hasPm && !!inp.useRs485 && nEc > 0;
  const hasSpd = !!inp.hasSpd;
  const hasDoorInterlock = !!inp.hasDoorInterlock;
  const hasEstop = !!inp.hasEstop;
  const hasOvlIndivLatch = !!inp.hasOvlIndivLatch;
  const pmMod = { master:'Schneider PM2120', th:'Mitsubishi ME96SS', vn:'Selec MFM384-C', cn:'Chint DTSU666' }[bkey];
  const ctRatio = mainBrk <= 50 ? '50/5A' : (mainBrk <= 100 ? '100/5A' : (mainBrk <= 160 ? '150/5A' : '250/5A'));
  const pprMod = inp.pprMod || 'Selec 900VPR-BL-U';

  // Cabinet & Thermal Dissipation -> VF_CATALOG Selection
  const autoCab = n <= 4 ? '570x690x250' : (n <= 8 ? '600x1000x250' : (n <= 12 ? '800x1200x250' : (n <= 16 ? '800x1500x400' : (n <= 20 ? '1000x1800x450' : (n <= 28 ? '1200x1800x450' : '1200x2000x500')))));
  const selCab = inp.selCab || 'auto';
  const cabSz = selCab === 'auto' ? autoCab : selCab;
  const [cabW, cabH] = cabSz.split('x').map(Number);

  const psuHeatW = (nEc > 0 || ctrlV === '24VDC') ? +(dcLoadW * ((1 / psuSel.eff) - 1)).toFixed(1) : 0;
  const rawHeatW = ((totalAmp / 100) * HEAT_BUDGET_W.mccbPer100A) + (grpCnt * 3 * HEAT_BUDGET_W.mcbPerPoleW) + (n * (HEAT_BUDGET_W.contactorOnW + HEAT_BUDGET_W.overloadRelayW)) + psuHeatW + (isoCnt * 4 * HEAT_BUDGET_W.isoChannelW) + HEAT_BUDGET_W.baseAuxW + (grpCnt * 1.5) + (hasPm ? 4.5 : 0) + (hasRs485 ? 2.0 : 0) + (hasSpd ? 1.0 : 0);
  const heatLossW = Math.round(rawHeatW * 1.15);
  const thermalDeltaAllow = Math.max(0, CAB_MAX_TEMP_LIMIT_C - ambTempC);
  const ambientOverheat = ambTempC >= 45; // <5C margin below 50C switchgear limit
  const dT_calc = thermalDeltaAllow <= 0 ? 2 : Math.min(10, thermalDeltaAllow);
  const reqAirflowM3h = Math.ceil((3.1 * heatLossW) / dT_calc);
  const matchedVf = VF_CATALOG.find(v => v.deratedM3h >= reqAirflowM3h);
  const vfSel = matchedVf || VF_CATALOG[VF_CATALOG.length - 1];
  const vfQty = vfSel.qty;
  const vfSpec = vfSel.model;
  const airflowShortfall = reqAirflowM3h > vfSel.deratedM3h;
  const thermalStatus = (ambTempC >= CAB_MAX_TEMP_LIMIT_C || airflowShortfall) ? 'FAIL' : (ambientOverheat ? 'WARN' : 'PASS');

  // Mounting plate density
  const plateArea = Math.max(1, (cabW - 60) * (cabH - 60));
  const usedArea = n * (52 * 165) + grpCnt * (60 * 110) + (nEc > 0 ? 45000 + isoCnt * (23 * 115) : 12000) + (hasPm ? 14000 : 0) + (hasRs485 ? 4000 : 0) + (hasSpd ? 7500 : 0) + (cabW * 170);
  const plateUtilPct = Math.min(99, Math.round((usedArea / plateArea) * 100));

  // EC Fan Fail-Safe Curve Check
  let ecFailSafeStatus = 'N/A', ecFailSafeNote = 'All-AC System';
  if (nEc > 0) {
    if (ecFan.id === 'CUSTOM' || ecFan.failSafeExpected === 'VERIFY') {
      ecFailSafeStatus = 'VERIFY';
      ecFailSafeNote = `Custom EC: verify 0V/10V curve (${inp.ecLogic})`;
    } else if (inp.ecLogic === ecFan.failSafeExpected) {
      ecFailSafeStatus = 'PASS';
      ecFailSafeNote = `${ecFan.name}: 10-0V matches BESS fail-safe [VERIFY OEM]`;
    } else {
      ecFailSafeStatus = 'WARN';
      ecFailSafeNote = `0-10V stops fan on wire break! (${ecFan.name} expects 10-0V)`;
    }
  }

  // Build Design Rule Checks (DRC) & Blocking Errors
  const icuPass = mainIcuNum >= iscKa;
  const drcChecks = [
    {
      code: 'DRC-01', rule: tr('drc_r1'),
      actual: `${mainBrk}AT (${reqBrkAmp}A req)`, limit: `<= ${MAX_PANEL_BREAKER_AT}AT`,
      status: mainBrkExceeded ? 'FAIL' : 'PASS', verify: false,
      detail: mainBrkExceeded ? tr('err_brk_max', { req: reqBrkAmp, at: mainBrk, max: MAX_PANEL_BREAKER_AT }) : 'IEC 61439 incomer rating OK'
    },
    {
      code: 'DRC-02', rule: tr('drc_r2'),
      actual: `${mainType} ${mainIcuNum}kA / Grp ${bm.grpIcu}kA`, limit: `Icu >= ${iscKa}kA [VERIFY]`,
      status: icuPass ? 'PASS' : 'FAIL', verify: true,
      detail: icuPass ? `Incomer Icu >= Site Isc (${iscKa}kA)` : tr('warn_icu', { icu: mainIcuNum, isc: iscKa })
    },
    {
      code: 'DRC-03', rule: tr('drc_r3'),
      actual: coordRef.typeRef, limit: `${bm.codeTag} OEM Table`,
      status: 'VERIFY', verify: true,
      detail: coordRef.note
    },
    {
      code: 'DRC-04', rule: tr('drc_r4'),
      actual: `Main ${mainWireObj.mm2}mm2 (${mainWireObj.izDerated}A >= ${mainBrk}A)`,
      limit: `Kt=${kt} Kg=${kgMain}/${kgSub}`,
      status: (mainWireObj.exceeded || subWireObj.exceeded || mainWireObj.izDerated < mainBrk || subWireObj.izDerated < grpMcbAt) ? 'FAIL' : 'PASS',
      verify: false,
      detail: `Sub ${subWireObj.mm2}mm2 (${subWireObj.izDerated}A >= ${grpMcbAt}A) | Mot ${motWireObj.mm2}mm2`
    },
    {
      code: 'DRC-05', rule: tr('drc_r5'),
      actual: `${dvTotalPct}% @ ${fieldLenM}m`, limit: `<= ${MAX_VDROP_TOTAL_PCT}% [VERIFY]`,
      status: dvTotalPct > MAX_VDROP_TOTAL_PCT ? 'WARN' : 'PASS', verify: true,
      detail: dvTotalPct > MAX_VDROP_TOTAL_PCT ? `Upgrade field cable -> ${recFieldWire}` : `Panel ${dvPanelPct}% + Field ${dvBranchPct}%`
    },
    {
      code: 'DRC-06', rule: tr('drc_r6'),
      actual: `${plateUtilPct}% (${cabSz})`, limit: `<= ${MAX_PLATE_DENSITY_PCT}%`,
      status: plateUtilPct > MAX_PLATE_DENSITY_PCT ? 'WARN' : 'PASS', verify: false,
      detail: plateUtilPct > MAX_PLATE_DENSITY_PCT ? `Recommend >= ${autoCab}` : 'Clearance & wireduct routing OK'
    },
    {
      code: 'DRC-07', rule: tr('drc_r7'),
      actual: `${dcDesignA}A / PSU ${psuSel.amps}A (${psuUtilPct}%)`,
      limit: `${psuSel.model.split(' ')[1]} (Surge ${dcPeakSurgeA}A)`,
      status: psuExceeded ? 'FAIL' : 'VERIFY', verify: true,
      detail: `Inrush ${psuSel.inrushA}A @ 230VAC [VERIFY datasheet]`
    },
    {
      code: 'DRC-08', rule: tr('drc_r8'),
      actual: `${heatLossW}W / ${reqAirflowM3h} m3/h @ ${ambTempC}C`,
      limit: `${vfSel.id} (${vfSel.deratedM3h} m3/h) <= ${CAB_MAX_TEMP_LIMIT_C}C`,
      status: thermalStatus, verify: true,
      detail: thermalStatus !== 'PASS' ? tr('warn_thermal', { amb: ambTempC, req: reqAirflowM3h, cap: vfSel.deratedM3h }) : `dT=${dT_calc}C margin OK`
    },
    {
      code: 'DRC-09', rule: tr('drc_r9'),
      actual: nEc > 0 ? `${inp.ecLogic} (${ecFan.name})` : 'N/A (All-AC)',
      limit: ecFan.failSafeExpected,
      status: ecFailSafeStatus, verify: nEc > 0,
      detail: ecFailSafeNote
    }
  ];

  const passCnt = drcChecks.filter(c => c.status === 'PASS').length;
  const warnCnt = drcChecks.filter(c => c.status === 'WARN').length;
  const failCnt = drcChecks.filter(c => c.status === 'FAIL').length;
  const verifyCnt = drcChecks.filter(c => c.verify).length;
  const overallDrc = failCnt > 0 ? 'FAIL' : (warnCnt > 0 ? 'WARN' : 'PASS');

  const errors = [];
  if (mainBrkExceeded) errors.push(tr('err_brk_max', { req: reqBrkAmp, at: mainBrk, max: MAX_PANEL_BREAKER_AT }));
  if (mainWireObj.exceeded) errors.push(`Conductor sizing exceeded 150 mm2 limit for ${mainBrk}AT @ ${ambTempC}C`);
  if (ambTempC >= CAB_MAX_TEMP_LIMIT_C) errors.push(tr('warn_thermal', { amb: ambTempC, req: reqAirflowM3h, cap: vfSel.deratedM3h }));

  const warns = [];
  if (selCab !== 'auto' && n > (CAB_MAX[cabSz] || 12)) warns.push(tr('warn_cab', { cab: cabSz, max: CAB_MAX[cabSz], n, auto: autoCab }));
  if (plateUtilPct > MAX_PLATE_DENSITY_PCT) warns.push(`⚠️ Plate density ${plateUtilPct}% (>85%) — recommend ${autoCab}`);
  if (!icuPass) warns.push(`⚠️ ${tr('warn_icu', { icu: mainIcuNum, isc: iscKa })}`);
  if (dvTotalPct > MAX_VDROP_TOTAL_PCT) warns.push(`⚠️ Voltage drop ${dvTotalPct}% (>3%) @ ${fieldLenM}m -> rec ${recFieldWire}`);
  if (ambientOverheat && ambTempC < CAB_MAX_TEMP_LIMIT_C) warns.push(`⚠️ ${tr('warn_thermal', { amb: ambTempC, req: reqAirflowM3h, cap: vfSel.deratedM3h })}`);
  if (ecFailSafeStatus === 'WARN') warns.push(`⚠️ ${ecFailSafeNote}`);
  if (nEc > 0 && ecFan.amp > 4.0) warns.push(tr('warn_ec', { amp: ecFan.amp }));
  if (nAc > 0 && acFan.amp > 6.3) warns.push(tr('warn_ac', { amp: acFan.amp }));

  const isBlocked = mainBrkExceeded || mainWireObj.exceeded;

  // Dynamic sheet index map (R12=DRC inserts before SLD=R13)
  const includeManual = inp.includeManual !== false;
  const manualPages = includeManual ? 3 : 0;
  const totalSheets = 12 + 1 + grpCnt + 1 + isoPages + grpCnt + 1 + manualPages;
  const shTag = (num) => `R${String(num).padStart(2, '0')}`;
  const shIdx = {
    cover: 'R01', contents: 'R02', symbols: 'R03', acronyms: 'R04',
    cubicle: 'R05', layout: 'R06', int: 'R07', fab: 'R08',
    bom: 'R09', wire: 'R10', load: 'R11', drc: 'R12', sld: 'R13',
    pwrStart: 14, pwrFirst: 'R14', pwrLast: shTag(13 + grpCnt),
    protNum: 14 + grpCnt, prot: shTag(14 + grpCnt),
    isoStart: 15 + grpCnt, isoFirst: isoPages > 0 ? shTag(15 + grpCnt) : null,
    ladStart: 15 + grpCnt + isoPages, ladFirst: shTag(15 + grpCnt + isoPages),
    termNum: 15 + 2 * grpCnt + isoPages, term: shTag(15 + 2 * grpCnt + isoPages),
    manStart: 16 + 2 * grpCnt + isoPages
  };

  const sheetList = [
    ['R01', tr('sh_cover')],
    ['R02', tr('sh_contents')],
    ['R03', tr('sh_symbols')],
    ['R04', tr('sh_acronyms')],
    ['R05', tr('sh_cubicle')],
    ['R06', tr('sh_layout')],
    ['R07', tr('sh_int')],
    ['R08', tr('sh_fab')],
    ['R09', tr('sh_bom')],
    ['R10', tr('sh_wire')],
    ['R11', tr('sh_load')],
    ['R12', tr('sh_drc')],
    ['R13', tr('sh_sld')]
  ];
  let sCur = 14;
  for (let g = 0; g < grpCnt; g++) sheetList.push([shTag(sCur++), tr('sh_power', { a: g*4+1, b: Math.min((g+1)*4, n) })]);
  sheetList.push([shTag(sCur++), tr('sh_prot')]);
  for (let ip = 0; ip < isoPages; ip++) sheetList.push([shTag(sCur++), tr('sh_iso', { a: ip*4+1, b: Math.min((ip+1)*4, isoCnt) })]);
  for (let g = 0; g < grpCnt; g++) sheetList.push([shTag(sCur++), tr('sh_ladder', { a: g*4+1, b: Math.min((g+1)*4, n) })]);
  sheetList.push([shTag(sCur++), tr('sh_term')]);
  if (includeManual) {
    sheetList.push([shTag(sCur++), tr('sh_func')]);
    sheetList.push([shTag(sCur++), tr('sh_safe')]);
    sheetList.push([shTag(sCur), tr('sh_tshoot')]);
  }

  // Central Wire-Number Allocator (strictly unique per electrical net; replaces fnum*4+6/10)
  const wireNums = (() => {
    let seq = 101;
    const nets = {};
    const alloc = (key) => (nets[key] !== undefined ? nets[key] : (nets[key] = String(seq++)));
    alloc('PPR_PHASE_OK'); alloc('PPR_FAULT'); alloc('VF_LIVE'); alloc('VF_THERM'); alloc('VF_MOTOR');
    alloc('KRL_SUP_POST_RST'); alloc('KRL_COIL_A1');
    alloc('XR4_01_FIELD'); alloc('XR4_02_FIELD');
    alloc('HLR1_3_FUSED_L1'); alloc('HLR1_3_FUSED_L2'); alloc('HLR1_3_FUSED_L3');
    alloc('HLR4_AC_HOT'); alloc('HLR4_AC_SW');
    alloc('ISO_24V_POS'); alloc('ISO_0V_NEG');
    alloc('ISO_REG1_OUT'); alloc('ISO_REG1_COM');
    alloc('ISO_SIG1_OUTP'); alloc('ISO_SIG1_OUTM');
    alloc('ISO_CTRL1_P'); alloc('ISO_CTRL1_M');
    alloc('ISO_BUS_P'); alloc('ISO_BUS_M');
    alloc('ISO_SS1_RY');
    const grpBus = [];
    for (let g = 0; g < grpCnt; g++) grpBus.push(alloc(`GRP${g + 1}_BUS`));
    const fans = {};
    for (let f = 1; f <= n; f++) {
      fans[f] = {
        kcExt:   alloc(`F${f}_KC_EXT`),
        xr4Int:  alloc(`F${f}_XR4_INT`),
        sarCom:  alloc(`F${f}_SAR_COM`),
        qfrOut:  alloc(`F${f}_QFR_OUT`),
        ryOut:   alloc(`F${f}_RY_OUT`),
        runLamp: alloc(`F${f}_RUN_LAMP`),

function syncUiFromSpec(sp) {
  state.mode = sp.mode; state.nEc = sp.nEc; state.nAc = sp.nAc;
  document.getElementById('inEcCount').value = sp.nEc;
  document.getElementById('inAcCount').value = sp.nAc;
  document.getElementById('pm_off').classList.toggle('active', !sp.hasPm);
  document.getElementById('pm_on').classList.toggle('active', sp.hasPm);
  document.getElementById('rs485Box').style.display = sp.hasPm ? 'block' : 'none';
  const rsOnBtn = document.getElementById('rs_on');
  const rsOffBtn = document.getElementById('rs_off');
  const rsNote = document.getElementById('rs485Note');
  if (sp.nEc === 0) {
    rsOnBtn.disabled = true; rsOnBtn.style.opacity = '0.4'; rsOnBtn.style.cursor = 'not-allowed';
    rsOffBtn.classList.add('active'); rsOnBtn.classList.remove('active');
    rsNote.textContent = t('rs_allac');
  } else {
    rsOnBtn.disabled = false; rsOnBtn.style.opacity = '1'; rsOnBtn.style.cursor = 'pointer';
    rsOffBtn.classList.toggle('active', !sp.hasRs485);
    rsOnBtn.classList.toggle('active', sp.hasRs485);
    rsNote.textContent = sp.hasRs485 ? t('rs_on_note') : t('rs_off_note');
  }
  const bomNote = document.getElementById('bomImpactNote');
  if (!sp.hasPm) bomNote.innerHTML = t('bom_none');
  else if (!sp.hasRs485) bomNote.innerHTML = t('bom_local', { pm: sp.pmMod, ct: sp.ctRatio });
  else bomNote.innerHTML = t('bom_rs485', { pm: sp.pmMod, ct: sp.ctRatio });

  document.getElementById('spd_off').classList.toggle('active', !sp.hasSpd);
  document.getElementById('spd_on').classList.toggle('active', sp.hasSpd);
  document.getElementById('ilk_off').classList.toggle('active', !sp.hasDoorInterlock);
  document.getElementById('ilk_on').classList.toggle('active', sp.hasDoorInterlock);
  document.getElementById('estop_off').classList.toggle('active', !sp.hasEstop);
  document.getElementById('estop_on').classList.toggle('active', sp.hasEstop);
  const ovlOffEl = document.getElementById('ovl_latch_off'), ovlOnEl = document.getElementById('ovl_latch_on');
  if (ovlOffEl && ovlOnEl) {
    ovlOffEl.classList.toggle('active', !sp.hasOvlIndivLatch);
    ovlOnEl.classList.toggle('active', sp.hasOvlIndivLatch);
  }

  const ecBoxEl = document.getElementById('ecLogicBox');
  if (ecBoxEl) ecBoxEl.style.display = sp.nEc > 0 ? 'block' : 'none';
  document.getElementById('ec_10_0v').classList.toggle('active', sp.isInv10V);
  document.getElementById('ec_0_10v').classList.toggle('active', !sp.isInv10V);
  const ecNoteEl = document.getElementById('ecLogicNote');
  if (ecNoteEl) { ecNoteEl.textContent = sp.isInv10V ? t('ec_note_inv') : t('ec_note_std'); ecNoteEl.style.color = sp.isInv10V ? '#86efac' : '#93c5fd'; }

  const warnEl = document.getElementById('cabWarn');
  if (sp.warns.length) { warnEl.style.display = 'block'; warnEl.innerHTML = sp.warns.join('<br>'); }
  else { warnEl.style.display = 'none'; }

  const errEl = document.getElementById('cabErr');
  if (errEl) {
    if (sp.errors.length) { errEl.style.display = 'block'; errEl.innerHTML = '⛔ ' + sp.errors.join('<br>⛔ '); }
    else { errEl.style.display = 'none'; }
  }
  const printBtn = document.getElementById('btnPrint');
  if (printBtn) {
    printBtn.disabled = !!sp.isBlocked;
    printBtn.title = sp.isBlocked ? sp.errors.join(' | ') : '';
  }
  document.getElementById('man_on').classList.toggle('active', sp.includeManual);
  document.getElementById('man_off').classList.toggle('active', !sp.includeManual);
}

  s += R(inL+5+mcb1W,r1y0+2,inW*0.09,r1h-4,C.RED,'#fff5f5',0.65)+Txt(inL+5+mcb1W+inW*0.045,r1y0+r1h/2+1.5,'PPR1',3.0,C.RED,true,'middle');
  const mSlot = Math.min(12.5, (inW*0.32)/Math.max(1,sp.grpCnt+1));
  for (let g=0;g<=sp.grpCnt;g++) s += R(inL+8+mcb1W+inW*0.09+g*mSlot, r1y0+3, mSlot-2, r1h-6, C.BLK, '#ebf0fa', 0.6)+Txt(inL+8+mcb1W+inW*0.09+g*mSlot+(mSlot-2)/2, r1y0+r1h/2+1.5, g===sp.grpCnt?'F':'M'+(g+2), 2.8, C.BLU, true, 'middle');
  if (sp.nEc>0) {
    const sxb = inL+inW*0.62;
    s += R(sxb,r1y0+2,inW*0.11,r1h-4,C.BLU,'#f0f5ff',0.7)+Txt(sxb+1.5,r1y0+r1h/2+2,'SPS1',4.0,C.BLU,true);
    s += R(sxb+inW*0.125,r1y0+3,inW*0.115,r1h-6,C.BLK,'#f5f5f5',0.55)+Txt(sxb+inW*0.18,r1y0+r1h/2+1.5,'RY/REG',2.9,C.BLK,true,'middle');
    s += R(sxb+inW*0.25,r1y0+2,inL+inW-2-(sxb+inW*0.25),r1h-4,C.GRN,'#f0fcf2',0.7)+Txt(sxb+inW*0.26,r1y0+r1h/2+2,'ISO',4.0,C.GRN,true);
  }
  // Dynamic Starter Rows (balanced evenly across rowsIn; even count for 2-door >=1200mm)
  const maxPerR = (wV <= 650 || sp.n <= 8) ? 4 : (sp.n <= 20 ? 8 : 10);
  const rowsIn = Math.ceil(sp.n / maxPerR);
  let perR = Math.ceil(sp.n / Math.max(1, rowsIn));
  if (hasCenterDuct && perR % 2 === 1) perR += 1;
  const zoneTop = iy0 + ih * 0.285, zoneH = ih * 0.435;
  const interDuctH = rowsIn >= 4 ? 4.5 : (rowsIn === 3 ? 5 : 6);
  const rowAvailH = (zoneH - (rowsIn - 1) * interDuctH) / Math.max(1, rowsIn);
  for (let r = 1; r < rowsIn; r++) {
    const dy = zoneTop + r * rowAvailH + (r - 1) * interDuctH;
    if (hasCenterDuct) {
      s += R(inL, dy, inW/2 - 3.5, interDuctH, C.GRY, '#efefef', 0.45, '2 1');
      s += R(inL + inW/2 + 3.5, dy, inW/2 - 3.5, interDuctH, C.GRY, '#efefef', 0.45, '2 1');
    } else {
      s += R(inL, dy, inW, interDuctH, C.GRY, '#efefef', 0.45, '2 1');
    }
  }
  for (let i=0;i<sp.n;i++) {
    const rr = Math.floor(i/perR), cc = i%perR;
    let sx, swBox;
    if (hasCenterDuct) {
      const halfC = perR / 2, halfW = (inW - 8) / 2, sPitch = halfW / halfC;
      swBox = Math.min(sPitch * 0.84, 24);
      sx = (cc < halfC ? inL + 1 + cc * sPitch : inL + inW/2 + 3.5 + (cc - halfC) * sPitch) + (sPitch - swBox) / 2;
    } else {
      const sPitch = (inW - 4) / perR;
      swBox = Math.min(sPitch * 0.84, 24);
      sx = inL + 2 + cc * sPitch + (sPitch - swBox) / 2;
    }
    const shT = Math.min(ih * 0.080, (rowAvailH - 3) * 0.50);
    const shB = Math.min(ih * 0.072, (rowAvailH - 3) * 0.42);
    const sy = zoneTop + rr * (rowAvailH + interDuctH) + (rowAvailH - (shT + 1.5 + shB)) / 2;
    s += R(sx,sy,swBox,shT,C.BLK,'#ebebeb',0.55)+Txt(sx+1.5,sy+shT*0.72,`K${i+1}`,rowsIn>=3?3.3:3.8,C.BLK,true);
    s += R(sx,sy+shT+1.5,swBox,shB,C.BLK,'#f2f5f5',0.55)+Cir(sx+swBox*0.33,sy+shT+1.5+shB*0.45,1.3,C.RED)+Cir(sx+swBox*0.67,sy+shT+1.5+shB*0.45,1.3,C.BLK);
  }
  // Upper Terminal Row (N-BAR | PE-BAR | XR2 | CTRL & 0-10V Drop)
  const r4y = iy0+ih*0.765, r4h = ih*0.055;
  s += R(inL, r4y, inW*0.115, r4h, C.BLU, '#e6f0ff', 0.7) + Txt(inL+inW*0.0575, r4y+r4h*0.68, 'N-BAR', 2.9, C.BLU, true, 'middle');
  s += R(inL+inW*0.125, r4y, inW*0.12, r4h, C.GRN, '#e0fae6', 0.7) + Txt(inL+inW*0.185, r4y+r4h*0.68, 'PE-BAR', 2.9, C.GRN, true, 'middle');
  s += R(inL+inW*0.26, r4y, inW*0.39, r4h, C.BLK, '#faf0b8', 0.65) + Txt(inL+inW*0.455, r4y+r4h*0.70, `XR2 (${sp.n*4}P)`, 3.6, C.BLK, true, 'middle');
  // Bottom Terminal Row (XR1 bottom-left | Motor Exit | XR4 & XR3 bottom-right)
  const r5y = iy0+ih*0.89, r5h = ih*0.062;
  s += R(inL, r5y, inW*0.245, r5h, C.RED, '#fff5f5', 0.7) + Txt(inL+inW*0.1225, r5y+r5h*0.68, 'XR1 (5P)', 3.6, C.RED, true, 'middle');
  // Routing arrows in Infront View (XR1 -> Left PWR duct, XR2 -> Mid Gland, Right CTRL/0-10V -> XR4/XR3)
  s += L(inL, r5y+r5h*0.5, ix0+6+vdW/2, r5y+r5h*0.5, C.RED, 0.8) + Poly([[ix0+6+vdW/2, r5y+r5h*0.5-4],[ix0+6+vdW/2-1.8, r5y+r5h*0.5-1],[ix0+6+vdW/2+1.8, r5y+r5h*0.5-1]], C.RED, C.RED, 0.3);
  [inL+inW*0.33, inL+inW*0.58].forEach(mx => {
    s += L(mx, r4y+r4h, mx, r5y+r5h+2, '#c2410c', 0.85) + Poly([[mx, r5y+r5h+2],[mx-1.8, r5y+r5h-1.5],[mx+1.8, r5y+r5h-1.5]], '#c2410c', '#c2410c', 0.3);
  });
  s += Txt(inL+inW*0.455, r5y+r5h*0.48, 'VCT MTR', 2.8, '#c2410c', true, 'middle');
  s += R(inL+inW*0.67, r5y, inW*0.16, r5h, C.BLU, '#eff6ff', 0.65) + Txt(inL+inW*0.75, r5y+r5h*0.68, 'XR4', 3.5, C.BLU, true, 'middle');
  const hasXr3 = sp.nEc > 0 || sp.hasRs485;
  s += R(inL+inW*0.845, r5y, inW*0.155, r5h, hasXr3?C.GRN:C.GRY, hasXr3?'#f0fdf4':'#f1f5f9', 0.65) + Txt(inL+inW*0.9225, r5y+r5h*0.68, 'XR3', 3.5, hasXr3?C.GRN:C.GRY, true, 'middle');
  s += L(inL+inW*0.75, ldY+7, inL+inW*0.75, r5y, C.BLU, 0.7) + L(inL+inW*0.9225, ldY+7, inL+inW*0.9225, r5y, hasXr3?C.GRN:C.GRY, 0.7);
  s += R(ix0+iw/2-42,iy0+ih+8,84,13,C.BLK,'none',0.7)+Txt(ix0+iw/2,iy0+ih+17.5,t('lay_in'),5.8,C.BLK,true,'middle');

  // Side View
  s += L(sx0,iy0-8,sx0+sw,iy0-8,C.GRY,0.5)+Txt(sx0+sw/2,iy0-11,String(dV),6.5,C.GRY,false,'middle');
  s += R(sx0,iy0,sw,sh,C.BLK,'#f7f7f9',1.0);
  const rVf = Math.min(14.0, sw*0.30);
  s += Cir(sx0+sw/2,iy0+sh*0.16,rVf,C.BLK,'#fff',0.75);
  for(let a=0;a<360;a+=60) s += L(sx0+sw/2,iy0+sh*0.16,sx0+sw/2+(rVf-2)*Math.cos(a*Math.PI/180),iy0+sh*0.16+(rVf-2)*Math.sin(a*Math.PI/180),C.OYL,1.1);
  s += Cir(sx0+sw/2,iy0+sh*0.16,3.0,C.BLK,'#b3b3b3',0.5)+Txt(sx0+4,iy0+18,'VF1',4.8,C.BLK,true);
  if (sp.vfQty >= 2) {
    s += Cir(sx0+sw/2,iy0+sh*0.34,rVf,C.BLK,'#fff',0.75);
    for(let a=0;a<360;a+=60) s += L(sx0+sw/2,iy0+sh*0.34,sx0+sw/2+(rVf-2)*Math.cos(a*Math.PI/180),iy0+sh*0.34+(rVf-2)*Math.sin(a*Math.PI/180),C.OYL,1.1);
    s += Cir(sx0+sw/2,iy0+sh*0.34,3.0,C.BLK,'#b3b3b3',0.5)+Txt(sx0+4,iy0+sh*0.34-rVf+4,'VF2',4.8,C.BLK,true);
  }
  s += R(sx0+sw*0.2,iy0+sh*0.76,sw*0.6,sh*0.14,C.BLK,'none',0.65);
  for(let k=0;k<5;k++) s += L(sx0+sw*0.26,iy0+sh*0.78+k*(sh*0.022),sx0+sw*0.74,iy0+sh*0.78+k*(sh*0.022),C.GRY,0.5);
  s += R(sx0+sw/2-32,iy0+sh+8,64,13,C.BLK,'none',0.7)+Txt(sx0+sw/2,iy0+sh+17.5,t('lay_side'),5.6,C.BLK,true,'middle');

  const bx0 = Math.max(sx0 + sw + 18, 684);
  s += R(bx0,iy0,800-bx0,264,C.BLK,C.BG,0.8);
  s += Txt(bx0+6,iy0+17,t('lay_spec'),7.6,C.BLU,true)+Txt(bx0+6,iy0+35,`W: ${wV} mm`,7.2,C.BLK,true)+Txt(bx0+6,iy0+50,`H: ${hV} mm`,7.2,C.BLK,true)+Txt(bx0+6,iy0+65,`D: ${dV} mm`,7.2,C.BLK,true);
  s += Txt(bx0+6,iy0+82,`SCALE 1:${scaleDenom}`,6.8,C.RED,true)+Txt(bx0+6,iy0+99,'IP55 RAL 7035',6.6,C.BLK,true)+Txt(bx0+6,iy0+114,'1.5mm Steel',6.6,C.GRY,true);
  s += Txt(bx0+6,iy0+133,'PE-BAR: 15x3 Cu',6.4,C.GRN,true)+Txt(bx0+6,iy0+148,'N-BAR : 15x3 Cu',6.4,C.BLU,true)+Txt(bx0+6,iy0+163,`Duct  : ${sp.n>=16?'60x80/40x60':'40x60mm'}`,6.2,C.BLK,true);
  s += L(bx0+4,iy0+173,796,iy0+173,C.LGRY,0.6);
  s += Txt(bx0+6,iy0+187,'THERMAL & DUCT',6.5,C.BLU,true);
  s += Txt(bx0+6,iy0+203,`Plate : ${sp.plateUtilPct}% used`,6.4,sp.plateUtilPct>85?C.RED:C.GRN,true);
  s += Txt(bx0+6,iy0+218,`Heat  : ${sp.heatLossW} W`,6.4,C.BLK,true);
  s += Txt(bx0+6,iy0+233,`Air   : >=${sp.reqAirflowM3h} m3/h`,6.4,C.BLU,true);
  s += Txt(bx0+6,iy0+248,`Fan   : ${sp.vfSpec.split('+')[0].trim()}`,6.0,C.RED,true);
  s += R(bx0+6,iy0+256,6,6,C.RED,'#fee2e2',0.5)+Txt(bx0+15,iy0+261,'PWR',4.8,C.RED,true)+R(bx0+44,iy0+256,6,6,C.BLU,'#e0f2fe',0.5)+Txt(bx0+53,iy0+261,'CTRL/0-10V',4.8,C.BLU,true);
  return s;
}

function buildInternalDetail(sp) {
  let s = drawFrame(sp, 'INTERNAL MOUNTING PLATE DETAIL & WIRE ENTRY MAP', 7, 'R08');
  const [wV, hV, dV] = sp.cabSz.split('x').map(Number);
  s += Txt(421, 44, `INTERNAL MOUNTING PLATE DETAIL & WIRE ENTRY MAP (${wV}x${hV}x${dV} mm | ${sp.n} FANS)`, 9.4, C.BLK, true, 'middle');

  const C_MTR = '#c2410c';
  const drawHead = (p0, p1, col, sz=3.0) => {
    const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len, pxv = -uy, pyv = ux;
    return Poly([p1, [p1[0]-ux*sz*1.35+pxv*sz*0.75, p1[1]-uy*sz*1.35+pyv*sz*0.75], [p1[0]-ux*sz*1.35-pxv*sz*0.75, p1[1]-uy*sz*1.35-pyv*sz*0.75]], col, col, 0.35);
  };
  const drawRoute = (pts, col, w=1.05, dash='', arrowEnd=true, sz=3.0) => {
    let out = '';
    for (let k = 0; k < pts.length - 1; k++) out += L(pts[k][0], pts[k][1], pts[k+1][0], pts[k+1][1], col, w, dash);
    if (arrowEnd && pts.length >= 2) out += drawHead(pts[pts.length-2], pts[pts.length-1], col, sz);
    return out;
  };

  // === LEFT: ZOOMED INTERNAL MOUNTING PLATE WITH WIRE ENTRY & ROUTING ARROWS ===
  const px = 42, py = 54, pw = 424, ph = 407;
  s += R(px, py, pw, ph, C.BLK, '#fcfcfc', 1.1) + R(px+4, py+4, pw-8, ph-8, C.GRY, 'none', 0.5);
  const vdW = 22, inL = px + 6 + vdW + 6, inW = pw - 12 - 2 * vdW - 10;
  const ductSz = sp.n >= 16 ? '60x80' : '40x60';

  // Left Vertical Power Duct (Red) & Right Vertical Control/0-10V Duct (Blue)
  const ldX = px + 6, rdX = px + pw - 6 - vdW;
  s += R(ldX, py+10, vdW, ph-20, C.RED, '#fee2e2', 0.8, '3 2');
  s += R(rdX, py+10, vdW, ph-20, C.BLU, '#e0f2fe', 0.8, '3 2');

  // Horizontal Wireducts (Top, Mid below DIN Rail 1, Main Motor above XR2) - boxes first, labels on top after routing
  const hdTopY = py + 10, hdMidY = py + 94, hdMotY = py + 276, hdLowY = py + 336;
  const hasCenterDuct = wV >= 1200;
  const hdBoxes = [
    [hdTopY, sp.hasMainBus ? `TOP DUCT + 3P CU BUSBAR (${sp.mainBusSpec})` : `TOP WIREDUCT 40x60 (MAIN INCOMING -> MCB1 | CTRL BUS)`, false, '#f1f5f9'],
    [hdMidY, `MID WIREDUCT ${ductSz} (MCB2.. -> KMR | CTRL BUS)`, false, '#f1f5f9'],
    [hdMotY, `MAIN MOTOR DUCT ${ductSz} (QFR1..${sp.n} -> XR2)`, true, '#fff7ed']
  ];
  hdBoxes.forEach(([dy, lbl, isMot, bgCol]) => {
    s += R(inL, dy, inW, 14, isMot ? C_MTR : C.GRY, bgCol, 0.6, '2 1');
  });

  // DIN RAIL 1: Main Breaker, PPR1, Branch MCBs, FUR, SPS1, RY/REG1, ISO
  const r1y = py + 30, r1h = 56;
  const r1Devs = sp.nEc > 0 ? [
    { tag:'MCB1'+(sp.hasDoorInterlock?'+ILK':''), spec:`${sp.mainBrk}AT`, inT:'TOP: L1-L3 (XR1)', outB:'BOT: -> MCB2..', w:0.10, col:C.RED, bg:'#fff5f5' },
    ...(sp.hasSpd ? [{ tag:'MCB+SPD1', spec:'4P32A+40kA', inT:'TOP: L1-3,N', outB:'BOT: -> PE', w:0.08, col:C.RED, bg:'#fef2f2' }] : []),
    { tag:'PPR1', spec:sp.pprMod.slice(0,9), inT:'TOP: L1-L3,N', outB:'BOT: 14/12', w:0.09, col:C.RED, bg:'#fff8f8' },
    { tag:`MCB2..${sp.grpCnt+1}`, spec:`${sp.grpCnt}x ${sp.grpMcbAt}AT`, inT:'TOP: BUS', outB:'BOT: -> KMR', w:0.12, col:C.BLU, bg:'#ebf0fa' },
    { tag:'MCB4+FUR1-2', spec:'6AT+6A+2A', inT:'TOP: L1/L3', outB:'BOT: PPR/VF', w:0.10, col:C.BLK, bg:'#f8fafc' },
    { tag:`FUR3..${sp.grpCnt+2}`, spec:`${sp.grpCnt}x 2A CTRL`, inT:'TOP: MCB4', outB:'BOT: GRP', w:0.09, col:C.BLK, bg:'#f8fafc' },
    { tag:`SPS1+MCB5`, spec:`${sp.psuSel.amps}A+${sp.dcMcbAt}ADC`, inT:'TOP: 220V', outB:'BOT: +24/0V', w:0.11, col:C.BLU, bg:'#f0f5ff' },
    sp.isInv10V
      ? { tag:'RY/KTR/KRL', spec:`24V+${sp.ovlIsoTag}`, inT:'TOP: +24V/SS1', outB:'BOT: 0V/RST1', w:0.11, col:C.BLK, bg:'#f8fafc' }
      : { tag:'RY+KTR+REG1', spec:`10V+${sp.ovlIsoTag}`, inT:'TOP: +24V', outB:'BOT: 0V/10V', w:0.11, col:C.BLK, bg:'#f8fafc' },
    { tag:`ISO1..${sp.isoCnt}`, spec:'22.5x115mm', inT:'TOP: 24V/IN', outB:'BOT: -> XR3', w:sp.hasSpd?0.11:0.19, col:C.GRN, bg:'#f0fdf4' },
    { tag:'TS1', spec:'35C THERM', inT:'TOP: FUR2 2A', outB:'BOT: -> VF', w:0.09, col:C.OYL, bg:'#fffbeb' }
  ] : [
    { tag:'MCB1'+(sp.hasDoorInterlock?'+ILK':''), spec:`${sp.mainBrk}AT`, inT:'TOP: L1-L3 (XR1)', outB:'BOT: -> MCB2..', w:0.12, col:C.RED, bg:'#fff5f5' },
    ...(sp.hasSpd ? [{ tag:'MCB+SPD1', spec:'4P32A+40kA', inT:'TOP: L1-3,N', outB:'BOT: -> PE', w:0.09, col:C.RED, bg:'#fef2f2' }] : []),
    { tag:'PPR1', spec:sp.pprMod.slice(0,9), inT:'TOP: L1-L3,N', outB:'BOT: 14/12', w:0.11, col:C.RED, bg:'#fff8f8' },
    { tag:`MCB2..${sp.grpCnt+1}`, spec:`${sp.grpCnt}x ${sp.grpMcbAt}AT`, inT:'TOP: BUS', outB:'BOT: -> KMR', w:0.16, col:C.BLU, bg:'#ebf0fa' },
    { tag:'MCB4+FUR1-2', spec:'6AT+6A+2A', inT:'TOP: L1/L3', outB:'BOT: PPR/VF', w:0.12, col:C.BLK, bg:'#f8fafc' },
    { tag:`FUR3..${sp.grpCnt+2}`, spec:`${sp.grpCnt}x 2A CTRL`, inT:'TOP: MCB4', outB:'BOT: GRP', w:0.10, col:C.BLK, bg:'#f8fafc' },
    { tag:'RY+KTR+KRL', spec:`220V+${sp.ovlIsoTag}`, inT:'TOP: 220V', outB:'BOT: -> KMR', w:0.14, col:C.BLU, bg:'#f0f5ff' },
    { tag:'SPARE', spec:'NO 0-10V', inT:'ALL-AC', outB:'DIRECT ON/OFF', w:sp.hasSpd?0.07:0.16, col:C.GRY, bg:'#f1f5f9' },
    { tag:'TS1', spec:'35C THERM', inT:'TOP: FUR2 2A', outB:'BOT: -> VF', w:0.09, col:C.OYL, bg:'#fffbeb' }
  ];
  let cx1 = inL;
  const r1Centers = {};
  r1Devs.forEach((d, idx) => {
    const dw = d.w * inW - 3;
    s += R(cx1, r1y, dw, r1h, d.col, d.bg, 0.8);
    s += Txt(cx1+dw/2, r1y+12, d.tag, dw<32?4.5:5.0, d.col, true, 'middle');
    s += Txt(cx1+dw/2, r1y+22, d.spec, 4.0, C.GRY, false, 'middle');
    s += Txt(cx1+dw/2, r1y+36, d.inT, 3.5, C.RED, true, 'middle');
    s += Txt(cx1+dw/2, r1y+47, d.outB, 3.5, C.BLU, true, 'middle');
    r1Centers[idx] = { cx: cx1 + dw/2, left: cx1, right: cx1 + dw };
    cx1 += dw + 3;
  });
  // TS1 center ref (route drawn in routing section below after t1y init)
  const tsC = r1Centers[r1Devs.length - 1];

  // DIN RAIL 2+: Balanced Starter Rows + Intermediate Horizontal Wireducts (matching buildLayout)
  const maxPerR = (wV <= 650 || sp.n <= 8) ? 4 : (sp.n <= 20 ? 8 : 10);
  const rowsIn = Math.ceil(sp.n / maxPerR);
  let perR = Math.ceil(sp.n / Math.max(1, rowsIn));
  if (hasCenterDuct && perR % 2 === 1) perR += 1;
  const sZoneTop = py + 112, sZoneH = 160;
  const hdMidH = rowsIn >= 4 ? 8 : (rowsIn === 3 ? 9 : 11);
  const availRowH = (sZoneH - (rowsIn - 1) * hdMidH) / Math.max(1, rowsIn);

  if (hasCenterDuct) {
    s += R(inL + inW/2 - 5, sZoneTop, 10, sZoneH, C.OYL, '#fef3c7', 0.6, '2 1');
  }
  const interDuctYs = [];
  for (let r = 1; r < rowsIn; r++) {
    const dy = sZoneTop + r * availRowH + (r - 1) * hdMidH;
    interDuctYs.push(dy);
    if (hasCenterDuct) {
      const hw = inW/2 - 6;
      s += R(inL, dy, hw, hdMidH, C.GRY, '#f1f5f9', 0.55, '2 1');
      s += R(inL + inW/2 + 6, dy, hw, hdMidH, C.GRY, '#f1f5f9', 0.55, '2 1');
    } else {
      s += R(inL, dy, inW, hdMidH, C.GRY, '#f1f5f9', 0.55, '2 1');
    }
  }

  const rowBounds = [];
  for (let i = 0; i < sp.n; i++) {
    const rr = Math.floor(i / perR), cc = i % perR;
    let sx, swB;
    if (hasCenterDuct) {
      const halfC = perR / 2, halfW = inW / 2 - 7, sPitch = halfW / halfC;
      swB = Math.min(sPitch - 3, 42);

    const hK = Math.min(28, (availRowH - 4) * 0.50);

  }

  // LOWER TERMINAL ZONE: EMI-Segregated 2-Row Architecture
  const t1y = py + 296, t1H = 34;
  const nBarX = inL, nBarW = inW * 0.115;

  s += R(rDropX, t1y, rDropW, t1H, '#93c5fd', '#f8fafc', 0.5, '2 2') + Txt(rDropX+rDropW/2, t1y+8, 'CTRL & 0-10V ZONE (NO 380V CROSSING)', 3.8, C.BLU, true, 'middle');

  // Lower Duct boxes (labels drawn after routing arrows so lines never cross text)
  s += R(nBarX, hdLowY, inW*0.243, 14, C.GRY, '#f1f5f9', 0.55, '2 1');

  // Bottom Terminal Row (t2y): XR1 (bottom-left) | Motor Exit | XR4 (bottom-right-inner) | XR3 (bottom-right-outer)

  // === COLOR-CODED ROUTING PATHS & DIRECTIONAL ARROWS ===

  // 4) Control (BLUE) & 0-10V Signal (GREEN): Top Ctrl/ISO -> Right CTRL & 0-10V Duct -> KMR / XR4 / XR3
  const ctrlSrcCx = r1Centers[5].cx;
  s += drawRoute([[ctrlSrcCx, r1y+r1h], [ctrlSrcCx, hdMidY+11.5], [ctrlX, hdMidY+11.5], [ctrlX, hdLowY+11.5], [xr4X+xr4W*0.22, hdLowY+11.5], [xr4X+xr4W*0.22, t2y]], C.BLU, 1.15);

  s += drawRoute([[ctrlX, hdMidY+11.5], [inL+inW*0.45, hdMidY+11.5]], C.BLU, 0.9, '2 1');
  interDuctYs.forEach(dy => {

  // XR4 <-> Right Gland (KC IN / OVL 01-02 OUT)

  s += Txt(ldX+11.5, py+ph/2, `POWER DUCT ${ductSz} (380V 3PH ONLY)`, 4.7, C.RED, true, 'middle', -90);

  hdBoxes.forEach(([dy, lbl, isMot, bgCol]) => {

    s += R(inL + inW/2 - pillW/2, dy+1.5, pillW, 11, 'none', bgCol, 0);

  });
  if (hasCenterDuct) {
    s += R(inL + inW/2 - 4, sZoneTop + sZoneH/2 - 24, 8, 48, 'none', '#fef3c7', 0);
    s += Txt(inL + inW/2 + 1.6, sZoneTop + sZoneH/2, 'CENTER DUCT', 4.0, '#b45309', true, 'middle', -90);
  }
  interDuctYs.forEach((dy, ri) => {
    const r = ri + 1;
    if (hasCenterDuct) {
      const hw = inW/2 - 6, fs = hdMidH >= 10 ? 4.0 : 3.5;
      const lbl = `INTER-ROW ${ductSz} (PWR/MTR/CTRL)`;
      const pwL = Math.min(hw - 6, lbl.length * 2.55 + 10);
      s += R(inL + hw/2 - pwL/2, dy+0.8, pwL, hdMidH-1.6, 'none', '#f1f5f9', 0);
      s += R(inL + inW/2 + 6 + hw/2 - pwL/2, dy+0.8, pwL, hdMidH-1.6, 'none', '#f1f5f9', 0);

  s += R(xr2X+xr2W/2-40, hdLowY+2, 80, 10, 'none', '#fff7ed', 0) + Txt(xr2X+xr2W/2, hdLowY+9.2, 'MOTOR EXIT BAY (VCT 4x2.5)', 4.1, C_MTR, true, 'middle');
  s += R(rDropX+rDropW/2-38, hdLowY+2, 76, 10, 'none', '#e0f2fe', 0) + Txt(rDropX+rDropW/2, hdLowY+9.2, 'LOWER DUCT (CTRL & 0-10V)', 4.1, C.BLU, true, 'middle');

  const sched = [
    ['MCB1', `XR1 (1-3) ${sp.mWireS}`, `MCB2..${sp.grpCnt+1} (${sp.subWS})`, 'LEFT PWR / TOP'],

    ['SPS1 + MCB5', sp.nEc>0?'MCB4 220V -> SPS1':'All-AC (Direct 220V)', sp.nEc>0?`MCB5 DC(+24V BU / 0V BU-WH)`:'Red 220V Ctrl Bus', 'RIGHT CTRL'],
    sp.isInv10V
      ? ['SS1 Step1 (0V)', sp.nEc>0?'0-10V- Shunt (0.00V)':'N/A (All-AC Mode)', sp.nEc>0?'10-0V: 0V=100% Fail-Safe':'Direct ON/OFF', 'RIGHT CTRL']

function buildDrcSheet(sp) {
  let s = drawFrame(sp, t('sh_drc'), 12, sp.shIdx.sld);
  s += Txt(421, 45, t('drc_title'), 9.6, C.BLK, true, 'middle');

  const ds = sp.drcSummary;

  const stBg = ds.status === 'FAIL' ? '#fef2f2' : (ds.status === 'WARN' ? '#fffbeb' : '#f0fdf4');
  s += R(42, 54, 758, 34, stCol, stBg, 1.0);
  s += Txt(52, 69, `OVERALL DRC STATUS: ${ds.status}  |  PASS: ${ds.passCnt}   WARN: ${ds.warnCnt}   FAIL: ${ds.failCnt}   VERIFY OEM/SITE: ${ds.verifyCnt}`, 8.2, stCol, true);
  s += Txt(52, 82, sp.isBlocked ? `PRINT BLOCKED: ${sp.errors.join(' | ')}` : `Site Conditions: Ambient=${sp.ambTempC}C (Kt=${sp.kt}) | Isc=${sp.iscKa}kA | Field Run=${sp.fieldLenM}m | Opts: SPD=${sp.hasSpd?'ON':'OFF'}, ILK=${sp.hasDoorInterlock?'ON':'OFF'}, E-Stop=${sp.hasEstop?'ON':'OFF'}`, 6.5, sp.isBlocked?C.RED:C.BLK, true);

  // 9-Rule Design Verification Table
  s += R(42, 95, 758, 280, C.BLK, 'none', 0.9) + R(42, 95, 758, 17, C.BLK, C.BG, 0.75);

    s += Txt(dCols[i]+4, 106, h, 6.2, C.BLK, true)

    s += Txt(dCols[0]+4, ry+rowH*0.64, chk.code, 6.6, C.BLU, true);

    s += Txt(dCols[2]+4, ry+rowH*0.64, chk.actual.slice(0,29), 6.2, C.BLK);
    s += Txt(dCols[3]+4, ry+rowH*0.64, chk.limit.slice(0,24), 6.1, C.GRY, true);
    s += Txt(dCols[4]+4, ry+rowH*0.64, chk.status + (chk.verify?'*':''), 6.5, sc, true);
    s += Txt(dCols[5]+4, ry+rowH*0.64, chk.detail.slice(0,36), 6.0, chk.status==='FAIL'?C.RED:C.BLK, chk.verify);
  });

  // Bottom Mandatory Engineer Verification Callout Box
  s += R(42, 383, 758, 108, C.BLU, '#eff6ff', 0.9);
  s += Txt(52, 398, 'MANDATORY ENGINEERING SIGN-OFF & [VERIFY] CONSTANTS POLICY (NO GUESSED OEM DATA):', 7.4, C.BLU, true);
  s += Txt(52, 413, `1. Coordination (${sp.coordRef.typeRef}): ${sp.coordRef.note}. Verify backup fusing/cascading chart with ${sp.bm.label} prior to panel build.`, 6.6, C.BLK, true);
  s += Txt(52, 427, `2. Site & Load Parameters marked [VERIFY]: Site Isc=${sp.iscKa}kA, Field Motor Run=${sp.fieldLenM}m (ΔU=${sp.dvTotalPct}%), Fan Inrush=${sp.nEc>0?sp.ecFan.inrushMult:sp.acFan.inrushMult}x.`, 6.6, C.BLK);
  s += Txt(52, 441, `3. 24VDC PSU & Inrush: Selected ${sp.spsSpec} for ${sp.dcDesignA}A steady design load (${sp.dcPeakSurgeA}A pull-in surge; AC inrush ${sp.psuSel.inrushA}A @ 230V [VERIFY]).`, 6.6, C.BLK);
  s += Txt(52, 455, `4. Thermal & Airflow [VERIFY]: Loss=${sp.heatLossW}W @ Amb ${sp.ambTempC}C -> Need ${sp.reqAirflowM3h} m3/h vs ${sp.vfSpec} (${sp.vfSel.deratedM3h} m3/h filter-derated).`, 6.6, sp.thermalStatus!=='PASS'?C.RED:C.BLK, true);
  s += Txt(52, 469, `5. EC Fail-Safe Curve [VERIFY]: ${sp.ecFailSafeNote}. Confirm motor 0-10V / 10-0V factory jumper before commissioning.`, 6.6, sp.ecFailSafeStatus==='WARN'?C.RED:C.GRN, true);
  s += Txt(52, 483, `SIGN-OFF ENGINEER: __________________________    COORD / DATASHEET ATTACHED: [  ] YES    DATE: ____/____/2026`, 6.8, C.BLU, true);
  return s;
}
