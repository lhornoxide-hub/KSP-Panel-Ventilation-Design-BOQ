      s += L(fx-18,285,fx-18,325,hotCol,0.95) + L(fx-23,326,fx-18,345,C.BLK,1.05);
      s += Txt(fx-32,328,'13',6.0,C.GRY) + Txt(fx-32,346,'14',6.0,C.GRY) + Txt(fx-8,336,`RY${Math.floor((fnum-1)/2)+2}`,7,C.BLK,true) + Txt(fx-8,344,`/${ryRef}`,4.8,C.BLU,true) + L(fx-18,345,fx-18,385,hotCol,0.95) + Txt(fx-32,366,wn.ryOut,4.8,C.GRY);
    } else {
      s += L(fx-18,285,fx-18,385,hotCol,0.95);
    }
    s += R(fx-35,385,33,20,C.BLK,'#fff',1.0)+L(fx-35,405,fx-2,385,C.BLK,0.6)+Txt(fx-47,391,'A1',6.0,C.GRY)+Txt(fx-47,405,'A2',6.0,C.GRY)+Txt(fx-14,417,`KMR${fnum}`,7,C.BLK,true);
    s += drawRet(fx-18,405,fx-18,455,1.05)+Dot(fx-18,455,C.BLU,2.0);
    // Green RUN Pilot Lamp fed EXCLUSIVELY via KMR{fnum} 13-14 NO Aux Contact
    const rx = fx + 24;
    s += Dot(rx,168,hotCol,1.8)+L(rx,168,rx,325,hotCol,0.9)+L(rx-5,326,rx,345,C.GRN,1.05);
    s += Txt(rx-12,328,'13',4.8,C.GRY)+Txt(rx-12,346,'14',4.8,C.GRY)+Txt(rx+4,335,`KMR${fnum}`,5.0,C.GRN,true)+Txt(rx+4,343,'(NO AUX)',4.2,C.GRN)+Txt(rx+4,366,wn.runLamp,4.5,C.GRY);
    s += L(rx,345,rx,385,hotCol,0.95)+Cir(rx,395,10,C.GRN,'#fff',0.95)+L(rx-7,388,rx+7,402,C.GRN,0.75)+L(rx+7,388,rx-7,402,C.GRN,0.75);
    s += Txt(rx-12,385,'X1',5.4,C.GRY)+Txt(rx-12,411,'X2',5.4,C.GRY)+Txt(rx+12,398,`RUN${fnum}`,5.4,C.GRN,true)+drawRet(rx,405,rx,455,1.05)+Dot(rx,455,C.BLU,2.0);
    // Item 2: Red OVL Pilot Lamp + Sneak-Path Isolation (24VDC: Diode D{fnum} -> AL_BUS | 220VAC: Interposing Relay KA_O{fnum})
    const ox = fx + 62;
    s += Dot(ox,168,hotCol,2.0);
    s += L(ox,168,ox,265,hotCol,1.0)+L(ox-5,266,ox,285,C.BLK,1.0);
    s += Txt(ox-12,268,'97',5.5,C.GRY)+Txt(ox-12,286,'98',5.5,C.GRY)+Txt(ox+6,278,`QFR${fnum}`,5.6,C.RED,true)+Txt(ox-15,302,wn.ovlLamp,4.5,C.GRY);
    s += L(ox,285,ox,385,hotCol,0.95)+Cir(ox,395,10,C.RED,'#fff',0.95)+L(ox-7,388,ox+7,402,C.RED,0.75)+L(ox+7,388,ox-7,402,C.RED,0.75);
    s += Txt(ox-12,385,'X1',5.6,C.GRY)+Txt(ox-12,411,'X2',5.6,C.GRY)+Txt(ox+(isDc?12:11),isDc?398:413,`OVL${fnum}`,isDc?5.6:4.8,C.RED,true)+drawRet(ox,405,ox,455,1.05)+Dot(ox,455,C.BLU,2.0);
    if (isDc) {
      // Blocking diode tap from QFR 98 -> D{fnum} -> AL_BUS (/${sp.shIdx.prot})
      s += Dot(ox,324,hotCol,1.5)+L(ox,324,ox+14,324,hotCol,0.85);
      s += Poly([[ox+14,320.5],[ox+14,327.5],[ox+20,324]], C.BLK, hotCol, 0.7) + L(ox+20,320,ox+20,328,C.BLK,0.9) + L(ox+20,324,ox+28,324,hotCol,0.85);
      s += Txt(ox+14,317,`D${fnum}`,4.5,C.BLU,true)+Txt(ox+12,334,`AL/${sp.shIdx.prot}`,4.0,C.GRY);
    } else {
      // 220VAC Interposing Relay KA_O{fnum} in parallel with OVL{fnum} (its 13-14 NO feeds KRL on ${sp.shIdx.prot})
      s += Dot(ox,346,hotCol,1.5)+L(ox,346,ox+22,346,hotCol,0.8)+L(ox+22,346,ox+22,356,hotCol,0.8);
      s += R(ox+11,356,22,13,C.RED,'#fff5f5',0.75)+Txt(ox+22,365,`KA_O${fnum}`,3.8,C.RED,true,'middle');
      s += Txt(ox+22,376,`/${sp.shIdx.prot}`,4.0,C.BLU,true,'middle')+drawRet(ox+22,369,ox+22,455,0.75)+Dot(ox+22,455,C.BLU,1.4);
    }
    if (sp.hasOvlIndivLatch) {
      // Optional Individual OVL Latch (KL_O{fnum} 13-14 NO seal across QFR 97-98, reset via RST1)
      s += Txt(ox+12,350,`KL_O${fnum} (SEAL)`,3.7,C.RED,true);
    }
  });
  return s;
}

function buildTerminals(sp, sheetNo) {
  let s = drawFrame(sp, t('sh_term'), sheetNo, sp.includeManual ? `R${String(sheetNo+1).padStart(2,'0')}` : 'END');
  s += drawTerminalStrip(65, 85, 'XR1', ['MCB1-1','MCB1-3','MCB1-5','N-BAR','PE-BAR'], ['PWR L1','PWR L2','PWR L3','NEUTRAL','GROUND (PE)'], 13);
  s += Txt(46, 152, `XR1 SPEC: ${sp.wireEst.xr1Spec}`, 5.2, C.RED, true);

  const xr2Top=[], xr2Bot=[];
  for(let f=1;f<=sp.n;f++){ xr2Top.push(`QFR${f}-2`,`QFR${f}-4`,`QFR${f}-6`,'PE'); xr2Bot.push(`F${f}-U`,`F${f}-V`,`F${f}-W`,`F${f}-PE`); }
  const dense = sp.n > 20;
  let xr3Y0 = 265;
  if (xr2Top.length <= 32) {
    s += drawTerminalStrip(195, 75, 'XR2', xr2Top, xr2Bot, Math.min(12.0, 380.0 / xr2Top.length));
  } else {
    const mid2 = 4 * Math.ceil(sp.n / 2);
    s += drawTerminalStrip(195, dense?58:68, 'XR2A', xr2Top.slice(0,mid2), xr2Bot.slice(0,mid2), Math.min(12.0, 380.0 / mid2));
    s += drawTerminalStrip(195, dense?140:166, 'XR2B', xr2Top.slice(mid2), xr2Bot.slice(mid2), Math.min(12.0, 380.0 / (xr2Top.length - mid2)));
    xr3Y0 = dense ? 226 : 264;
  }

  if (sp.nEc > 0 || sp.hasRs485) {
    const xr3Top=[], xr3Bot=[];
    for(let i=1;i<=sp.nEc;i++){ xr3Top.push(`ISO${i}+`,`ISO${i}-`); xr3Bot.push(`EC${i}+`,`EC${i}-`); }
    if (sp.nEc > 0) { xr3Top.push('CTL1+','CTL1-'); xr3Bot.push('EXT+','EXT-'); }
    if (sp.hasRs485) { xr3Top.push('PM1+','PM1-','PM1-S'); xr3Bot.push('485A+','485B-','485-S'); }
    if (xr3Top.length <= 30) {
      s += drawTerminalStrip(195, xr3Y0, 'XR3', xr3Top, xr3Bot, Math.min(12.0, 380.0 / xr3Top.length));
    } else {
      const mid3 = Math.floor(xr3Top.length / 2);
      s += drawTerminalStrip(195, dense?224:260, 'XR3A', xr3Top.slice(0,mid3), xr3Bot.slice(0,mid3), Math.min(11.5, 380.0 / mid3));
      s += drawTerminalStrip(195, dense?310:352, 'XR3B', xr3Top.slice(mid3), xr3Bot.slice(mid3), Math.min(11.5, 380.0 / (xr3Top.length - mid3)));
    }
  }

  const xr4Top=[], xr4Bot=[];
  for(let i=1;i<=sp.n;i++){ xr4Top.push(`SAR${i}-A`); xr4Bot.push(`KC${i}`); }
  xr4Top.push('XR1-N','MCB4-2','KRL-23','KRL-24'); xr4Bot.push('N-EXT','L1-6A','OVL-01','OVL-02');
  if (sp.hasEstop) { xr4Top.push('PPR-14','KTR-IN'); xr4Bot.push('ES-1','ES-2'); }
  if (xr4Top.length <= 26) {
    s += drawTerminalStrip(195, 444, 'XR4', xr4Top, xr4Bot, Math.min(12.0, 380.0 / xr4Top.length));
  } else {
    const mid4 = Math.ceil(xr4Top.length / 2);
    s += drawTerminalStrip(195, 396, 'XR4A', xr4Top.slice(0,mid4), xr4Bot.slice(0,mid4), Math.min(12.0, 380.0 / mid4));
    s += drawTerminalStrip(195, 466, 'XR4B', xr4Top.slice(mid4), xr4Bot.slice(mid4), Math.min(12.0, 380.0 / (xr4Top.length - mid4)));
  }

  s += R(46,230,108,118,C.GRN,'#f2fcf5',0.8)+Txt(52,246,t('tm_bus'),5.7,C.GRN,true)+Txt(52,264,`PE-BAR: ${sp.busSize}`,5.5,C.GRN,true)+Txt(52,276,state.lang==='th'?`กราวด์ (${sp.busAmp})`:`Earth (${sp.busAmp})`,5.3);
  s += Txt(52,294,`N-BAR: ${sp.busSize}`,5.5,C.BLU,true)+Txt(52,306,state.lang==='th'?'บัสบาร์นิวทรัล (N)':'Neutral Busbar',5.3)+Txt(52,326,state.lang==='th'?'สายมอเตอร์ VCT 4C':'All F1..Fn VCT 4C',5.2,C.GRY)+Txt(52,338,t('tm_pe_note'),5.3,C.GRN,true);

  s += R(610,48,192,432,C.BLK,C.BG,0.8)+Txt(620,66,t('tm_leg'),7.5,C.BLU,true);
  const legItems = [
    `${sp.mainType} = ${sp.mainMod}`,
    ...(sp.nEc > 0 ? [`QFR_EC = ${sp.bm.mpcb_ec} (95-96NC/97-98NO)`] : []),
    ...(sp.nAc > 0 ? [`QFR_AC = ${sp.bm.mpcb_ac} (95-96NC/97-98NO)`] : []),
    `KMR = ${sp.contMod} (13-14 RUN)`,
    `PPR = ${sp.pprMod}`,
    ...(sp.nEc>0||sp.ctrlV==='24VDC'?[`SPS1 = ${sp.psuSel.id} + MCB5 DC`]:[]),
    `KTR = Stagger | KRL = Alarm Latch Only`,
    `${sp.ovlIsoTag} = ${sp.ovlIsoSpec.slice(0,28)}`,
    ...(sp.hasOvlIndivLatch ? [`KL_O = Indiv OVL Latch Relay (Opt)`] : []),
    ...(sp.hasSpd ? [`MCB_SPD = 4P 32AT Backup [VERIFY]`, `SPD1 = Type 2 Surge (40kA)`] : []),
    ...(sp.hasEstop ? [`E-STOP = 22mm Mushroom NC`] : []),
    'ISO = 4-Ch 0-10V Isolator','RY  = Control Relay 24V/220V','SAR = Selector MAN-0-AUT',
    'SS1 = Master Selector | SIG = Pot','HLR = Pilot Light 22mm | TS = 35C',
    `VF  = ${sp.vfSel.id} [VERIFY]`,
    `XR1 = ${sp.wireEst.xr1Spec}`,'XR2 = Motor VCT 4x2.5 (4P/Fan)',
    sp.hasRs485 ? 'XR3 = LIY-CY + Belden 9841' : 'XR3 = LIY-CY 2x0.75 (0-10V)',
    'XR4 = Orange Ext Ctrl + KRL Latch',
    ...(sp.hasPm ? [`PM1 = ${sp.pmMod} (${sp.hasRs485 ? 'RS485' : 'Local'})`] : []),
    `CAB = ${sp.cabSz}mm | DRC=${sp.shIdx.drc}`
  ];
  const legStep = Math.min(17.0, 405 / Math.max(1, legItems.length));
  legItems.forEach((li,idx)=> s += Txt(620, 82+idx*legStep, li.slice(0,38), 5.6));
  return s;
}

const mt = (k, vars={}, langOpt=null) => {
  const d = MANUAL_I18N[langOpt || state.lang] || MANUAL_I18N.en;
  let str = d[k] !== undefined ? d[k] : (MANUAL_I18N.en[k] || k);
  for (const [vk, vv] of Object.entries(vars)) str = str.replaceAll(`{${vk}}`, vv);
  return str;
};

const wrapLines = (str, maxLen) => {
  if (!str || str.length <= maxLen) return [str || ''];
  const cutChars = new Set([' ', '|', '/', ',', '、', '，', '。', ' ']);
  let split = -1;
  for (let i = Math.min(maxLen, str.length - 1); i >= Math.floor(maxLen * 0.45); i--) {
    if (cutChars.has(str[i])) { split = i + (str[i] === ' ' ? 0 : 1); break; }
  }
  if (split <= 0) {
    split = maxLen;
    while (split < str.length && /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E\u0300-\u036F]/.test(str[split])) split++;
  }
  const l1 = str.slice(0, split).trimEnd();
  const l2 = str.slice(split).trimStart();
  return l2 ? [l1, l2] : [l1];
};

    const motorSetStr = (sp.nEc > 0 && sp.nAc > 0) ? `EC ${sp.ecFan.amp}A / AC ${sp.acFan.amp}A` : (sp.nEc > 0 ? `EC ${sp.ecFan.amp}A` : `AC ${sp.acFan.amp}A`);
    const dFmt = desc
      .replaceAll('{brk}', String(sp.mainBrk))
      .replaceAll('{icu}', sp.mainIcu)
      .replaceAll('EC {ecA}A / AC {acA}A', motorSetStr)
      .replaceAll('{ecA}', String(sp.ecFan.amp))
      .replaceAll('{acA}', String(sp.acFan.amp))
      .replaceAll('{bus}', sp.busSize);
    if (idx > 0) s += L(42, ly, 476, ly, C.GRY, 0.45);
    s += R(50, ly+10, 18, 18, idx===1||idx===2?C.RED:(idx===4?C.GRN:C.BLU), idx===1||idx===2?'#fef2f2':(idx===4?'#f0fdf4':'#eff6ff'), 0.8);
    s += Txt(59, ly+22.5, `L${idx+1}`, 8.0, idx===1||idx===2?C.RED:(idx===4?C.GRN:C.BLU), true, 'middle');
    s += Txt(76, ly+22, title, 7.7, idx===1||idx===2?C.RED:(idx===4?C.GRN:C.BLU), true);
    wrapLines(dFmt, 62).slice(0,2).forEach((ln, li) => s += Txt(50, ly+43+li*14, ln, 7.1, C.BLK, li===0));
  });

  // 2. Pre-Commissioning Checklist (Right Top)
  s += R(484, 54, 316, 222, C.BLK, 'none', 0.9) + R(484, 54, 316, 18, C.BLK, '#eff6ff', 0.8) + Txt(492, 66, mt('sf_hdr2'), 8.1, C.BLU, true);
  mt('sf_pre').forEach((ln, idx) => {
    const py = 88 + idx * 31;
    if (idx > 0) s += L(484, py-11, 800, py-11, C.GRY, 0.35);
    wrapLines(ln, 48).slice(0,2).forEach((wln, li) => s += Txt(li===0?492:502, py+li*12.5, wln, 7.0, li===0?C.BLK:C.GRY, li===0&&(idx===0||idx===2)));
  });

  // 3. Maintenance & LOTO Safety Rules (Right Bottom)
  s += R(484, 284, 316, 208, C.RED, '#fffbfb', 0.9) + R(484, 284, 316, 18, C.RED, '#fef2f2', 0.8) + Txt(492, 296, mt('sf_hdr3'), 8.1, C.RED, true);
  mt('sf_loto').forEach((ln, idx) => {
    const ry = 318 + idx * 34;
    if (idx > 0) s += L(484, ry-11, 800, ry-11, '#fca5a5', 0.4);
    wrapLines(ln, 48).slice(0,2).forEach((wln, li) => s += Txt(li===0?492:500, ry+li*12.5, wln, 7.0, idx<3?C.RED:C.BLK, true));
  });
  return s;
}

function buildTroubleshooting(sp, sheetNo) {
  let s = drawFrame(sp, t('sh_tshoot'), sheetNo, 'END');
  s += Txt(421, 46, t('sh_tshoot'), 10.5, C.BLK, true, 'middle');

  // Main 8-Row Diagnostic Table
  s += R(42, 54, 758, 386, C.BLK, 'none', 0.9) + R(42, 54, 758, 18, C.BLK, C.BG, 0.8) + Txt(52, 66, mt('ts_hdr'), 8.4, C.BLU, true);
  const tCols = [42, 204, 354, 548, 800];
  s += R(42, 72, 758, 16, C.BLK, C.BG, 0.6);
  for (let i=1; i<tCols.length-1; i++) s += L(tCols[i], 72, tCols[i], 440, C.BLK, 0.5);
  mt('ts_cols').forEach((h, i) => s += Txt(tCols[i]+5, 83, h, 7.4, C.BLK, true));

  const tRows = mt('ts_rows');
  tRows.forEach((rw, idx) => {
    const ry = 88 + idx * 44.0;
    s += L(42, ry+44, 800, ry+44, C.GRY, 0.35);
    const colInd = idx===0?C.OYL:(idx===1||idx===2?C.RED:C.BLU);
    wrapLines(rw[0], 23).slice(0,2).forEach((ln, li) => s += Txt(tCols[0]+5, ry+18+li*14, ln, 7.2, C.BLK, true));
    wrapLines(rw[1], 21).slice(0,2).forEach((ln, li) => s += Txt(tCols[1]+5, ry+18+li*14, ln, 7.1, colInd, true));
    wrapLines(rw[2], 28).slice(0,2).forEach((ln, li) => s += Txt(tCols[2]+5, ry+18+li*14, ln, 7.0, li===0?C.BLK:C.GRY));
    wrapLines(rw[3], 35).slice(0,2).forEach((ln, li) => s += Txt(tCols[3]+5, ry+18+li*14, ln, 7.0, C.GRN, true));
  });

  // Emergency Override Banner
  s += R(42, 446, 758, 46, C.RED, '#fff7ed', 1.0);
  s += Txt(52, 460, mt('ts_emg_t'), 8.2, C.RED, true);
  wrapLines(mt('ts_emg_b'), 98).slice(0,2).forEach((ln, li) => s += Txt(52, 474+li*13, ln, 7.4, C.BLK, true));
  return s;
}

// --- MAIN ORCHESTRATION ---
function renderAll() {
  const sp = computeSpec();
  syncUiFromSpec(sp);
  const sheets = [
    buildCover(sp), buildContents(sp), buildSymbols(sp), buildAcronyms(sp),
    buildCubicleSpec(sp), buildLayout(sp), buildInternalDetail(sp), buildFabricationPlan(sp),
    buildBom(sp), buildWireEstimate(sp), buildLoadCalc(sp), buildDrcSheet(sp), buildSld(sp)
  ];
  let idx = 14;
  for (let g=0; g<sp.grpCnt; g++) sheets.push(buildPowerSheet(sp, g, idx++));
  sheets.push(buildProtection(sp, idx++));
  for (let ip=0; ip<sp.isoPages; ip++) sheets.push(build24vIso(sp, idx++, ip));
  for (let g=0; g<sp.grpCnt; g++) sheets.push(buildLadderSheet(sp, g, idx++));
  sheets.push(buildTerminals(sp, idx++));
  if (sp.includeManual) {
    sheets.push(buildSystemFunctions(sp, idx++));
    sheets.push(buildSafetyGuide(sp, idx++));
    sheets.push(buildTroubleshooting(sp, idx++));
  }

  if (state.activeSheet >= sheets.length) state.activeSheet = sheets.length - 1;

  // Render Top Metrics (including DRC verification badge)
  const drcCol = sp.drcSummary.status === 'FAIL' ? '#f87171' : (sp.drcSummary.status === 'WARN' ? '#fbbf24' : '#4ade80');
  document.getElementById('topMetrics').innerHTML = `
    <div class="metric-pill">${t('m_total')}: <b>${sp.n} ${t('fan_unit')}</b> (${sp.nEc} EC + ${sp.nAc} AC)</div>
    <div class="metric-pill">${t('m_load')}: <b>${sp.totalKw} kW</b> / <b>${sp.totalAmp} A</b> (125%: ${sp.iDesign}A)</div>
    <div class="metric-pill">${t('m_main')}: <b style="color:${sp.mainBrkExceeded?'#f87171':'inherit'}">${sp.mainBrk}AT</b> | ${t('m_cab')}: <b>${sp.cabSz}</b></div>
    <div class="metric-pill">${t('m_air')}: <b>${sp.totalCfm.toLocaleString()} CFM</b></div>
    <div class="metric-pill" style="border-color:${drcCol}">DRC (${sp.shIdx.drc}): <b style="color:${drcCol}">${sp.drcSummary.status}</b> (${sp.drcSummary.verifyCnt} VERIFY)</div>
    ${sp.nEc > 0 ? `<div class="metric-pill">EC SIG: <b>${sp.isInv10V ? '10-0V (0V=100%)' : '0-10V (10V=100%)'}</b></div>` : ''}
    ${sp.hasPm ? `<div class="metric-pill">${t('m_meter')}: <b>PM1 (${sp.hasRs485 ? 'RS485' : 'Local'})</b></div>` : ''}
  `;

  // Render Sheet Tabs
  document.getElementById('sheetTabs').innerHTML = sp.sheetList.map(([sno, des], i) =>
    `<button class="sheet-tab ${i===state.activeSheet?'active':''}" onclick="goSheet(${i})" title="${des}">${sno}</button>`
  ).join('');

  // Render SVG Sheets into DOM
  const scroll = document.getElementById('canvasScroll');
  scroll.innerHTML = sheets.map((svgInner, i) => `
    <div class="pdf-sheet ${(!state.showAll && i!==state.activeSheet)?'hidden-preview':''}" data-idx="${i}">
      <svg viewBox="0 0 842 595" font-family="Sarabun, Tahoma, 'Leelawadee UI', 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif" data-cad-font="KSP-Font.shx" xmlns="http://www.w3.org/2000/svg">${svgInner}</svg>
    </div>
  `).join('');

  document.getElementById('lblSheetPos').textContent = `R${String(state.activeSheet+1).padStart(2,'0')} / R${String(sheets.length).padStart(2,'0')}`;
  applyZoom();
}

function applyZoom() {
  const val = document.getElementById('selZoom').value;
  const scroll = document.getElementById('canvasScroll');
  let wPx = 842 * 1.25;
  if (val === 'fit') wPx = Math.max(400, scroll.clientWidth - 48);
  else wPx = 842 * parseFloat(val);
  document.querySelectorAll('.pdf-sheet').forEach(el => {
    el.style.width = wPx + 'px';
    el.style.height = (wPx * 595 / 842) + 'px';
  });
}

function goSheet(i) { state.activeSheet = i; state.showAll = false; renderAll(); }
function stepSheet(d) { state.activeSheet = Math.max(0, Math.min(computeSpec().totalSheets - 1, state.activeSheet + d)); state.showAll = false; renderAll(); }
function toggleAllView() { state.showAll = !state.showAll; document.getElementById('btnAllView').textContent = state.showAll ? t('ui_viewone') : t('ui_viewall'); renderAll(); }

function setMode(m) {
  state.mode = m;
  ['mode_all_ec','mode_all_ac','mode_hybrid','mode_manual'].forEach(id => document.getElementById(id).classList.remove('active'));
  const total = (parseInt(document.getElementById('inEcCount').value)||0) + (parseInt(document.getElementById('inAcCount').value)||0) || 8;
  if (m === 'All-EC') { document.getElementById('mode_all_ec').classList.add('active'); document.getElementById('inEcCount').value = total; document.getElementById('inAcCount').value = 0; }
  else if (m === 'All-AC') { document.getElementById('mode_all_ac').classList.add('active'); document.getElementById('inEcCount').value = 0; document.getElementById('inAcCount').value = total; }
  else if (m === 'Hybrid_30EC') { document.getElementById('mode_hybrid').classList.add('active'); const ec = Math.max(1, Math.round(total*0.3)); document.getElementById('inEcCount').value = ec; document.getElementById('inAcCount').value = Math.max(1, total - ec); }
  else { document.getElementById('mode_manual').classList.add('active'); document.getElementById('inEcCount').focus(); }
  renderAll();
}

function applyHybrid30() { setMode('Hybrid_30EC'); }

function setPresetTotal(tot) {
  if (state.mode === 'All-EC') { document.getElementById('inEcCount').value = tot; document.getElementById('inAcCount').value = 0; }
  else if (state.mode === 'All-AC') { document.getElementById('inEcCount').value = 0; document.getElementById('inAcCount').value = tot; }
  else { const ec = Math.max(1, Math.round(tot*0.3)); document.getElementById('inEcCount').value = ec; document.getElementById('inAcCount').value = tot - ec; }
  document.querySelectorAll('#fanPresets .chip').forEach(c => c.classList.toggle('active', parseInt(c.dataset.n)===tot));
  renderAll();
}

function onManualFanChange() {
  const ec = parseInt(document.getElementById('inEcCount').value)||0;
  const ac = parseInt(document.getElementById('inAcCount').value)||0;
  const tot = ec + ac;
  ['mode_all_ec','mode_all_ac','mode_hybrid','mode_manual'].forEach(id => document.getElementById(id).classList.remove('active'));
  document.getElementById('mode_manual').classList.add('active');
  document.querySelectorAll('#fanPresets .chip').forEach(c => c.classList.toggle('active', parseInt(c.dataset.n)===tot));
  renderAll();
}

function setSource(bk) {
  state.bkey = bk;
  ['master','th','vn','cn'].forEach(k => document.getElementById(`src_${k}`).classList.toggle('active', k===bk));
  renderAll();
}

function setPmOpt(on) {
  state.hasPm = !!on;
  if (!state.hasPm) state.useRs485 = false;
  renderAll();
}

function setRs485Opt(on) {
  state.useRs485 = !!on;
  if (state.useRs485) state.hasPm = true;
  renderAll();
}

function setManualOpt(on) {
  state.includeManual = !!on;
  renderAll();
}

function setEcLogic(logic) {
  state.ecLogic = logic === '0-10v' ? '0-10v' : '10-0v';
  renderAll();
}

function setOptFlag(key, on) {
  state[key] = !!on;
  renderAll();
}

function onModelSelect(which) {
  if (which === 'EC') document.getElementById('customEcFields').style.display = document.getElementById('selEcModel').value==='custom_ec'?'grid':'none';
  else document.getElementById('customAcFields').style.display = document.getElementById('selAcModel').value==='custom_ac'?'grid':'none';
  renderAll();
}

function printFullReport() {
  renderAll();
  const sp = computeSpec();
  if (sp.isBlocked) {
    alert('⛔ ' + sp.errors.join('\n⛔ '));
    return false;
  }
  const prevTitle = document.title;
  document.title = `${sp.codeNo}_${sp.mode}_${sp.n}Fans_REV3`;
  window.print();
  setTimeout(() => document.title = prevTitle, 500);
  return true;
}

function savePreset() {
  localStorage.setItem('ksp_offline_studio_v1', JSON.stringify({
    lang: state.lang,
    ec: document.getElementById('inEcCount').value, ac: document.getElementById('inAcCount').value,
    bkey: state.bkey, cab: document.getElementById('selCab').value,
    ctrlV: document.getElementById('selCtrlV').value, ppr: document.getElementById('selPpr').value,
    ambTempC: document.getElementById('inAmbTemp').value,
    iscKa: document.getElementById('inIscKa').value,
    fieldLenM: document.getElementById('inFieldLenM').value,
    hasPm: state.hasPm, useRs485: state.useRs485, includeManual: state.includeManual, ecLogic: state.ecLogic,
    hasSpd: state.hasSpd, hasDoorInterlock: state.hasDoorInterlock, hasEstop: state.hasEstop,
    hasOvlIndivLatch: !!state.hasOvlIndivLatch,

function resetPreset() {
  localStorage.removeItem('ksp_offline_studio_v1');
  location.reload();
}

function loadSavedPreset() {
  try {
    if (location.hash && location.hash.length > 2) {
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.get('lang') && I18N[p.get('lang')]) state.lang = p.get('lang');
      if (p.has('ec')) document.getElementById('inEcCount').value = p.get('ec');
      if (p.has('ac')) document.getElementById('inAcCount').value = p.get('ac');
      if (p.get('ecMod')) document.getElementById('selEcModel').value = p.get('ecMod');
      if (p.get('acMod')) document.getElementById('selAcModel').value = p.get('acMod');
      if (p.get('bkey') && BRAND_MODELS[p.get('bkey')]) setSource(p.get('bkey'));
      if (p.get('pm') === '1' || p.get('pm') === 'true') state.hasPm = true;
      if (p.get('rs485') === 'pm_rs485' || p.get('rs485') === '1' || p.get('rs485') === 'true') { state.hasPm = true; state.useRs485 = true; }
      else if (p.get('rs485') === 'pm_only') { state.hasPm = true; state.useRs485 = false; }
      else if (p.get('rs485') === 'none' || p.get('rs485') === '0') { state.useRs485 = false; }
      if (p.has('manual')) state.includeManual = p.get('manual') !== '0' && p.get('manual') !== 'false';
      if (p.get('ecLogic') === '0-10v' || p.get('ecLogic') === '10-0v') state.ecLogic = p.get('ecLogic');
      if (p.get('spd') === '1') state.hasSpd = true;
      if (p.get('ilk') === '1') state.hasDoorInterlock = true;
      if (p.get('estop') === '1') state.hasEstop = true;
      if (p.has('amb')) document.getElementById('inAmbTemp').value = p.get('amb');
      if (p.has('isc')) document.getElementById('inIscKa').value = p.get('isc');
      if (p.has('flen')) document.getElementById('inFieldLenM').value = p.get('flen');
      onManualFanChange();
      return;
    }
    const raw = localStorage.getItem('ksp_offline_studio_v1');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.lang && I18N[d.lang]) state.lang = d.lang;
    if (d.includeManual !== undefined) state.includeManual = !!d.includeManual;
    if (d.ecLogic === '0-10v' || d.ecLogic === '10-0v') state.ecLogic = d.ecLogic;
    if (d.hasSpd !== undefined) state.hasSpd = !!d.hasSpd;
    if (d.hasDoorInterlock !== undefined) state.hasDoorInterlock = !!d.hasDoorInterlock;
    if (d.hasEstop !== undefined) state.hasEstop = !!d.hasEstop;
    if (d.hasOvlIndivLatch !== undefined) state.hasOvlIndivLatch = !!d.hasOvlIndivLatch;
    if (d.ambTempC !== undefined) document.getElementById('inAmbTemp').value = d.ambTempC;
    if (d.iscKa !== undefined) document.getElementById('inIscKa').value = d.iscKa;
    if (d.fieldLenM !== undefined) document.getElementById('inFieldLenM').value = d.fieldLenM;
    if (d.ec !== undefined) document.getElementById('inEcCount').value = d.ec;
    if (d.ac !== undefined) document.getElementById('inAcCount').value = d.ac;
    if (d.cab) document.getElementById('selCab').value = d.cab;
    if (d.ctrlV) document.getElementById('selCtrlV').value = d.ctrlV;
    if (d.ppr) document.getElementById('selPpr').value = d.ppr;
    if (d.hasPm !== undefined) state.hasPm = !!d.hasPm;
    if (d.useRs485 !== undefined) state.useRs485 = !!d.useRs485;
    if (d.rs485 === 'pm_rs485') { state.hasPm = true; state.useRs485 = true; }
    if (d.ecMod) document.getElementById('selEcModel').value = d.ecMod;
    if (d.acMod) document.getElementById('selAcModel').value = d.acMod;
    if (d.customer !== undefined) document.getElementById('inCustomer').value = d.customer;
    if (d.code !== undefined) document.getElementById('inCode').value = d.code;
    if (d.draftman !== undefined) document.getElementById('inDraftman').value = d.draftman;
    if (d.approved !== undefined) document.getElementById('inApproved').value = d.approved;
    if (d.bkey && BRAND_MODELS[d.bkey]) setSource(d.bkey);
    onManualFanChange();
  } catch (e) {}
}

function runSelfTest(inputOpt=null, testOpts={}) {
  const sp = computeSpec(inputOpt);
  const suites = [];

  // T1: Wire-number uniqueness across distinct nets
  let t1Ok = true, t1Msg = '';
  try {
    const seen = new Map();
    const reg = (net, wn) => {
      if (wn === undefined || wn === null || String(wn).trim() === '') throw new Error(`Empty wire number on ${net}`);
      const k = String(wn);
      if (seen.has(k)) throw new Error(`Duplicate wire ${k} on ${seen.get(k)} and ${net}`);
      seen.set(k, net);
    };
    Object.entries(sp.wireNums.nets).forEach(([k, v]) => reg(k, v));
    if (seen.size !== Object.keys(sp.wireNums.nets).length) throw new Error(`Expected ${Object.keys(sp.wireNums.nets).length} nets, got ${seen.size}`);
    t1Msg = `${seen.size} unique wire numbers verified across all nets (${sp.n} fans, ${sp.ctrlV}).`;
  } catch (e) { t1Ok = false; t1Msg = e.message; }
  suites.push({ id:'T1', name:'Wire-Number Uniqueness (No Duplicates)', passed: t1Ok, details: t1Msg });

  // Render key sheets for T2, T3, T5
  const pwr0 = buildPowerSheet(sp, 0, 14);
  const pwr1 = sp.grpCnt > 1 ? buildPowerSheet(sp, 1, 15) : '';
  const protSvg = buildProtection(sp, 14 + sp.grpCnt);
  const lad0 = buildLadderSheet(sp, 0, 14 + sp.grpCnt + sp.isoPages);
  const bomSvg = buildBom(sp);

  // T2: No disconnected / floating wires or gaps
  let t2Ok = true, t2Msg = '';
  try {
    const checks = [
      [pwr0.includes('x1="124" y1="86" x2="124" y2="112"') && pwr0.includes('cx="124" cy="102"'), 'XR1-4 Neutral not wired to N-BAR'],
      [sp.grpCnt <= 1 || (pwr1.includes('y1="162"') && !pwr1.includes('y1="172"')), 'Group 2+ MCB->Busbar gap detected'],
      [protSvg.includes('cx="206" cy="160"') && !protSvg.includes('cx="254" cy="92"'), 'PPR1 Pin 11 not fed post-FUR1'],
      [!sp.hasSpd || (pwr0.includes('MCB_SPD') && pwr0.includes('SPD1') && pwr0.includes('PE 10mm2')), 'SPD1/MCB_SPD/PE wiring incomplete'],
      [protSvg.includes('RST1 (NC)') && protSvg.includes('KRL SEAL') && protSvg.includes('KRL NO') && protSvg.includes('XR4:01') && protSvg.includes('XR4:02'), 'KRL latch circuit incomplete'],
      [!/\bNaN\b|\bundefined\b/.test(pwr0 + pwr1 + protSvg + lad0 + bomSvg), 'NaN or undefined found in SVG']
    ];
    const failed = checks.filter(c => !c[0]).map(c => c[1]);
    if (failed.length) throw new Error(failed.join('; '));
    t2Msg = 'All terminals, risers, PPR1 post-FUR1, SPD/PE, and KRL latch connections continuous.';
  } catch (e) { t2Ok = false; t2Msg = e.message; }
  suites.push({ id:'T2', name:'Wire Continuity & Geometry (No Floating Wires)', passed: t2Ok, details: t2Msg });

  // T3: Pin/Terminal Net Consistency (catches R1 dual-net short on QFR:97!)
  let t3Ok = true, t3Msg = '';
  try {
    const pinNets = new Map();
    const bindPin = (pin, net) => {
      if (!pinNets.has(pin)) pinNets.set(pin, new Set());
      pinNets.get(pin).add(net);
    };
    // Inspect Ladder sheet for QFR{f}:97 -> LAD_GRP{g}_BUS
    const ladFans = Math.min(4, sp.n);
    for (let f = 1; f <= ladFans; f++) {
      if (lad0.includes(`QFR${f}`) && lad0.includes('97') && lad0.includes('98')) {
        bindPin(`QFR${f}:97`, `LAD_GRP1_BUS(W${sp.wireNums.grpBus[0]})`);
        bindPin(`QFR${f}:98`, `LAD_F${f}_OVL`);
      }
    }
    // Inspect Protection sheet: in 24VDC mode, QFR{i} contacts MUST NOT appear wired to +24V rail on Protection!
    const protHasQfrContacts = /<text[^>]*>QFR\d+<\/text>/.test(protSvg) || !!testOpts.injectR1Bug;
    if (sp.ctrlV === '24VDC' && protHasQfrContacts) {
      bindPin('QFR1:97', 'PROT_+24V_RAW_RAIL');
    }
    const conflicts = [];
    for (const [pin, nets] of pinNets.entries()) {
      if (nets.size > 1) conflicts.push(`${pin} tied to [${[...nets].join(' vs ')}]`);
    }
    if (conflicts.length) throw new Error(`Dual-net pin conflict (R1): ${conflicts.join('; ')}`);
    t3Msg = `${pinNets.size} terminal pins verified single-net (zero QFR:97 dual-net conflict).`;
  } catch (e) { t3Ok = false; t3Msg = e.message; }
  suites.push({ id:'T3', name:'Terminal/Pin Net Consistency (R1 Guard)', passed: t3Ok, details: t3Msg });

  // T4: Single-fan overload logic simulation
  let t4Ok = true, t4Msg = '';
  try {
    for (let tripped = 1; tripped <= sp.n; tripped++) {
      const edges = [];
      for (let i = 1; i <= sp.n; i++) {
        if (i !== tripped) edges.push(['SRC', `KMR${i}`]);
        if (i === tripped) edges.push(['SRC', `QFR${i}_98`]);
        edges.push([`QFR${i}_98`, `OVL${i}`]);
        if (sp.ctrlV === '24VDC') edges.push([`QFR${i}_98`, 'AL_BUS']);
        else edges.push([`QFR${i}_98`, `KA_O${i}`]);
      }
      const bfs = (starts, es) => {
        const v = new Set(starts), q = [...starts];
        while (q.length) {
          const c = q.shift();
          for (const [a, b] of es) if (a === c && !v.has(b)) { v.add(b); q.push(b); }
        }
        return v;
      };
      let en = bfs(['SRC'], edges);
      if (sp.ctrlV === '220VAC') {
        for (let i = 1; i <= sp.n; i++) if (en.has(`KA_O${i}`)) edges.push(['SRC', 'AL_BUS']);
        en = bfs(['SRC'], edges);
      }
      if (en.has('AL_BUS')) { edges.push(['AL_BUS', 'KRL']); en = bfs(['SRC'], edges); }
      const ovlOn = [];
      let healthyRun = 0;
      for (let i = 1; i <= sp.n; i++) {
        if (en.has(`OVL${i}`)) ovlOn.push(i);
        if (en.has(`KMR${i}`)) healthyRun++;
      }
      if (ovlOn.length !== 1 || ovlOn[0] !== tripped) throw new Error(`Sneak-path on F${tripped}: OVL=${JSON.stringify(ovlOn)}`);
      if (!en.has('KRL')) throw new Error(`KRL failed to latch on F${tripped}`);
      if (healthyRun !== sp.n - 1) throw new Error(`Healthy fans stopped on F${tripped}: ${healthyRun}/${sp.n - 1}`);
    }
    t4Msg = `Simulated all ${sp.n} single-fan trips (${sp.ctrlV}): 1 OVL ON, KRL latched, ${sp.n-1} healthy fans keep running.`;
  } catch (e) { t4Ok = false; t4Msg = e.message; }
  suites.push({ id:'T4', name:'Single-Fan Overload Logic Simulation', passed: t4Ok, details: t4Msg });

  // T5: BOM, 4-language I18N, and sequential sheet numbering
  let t5Ok = true, t5Msg = '';
  try {
    for (let i = 1; i <= sp.totalSheets; i++) {
      const tag = 'R' + String(i).padStart(2, '0');
      if (!sp.sheetList[i - 1] || sp.sheetList[i - 1][0] !== tag) throw new Error(`Sheet sequence mismatch at ${tag}`);
    }
    for (const lg of ['th', 'en', 'vi', 'zh']) {
      const m1 = Object.keys(I18N.en).filter(k => I18N[lg][k] === undefined);
      const m2 = Object.keys(MANUAL_I18N.en).filter(k => MANUAL_I18N[lg][k] === undefined);
      if (m1.length || m2.length) throw new Error(`Missing keys in ${lg}: ${[...m1, ...m2].join(',')}`);
    }
    if (!bomSvg.includes(sp.ovlIsoTag)) throw new Error(`BOM missing ${sp.ovlIsoTag}`);
    if (sp.hasSpd && !bomSvg.includes('MCB_SPD')) throw new Error('BOM missing MCB_SPD');
    if (sp.hasOvlIndivLatch && !bomSvg.includes('KL_O1')) throw new Error('BOM missing KL_O1');
    t5Msg = `${sp.totalSheets} sequential sheets (R01..R${String(sp.totalSheets).padStart(2,'0')}), 4 languages, and BOM synchronized.`;
  } catch (e) { t5Ok = false; t5Msg = e.message; }
  suites.push({ id:'T5', name:'BOM, 4-Language I18N & Sheet Sequence', passed: t5Ok, details: t5Msg });

  const passed = suites.every(s => s.passed);
  return { passed, suites, summary: `${suites.filter(s => s.passed).length}/${suites.length} Suites Passed` };
}

function onRunSelfTestClick() {
  const res = runSelfTest();
  const titleEl = document.getElementById('stTitle');
  const bodyEl = document.getElementById('stBody');
  if (titleEl) titleEl.textContent = `Self-Test Report (T1–T5) — ${res.summary}`;
  if (bodyEl) {
    bodyEl.innerHTML = res.suites.map(s => `
      <div class="st-row ${s.passed ? 'pass' : 'fail'}">
        <div><span class="st-badge ${s.passed ? 'pass' : 'fail'}">${s.passed ? 'PASS' : 'FAIL'}</span><b>${s.id}: ${s.name}</b></div>
        <div style="color:#cbd5e1;margin-top:4px">${s.details}</div>
      </div>
    `).join('');
  }
  const modal = document.getElementById('selfTestModal');
  if (modal) modal.classList.add('open');
}

}
